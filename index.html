<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amalan Ramadhan Multi-School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Error Handler Global
    window.onerror = function(msg, url, line, col, error) {
        const app = document.getElementById('app');
        if (app) {
            app.innerHTML = `
                <div style="padding: 20px; color: red; font-family: sans-serif; text-align: center;">
                    <h3 class="text-lg font-bold">Terjadi Kesalahan Aplikasi</h3>
                    <p class="text-sm">${msg}</p>
                    <button onclick="localStorage.clear(); location.reload();" class="mt-4 px-4 py-2 bg-gray-800 text-white rounded-lg cursor-pointer">
                        Reset & Reload Aplikasi
                    </button>
                </div>
            `;
        }
        return false;
    };

    window.elementSdk = {
        config: {},
        init: (options) => {
            if (options.onConfigChange) options.onConfigChange(options.defaultConfig);
        },
        setConfig: (conf) => { Object.assign(window.elementSdk.config, conf); }
    };
    window.dataSdk = {
        init: () => Promise.resolve({ isOk: true }),
        create: (data) => Promise.resolve({ isOk: true })
    };
  </script>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .tab-button.active { border-bottom: 3px solid; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        
        @keyframes pulseBlue {
          0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
          70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
          100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        @keyframes pulseGreen {
          0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
          70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
          100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .pulse-blue { animation: pulseBlue 2s infinite; }
        .pulse-green { animation: pulseGreen 2s infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
 </head>
 <body class="h-full bg-gray-50">
  <div id="app" class="w-full h-full overflow-auto"></div>
  <script>
        /**
         * KONFIGURASI SISTEM
         */
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7IjJZdiHITMGhSMSWWneT1E9qIWUOBwkuJv4krc4_IPk-pQYA1hgFXyNfMu9oKjr6Bw/exec';
        const INFO_DRIVE_URL = 'https://drive.google.com/drive/folders/1p_MFakH19ATtDCS7zxaZ89zIAV_t6czu?usp=drive_link';
        
        function getSchoolId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            if (!id && window.location.href.includes('id=')) {
                id = window.location.href.split('id=')[1].split('&')[0];
            }
            if (!id) {
                id = sessionStorage.getItem('current_school_id');
            }
            return id;
        }

        let SCHOOL_ID = getSchoolId();

        const defaultConfig = {
            app_title: "Amalan Ramadhan Siswa",
            welcome_message: "Selamat datang di aplikasi Amalan Ramadhan",
            background_color: "#10b981",
            surface_color: "#ffffff",
            text_color: "#1f2937",
            primary_action_color: "#059669",
            secondary_action_color: "#6b7280"
        };

        let currentUser = null;
        let currentTab = 'Shalat Fardu';
        let allRecords = [];
        let hasInfoFiles = false; 
        const categories = ['Shalat Fardu', 'Tarawih', 'Puasa', 'Tadarus', 'Ceramah'];

        let shalatData = {};
        let tarawihData = {};
        let puasaData = {};
        let tadarusData = {};
        let ceramahData = {};

        function initDefaultData() {
            for (let i = 1; i <= 30; i++) {
                shalatData[i] = { 'Subuh': null, 'Dzuhur': null, 'Ashar': null, 'Maghrib': null, 'Isya': null };
                tarawihData[i] = { status: null, tempat: null };
                puasaData[i] = null;
                tadarusData[i] = { pilihan: null, surat: '', ayat: '', ustadz: '' };
                ceramahData[i] = { penceramah: '', tempat: '', media: '', ringkasan: '' };
            }
        }
        initDefaultData();

        const safeGetStorage = (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } };
        const safeSetStorage = (key, val) => { try { localStorage.setItem(key, val); } catch (e) {} };
        const safeRemoveStorage = (key) => { try { localStorage.removeItem(key); } catch (e) {} };
        
        function loadAllRecords() {
            const saved = safeGetStorage('ramadhanAllRecords');
            if (saved) { try { allRecords = JSON.parse(saved); } catch(e) {} }
        }
        function saveAllRecords() { safeSetStorage('ramadhanAllRecords', JSON.stringify(allRecords)); }

        function getUserStateKey() {
            if (!currentUser) return null;
            return `ramadhanState_${currentUser.nama.replace(/\s+/g, '_')}_${currentUser.kelas}`;
        }

        function loadUserState() {
            const key = getUserStateKey();
            if (!key) return;
            const savedState = safeGetStorage(key);
            if (savedState) {
                try {
                    const state = JSON.parse(savedState);
                    if (state.shalatData) shalatData = state.shalatData;
                    if (state.tarawihData) tarawihData = state.tarawihData;
                    if (state.puasaData) puasaData = state.puasaData;
                    if (state.tadarusData) tadarusData = state.tadarusData;
                    if (state.ceramahData) ceramahData = state.ceramahData;
                } catch (e) { initDefaultData(); }
            } else { initDefaultData(); }
        }

        function saveUserState() {
            const key = getUserStateKey();
            if (!key || isAdmin()) return;
            safeSetStorage(key, JSON.stringify({ shalatData, tarawihData, puasaData, tadarusData, ceramahData }));
        }

        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `toast fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-xl text-white z-[100] font-bold ${isSuccess ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.classList.add('opacity-0', 'transition-opacity'); setTimeout(() => toast.remove(), 500); }, 2500);
        }

        function showConfirmDialog(message, onConfirm, isDanger = false) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex items-center justify-center p-4 transition-all duration-300';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl p-6 max-sm w-full transform transition-all scale-100">
                    <div class="text-center">
                        <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full ${isDanger ? 'bg-rose-100' : 'bg-blue-100'} mb-4">
                            <svg class="h-8 w-8 ${isDanger ? 'text-rose-600' : 'text-blue-600'}" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-2">Konfirmasi</h3>
                        <p class="text-sm text-gray-500 mb-6">${message}</p>
                        <div class="flex gap-3">
                            <button class="modal-cancel-btn flex-1 px-4 py-3 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 font-bold transition-colors">Batal</button>
                            <button class="modal-confirm-btn flex-1 px-4 py-3 text-white rounded-xl font-bold shadow-lg ${isDanger ? 'bg-rose-600' : 'bg-blue-600'} transition-transform active:scale-95">Ya, Lanjutkan</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.querySelector('.modal-cancel-btn').onclick = () => overlay.remove();
            overlay.querySelector('.modal-confirm-btn').onclick = () => { overlay.remove(); onConfirm(); };
        }

        function handleLogout() {
            showConfirmDialog("Apakah Anda yakin ingin keluar?", () => {
                safeRemoveStorage('ramadhanUser');
                currentUser = null;
                showLoginPage();
                showToast("Berhasil keluar.");
            });
        }

        function isAdmin() { return currentUser && currentUser.nama === '*'; }

        // --- SISTEM PENDAFTARAN SEKOLAH ---
        function renderRegistration() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-6 bg-emerald-600">
                    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-black text-slate-800">Daftar Sekolah</h1>
                            <p class="text-slate-500 text-sm mt-2">Silahkan isi dengan gmail aktif dan Nama Sekolah untuk mendapatkan link akses.</p>
                        </div>
                        <form id="regForm" class="space-y-4">
                            <input type="email" id="regEmail" placeholder="Gmail Guru" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all font-semibold" required>
                            <input type="text" id="regSchool" placeholder="Nama Sekolah (Contoh: SMPN 1 Bandung)" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all font-semibold" required>
                            <button type="submit" id="regBtn" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-black shadow-lg hover:bg-emerald-700 transition-all active:scale-95">DAFTAR SEKARANG</button>
                        </form>
                        <div id="regResult" class="mt-8 hidden p-6 bg-slate-900 rounded-3xl text-white">
                            <p class="text-[10px] font-bold text-emerald-400 uppercase mb-2 tracking-widest">Link Akses Siswa & Guru:</p>
                            <textarea id="shareLink" class="w-full p-3 text-[11px] font-mono border rounded-xl bg-slate-800 border-slate-700 h-24 mb-3 focus:outline-none" readonly></textarea>
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <button onclick="downloadLink()" class="py-3 bg-blue-600 text-white rounded-xl font-bold pulse-blue shadow-lg text-xs">Unduh Info</button>
                                <button onclick="copyLink()" class="py-3 bg-emerald-600 text-white rounded-xl font-bold pulse-green shadow-lg text-xs">Salin Link</button>
                            </div>
                            <button onclick="location.reload()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold shadow-lg border border-slate-600">SELESAI</button>
                        </div>
                    </div>
                </div>`;

            document.getElementById('regForm').onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('regBtn');
                const emailInput = document.getElementById('regEmail').value.trim();
                const schoolInput = document.getElementById('regSchool').value.trim();
                
                btn.disabled = true; btn.textContent = "Memproses...";
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ 
                        action: 'registerTeacher', 
                        email: emailInput,
                        nama_sekolah: schoolInput 
                    })});
                    const data = await res.json();
                    if (data.ss_id) {
                        document.getElementById('regResult').classList.remove('hidden');
                        sessionStorage.setItem('current_school_id', data.ss_id);
                        document.getElementById('shareLink').value = window.location.href.split('?')[0] + '?id=' + data.ss_id;
                        btn.textContent = "Berhasil Terdaftar!";
                        showToast("Pendaftaran Berhasil!");
                    } else {
                        throw new Error(data.message || "Gagal daftar");
                    }
                } catch (err) { 
                    btn.disabled = false; btn.textContent = "Coba Lagi"; 
                    showToast("Kesalahan: " + err.message, false);
                }
            };
        }

        window.copyLink = () => {
            const text = document.getElementById('shareLink').value;
            const runFallback = () => {
                const ta = document.createElement("textarea"); ta.value = text;
                ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); showToast("Link disalin!"); } catch (err) { showToast("Gagal menyalin.", false); }
                document.body.removeChild(ta);
            };
            if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast("Link disalin!")).catch(() => runFallback());
            else runFallback();
        };

        window.downloadLink = () => {
            const link = document.getElementById('shareLink').value;
            const textContent = `INFO AKSES APLIKASI AMALAN RAMADHAN\n-----------------------------------------\nLINK SISWA : \n${link}\n\nCARA MASUK KE PANEL GURU:\n-----------------------------------------\n1. Buka link di atas.\n2. Nama Lengkap Siswa : * (tanda bintang)\n3. Klik Masuk.\n\nGunakan Panel Guru untuk memantau rekap amalan dan mencetak laporan siswa secara otomatis.`;
            const blob = new Blob([textContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'Instruksi_Akses_Aplikasi.txt'; a.click();
            window.URL.revokeObjectURL(url);
            showToast("Instruksi diunduh!");
        };

        async function syncUserFromCloud() {
            if (!currentUser || isAdmin() || !SCHOOL_ID) return;
            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'read');
                url.searchParams.append('ss_id', SCHOOL_ID);
                url.searchParams.append('nama', currentUser.nama);
                url.searchParams.append('kelas', currentUser.kelas);
                
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === 'success' && Array.isArray(result.data)) {
                    result.data.forEach(item => {
                        const tgl = item.tanggal;
                        const cat = item.kategori;
                        let detail = item.detail || item.hadir;
                        if (typeof detail === 'string') { try { detail = JSON.parse(detail); } catch(e) {} }
                        
                        if (cat === 'Shalat Fardu') shalatData[tgl] = { ...shalatData[tgl], ...detail };
                        else if (cat === 'Tarawih') tarawihData[tgl] = { ...tarawihData[tgl], ...detail };
                        else if (cat === 'Puasa') puasaData[tgl] = detail.status || detail;
                        else if (cat === 'Tadarus') tadarusData[tgl] = { ...tadarusData[tgl], ...detail };
                        else if (cat === 'Ceramah') ceramahData[tgl] = { ...ceramahData[tgl], ...detail };
                    });
                    saveUserState();
                    if (document.getElementById('contentArea')) renderContentArea();
                }
            } catch (e) {}
        }

        async function fetchAllDataForAdmin() {
            if (!SCHOOL_ID) return showToast("ID Sekolah tidak ditemukan.", false);
            const loadingToast = document.createElement('div');
            loadingToast.className = `toast fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white z-50 bg-indigo-600 flex items-center gap-2 font-bold`;
            loadingToast.innerHTML = `<span>🔄</span> Menghubungkan ke database...`;
            document.body.appendChild(loadingToast);
            
            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'readAll');
                url.searchParams.append('ss_id', SCHOOL_ID);
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === 'success' && Array.isArray(result.data)) {
                    allRecords = result.data.map(item => ({
                        nama: item.nama, kelas: item.kelas, kategori: item.kategori, tanggal: item.tanggal, hadir: item.detail || item.hadir
                    }));
                    saveAllRecords();
                    if (isAdmin()) showLaporanPage();
                    showToast("Database Sinkron!");
                }
            } catch (e) { showToast("Gagal sinkronisasi data.", false); }
            finally { loadingToast.remove(); }
        }

        function showLoginPage() {
            const config = window.elementSdk?.config || defaultConfig;
            const lastNama = safeGetStorage('last_nama') || '';
            const lastKelas = safeGetStorage('last_kelas') || '';
            
            let classOptions = `<option value="">Pilih Kelas</option>`;
            ['7','8','9'].forEach(g => {
                classOptions += `<optgroup label="Tingkat ${g}">`;
                ['A','B','C','D','E','F','G','H','I','J'].forEach(s => {
                    const c = `${g}${s}`;
                    classOptions += `<option value="${c}" ${c === lastKelas ? 'selected' : ''}>${c}</option>`;
                });
                classOptions += `</optgroup>`;
            });

            document.getElementById('app').innerHTML = `
                <div class="w-full h-full flex items-center justify-center p-4 transition-all" style="background: ${config.background_color};">
                    <div class="w-full max-w-md rounded-[2rem] shadow-2xl p-8 bg-white overflow-hidden relative">
                        <div class="absolute top-0 left-0 w-full h-2 bg-emerald-100"></div>
                        <h1 class="text-center font-black text-3xl mb-2 text-emerald-800 tracking-tight">${config.app_title}</h1>
                        <p class="text-center text-sm mb-8 text-gray-500 font-medium">${config.welcome_message}</p>
                        <form id="loginForm" class="space-y-4">
                            <div>
                                <label class="block mb-2 font-bold text-gray-700 text-sm">Nama Lengkap Siswa</label>
                                <input type="text" id="nama" value="${lastNama}" placeholder="Contoh: Ahmad Hidayat" class="w-full px-5 py-3 border-2 border-gray-100 rounded-2xl outline-none focus:border-emerald-500 transition-all font-semibold">
                            </div>
                            <div>
                                <label class="block mb-2 font-bold text-gray-700 text-sm">Kelas</label>
                                <select id="kelas" class="w-full px-5 py-3 border-2 border-gray-100 rounded-2xl bg-white outline-none focus:border-emerald-500 transition-all font-semibold">${classOptions}</select>
                            </div>
                            <button type="submit" class="w-full py-4 mt-2 rounded-2xl text-white font-black bg-emerald-600 hover:bg-emerald-700 transition-all shadow-xl active:scale-95 text-lg">Masuk Sekarang</button>
                        </form>
                        <p class="mt-8 text-center text-[10px] text-gray-400 font-bold uppercase tracking-widest">© 2025 Jurnal Ramadhan Digital</p>
                    </div>
                </div>
            `;
            document.getElementById('loginForm').onsubmit = (e) => {
                e.preventDefault();
                const nama = document.getElementById('nama').value.trim();
                const kelas = document.getElementById('kelas').value.trim();
                const admin = nama === '*';
                if (!admin && (!nama || !kelas)) return showToast("Mohon isi nama dan kelas!", false);
                
                if (!admin) { safeSetStorage('last_nama', nama); safeSetStorage('last_kelas', kelas); }
                currentUser = { nama: nama, kelas: admin ? '*' : kelas };
                safeSetStorage('ramadhanUser', JSON.stringify(currentUser));
                loadUserState();
                if (!admin) syncUserFromCloud();
                showAmalanPage();
            };
        }

        function showAmalanPage() {
            if (!currentUser) return showLoginPage();
            if (isAdmin()) return (showLaporanPage(), fetchAllDataForAdmin());
            const config = window.elementSdk?.config || defaultConfig;
            
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-slate-50">
                    <div class="max-w-4xl mx-auto p-4 md:p-8 pb-32">
                        <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 mb-6 border border-emerald-100">
                            <div class="flex justify-between items-start mb-6">
                                <div>
                                    <h1 class="font-black text-2xl text-emerald-900">${config.app_title}</h1>
                                    <div class="mt-2 flex flex-wrap gap-2">
                                        <span class="px-3 py-1 bg-emerald-50 text-emerald-700 rounded-full text-xs font-bold border border-emerald-100">👤 ${currentUser.nama}</span>
                                        <span class="px-3 py-1 bg-blue-50 text-blue-700 rounded-full text-xs font-bold border border-blue-100">🏫 Kelas ${currentUser.kelas}</span>
                                    </div>
                                </div>
                                <button id="logoutBtn" class="p-2 bg-rose-50 text-rose-600 rounded-xl hover:bg-rose-100 transition-colors">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                                </button>
                            </div>
                            <button id="rekapBtn" class="w-full py-3.5 rounded-2xl text-white bg-emerald-600 hover:bg-emerald-700 shadow-lg font-black flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
                                📊 LIHAT REKAP AMALAN SAYA
                            </button>
                        </div>

                        <div class="bg-white rounded-2xl shadow-md mb-8 overflow-hidden sticky top-4 z-40 border border-slate-200">
                            <div class="flex overflow-x-auto no-scrollbar scroll-smooth">
                                ${categories.map(cat => `<button class="tab-button flex-1 px-6 py-4 font-bold whitespace-nowrap text-sm transition-all ${currentTab === cat ? 'active text-emerald-700 bg-emerald-50' : 'text-slate-400 hover:text-slate-600'}" data-tab="${cat}">${getCategoryIcon(cat)} ${cat}</button>`).join('')}
                            </div>
                        </div>

                        <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 min-h-[500px] border border-slate-100">
                            <div id="contentArea"></div>
                        </div>
                    </div>
                </div>
            `;
            document.querySelectorAll('.tab-button').forEach(btn => btn.onclick = (e) => { currentTab = e.currentTarget.dataset.tab; showAmalanPage(); });
            document.getElementById('rekapBtn').onclick = showRekapPage;
            document.getElementById('logoutBtn').onclick = handleLogout;
            renderContentArea();
        }

        function renderContentArea() {
            const area = document.getElementById('contentArea');
            const days = Array.from({length: 30}, (_, i) => i + 1);
            
            if (currentTab === 'Shalat Fardu') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `
                    <div class="p-6 border-2 border-gray-50 rounded-[2rem] bg-slate-50/50 hover:bg-white transition-all hover:shadow-lg border-l-8 border-l-emerald-500">
                        <h3 class="font-black text-emerald-900 mb-6 flex justify-between items-center text-lg"><span>📅 Hari ke-${t}</span> <span class="text-[10px] bg-emerald-100 px-2 py-1 rounded-lg uppercase tracking-widest text-emerald-700">Shalat Wajib</span></h3>
                        <div class="space-y-4">
                            ${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(w => `
                                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                    <div class="flex flex-col md:flex-row md:items-center gap-4">
                                        <div class="w-20 font-black text-gray-500">⏰ ${w}</div>
                                        <div class="flex flex-wrap gap-2 flex-1">
                                            ${['berjamaah','munfarid','haid','tidak shalat'].map(s => `

        async function handleSimpanPerWaktu(tgl, wkt) {
            if (!SCHOOL_ID) return showToast("Error: ID Sekolah tidak valid.", false);
            const status = shalatData[tgl]?.[wkt];
            if (!status) return showToast(`Pilih status Shalat ${wkt}!`, false);
            
            const btn = document.querySelector(`.sv-wkt-btn[data-t="${tgl}"][data-w="${wkt}"]`);
            const oldTxt = btn.textContent;
            btn.disabled = true; btn.textContent = '...';
            
            const detailObj = shalatData[tgl];
            const record = { 
                nama: currentUser.nama, 
                kelas: currentUser.kelas, 
                kategori: 'Shalat Fardu', 
                tanggal: tgl, 
                hadir: JSON.stringify(detailObj) 
            };

            const payload = { 
                ss_id: SCHOOL_ID, 
                ...record, 
                ...detailObj, 
                sheet: 'Shalat Fardu' 
            };

            allRecords = allRecords.filter(r => !(r.nama === currentUser.nama && r.kelas === currentUser.kelas && r.kategori === 'Shalat Fardu' && r.tanggal == tgl));
            allRecords.push(record); 
            saveAllRecords();

            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                showToast(`Amalan ${wkt} Hari ${tgl} Tersimpan!`);
            } catch (e) { showToast("Koneksi cloud gagal.", false); }
            finally { btn.disabled = false; btn.textContent = oldTxt; }
        }

        async function handleSimpanHarian(tgl) {
            if (!SCHOOL_ID) return showToast("Error: ID Sekolah tidak valid.", false);
            
            let detailObj = null;
            if (currentTab === 'Tarawih') {
                detailObj = tarawihData[tgl];
                if (!detailObj.status || !detailObj.tempat) return showToast("Pilih Status dan Tempat!", false);
            } else if (currentTab === 'Puasa') {
                detailObj = { status: puasaData[tgl] };
                if (!puasaData[tgl]) return showToast("Pilih Status Puasa!", false);
            } else if (currentTab === 'Tadarus') {
                detailObj = tadarusData[tgl];
                if (!detailObj.pilihan || !detailObj.surat.trim() || !detailObj.ayat.trim()) return showToast("Lengkapi data Tadarus!", false);
            } else if (currentTab === 'Ceramah') {
                detailObj = ceramahData[tgl];
                if (!detailObj.penceramah.trim() || !detailObj.ringkasan.trim()) return showToast("Lengkapi data Ceramah!", false);
            }

            const btn = document.querySelector(`.sv-harian[data-t="${tgl}"]`);
            const oldTxt = btn.textContent;
            btn.disabled = true; btn.textContent = 'MENGIRIM...';
            
            const record = { nama: currentUser.nama, kelas: currentUser.kelas, kategori: currentTab, tanggal: tgl, hadir: JSON.stringify(detailObj) };
            const payload = { ss_id: SCHOOL_ID, ...record, ...(typeof detailObj === 'object' ? detailObj : {}), sheet: currentTab };

            allRecords = allRecords.filter(r => !(r.nama === currentUser.nama && r.kelas === currentUser.kelas && r.kategori === currentTab && r.tanggal == tgl));
            allRecords.push(record);
            saveAllRecords();

            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                showToast(`Data ${currentTab} Hari ${tgl} Berhasil!`);
            } catch (e) { showToast("Gagal terhubung ke Cloud.", false); }
            finally { btn.disabled = false; btn.textContent = oldTxt; }
        }

        function getMergedRecords(records) {
            const map = new Map();
            records.forEach(r => {
                const key = `${r.nama}-${r.kelas}-${r.kategori}-${r.tanggal}`;
                map.set(key, r); 
            });
            return Array.from(map.values());
        }

        function showCetakDialog() {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/60 backdrop-blur-sm z-[80] flex items-center justify-center p-4';
            overlay.innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl p-8 max-sm w-full">
                    <h3 class="text-2xl font-black text-slate-800 mb-6 border-b pb-4">Opsi Cetak Laporan</h3>
                    <div class="space-y-5 mb-8">
                        <div>
                            <label class="block font-black text-[10px] text-slate-400 uppercase mb-2">Pilih Tingkat</label>
                            <select id="selTingkat" class="w-full p-4 border-2 border-slate-100 rounded-2xl bg-slate-50 font-bold outline-none">
                                <option value="Semua">Semua Tingkat</option>
                                <option value="7">Tingkat 7</option>
                                <option value="8">Tingkat 8</option>
                                <option value="9">Tingkat 9</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-black text-[10px] text-slate-400 uppercase mb-2">Pilih Kelas</label>
                            <select id="selKelas" class="w-full p-4 border-2 border-slate-100 rounded-2xl bg-slate-50 font-bold outline-none">
                                <option value="Semua">Semua Kelas</option>
                                ${['A','B','C','D','E','F','G','H','I','J'].map(k => `<option value="${k}">Kelas ${k}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="flex gap-3">
                        <button id="closeCetak" class="flex-1 py-4 bg-slate-100 text-slate-600 font-black rounded-2xl hover:bg-slate-200 transition-colors">BATAL</button>
                        <button id="goCetak" class="flex-1 py-4 bg-emerald-600 text-white font-black rounded-2xl shadow-lg hover:bg-emerald-700 active:scale-95 transition-all">🖨️ CETAK</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            document.getElementById('closeCetak').onclick = () => overlay.remove();
            document.getElementById('goCetak').onclick = () => {
                const t = document.getElementById('selTingkat').value;
                const k = document.getElementById('selKelas').value;
                overlay.remove();
                handleCetakGlobal(t, k);
            };
        }

        function handleCetakGlobal(tingkat, kelas) {
            const allMerged = getMergedRecords(allRecords);
            let students = [...new Set(allMerged.map(r => JSON.stringify({nama: r.nama, kelas: r.kelas})))].map(s => JSON.parse(s));
            if (tingkat !== "Semua") students = students.filter(s => s.kelas.startsWith(tingkat));
            if (kelas !== "Semua") students = students.filter(s => s.kelas.endsWith(kelas));
            students.sort((a,b) => a.nama.localeCompare(b.nama));

            if (students.length === 0) return showToast("Tidak ada data untuk filter ini", false);

            const printWindow = window.open('', '_blank');
            const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            
            let html = `<html><head><title>Rekap Amalan Ramadhan</title><style>
                body { font-family: sans-serif; padding: 40px; color: #1e293b; }
                .header { text-align: center; border-bottom: 3px solid #000; padding-bottom: 15px; margin-bottom: 30px; }
                table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
                th, td { border: 1px solid #000; padding: 12px; text-align: left; font-size: 11px; }
                th { background: #f1f5f9; font-weight: bold; }
                .footer { display: flex; justify-content: flex-end; margin-top: 50px; }
                .sig { text-align: center; width: 250px; }
            </style></head><body>
                <div class="header">
                    <h1 style="margin:0">REKAPITULASI AMALAN RAMADHAN SISWA</h1>
                    <div style="font-size:14px; margin-top:5px;">Filter: Tingkat ${tingkat} | Kelas ${kelas}</div>
                </div>
                <table><thead><tr><th>No</th><th>Nama Siswa</th><th>Kelas</th><th>Total Data</th><th>Status Keaktifan</th></tr></thead><tbody>`;
            
            students.forEach((s, idx) => {
                const count = allMerged.filter(r => r.nama === s.nama && r.kelas === s.kelas).length;
                html += `<tr><td>${idx+1}</td><td>${s.nama}</td><td>${s.kelas}</td><td>${count} Jurnal</td><td>${count >= 15 ? 'Sangat Aktif' : (count > 0 ? 'Aktif' : 'Belum Ada')}</td></tr>`;
            });

            html += `</tbody></table>
                <div class="footer"><div class="sig"><div>Dibuat pada: ${dateStr}</div><div style="font-weight:bold; margin: 60px 0 0px 0;">Guru PAI</div><div style="border-bottom: 1px solid #000; display: inline-block; width: 100%; margin-top: 60px;">( ........................................ )</div></div></div>
                <script>window.onload = () => { window.print(); setTimeout(() => window.close(), 500); };<\/script></body></html>`;
            printWindow.document.write(html);
            printWindow.document.close();
        }

        function handleCetakLaporanIndividual(student, dataRaw) {
            const data = getMergedRecords(dataRaw);
            const printWindow = window.open('', '_blank');
            const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            let html = `<html><head><title>Laporan - ${student.nama}</title><style>
                body { font-family: sans-serif; padding: 50px; color: #334155; }
                .header { text-align: center; border-bottom: 4px double #000; padding-bottom: 20px; margin-bottom: 30px; }
                .info { margin-bottom: 25px; font-weight: bold; font-size: 14px; }
                .tbl { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
                .tbl th, .tbl td { border: 1px solid #000; padding: 10px; text-align: left; font-size: 12px; }
                .tbl th { background: #f8fafc; }
                .footer { margin-top: 50px; display: flex; justify-content: flex-end; }
                .sig { text-align: center; width: 250px; }
            </style></head><body>
                <div class="header"><h1 style="margin:0">LAPORAN AMALAN RAMADHAN DIGITAL</h1><div>Tahun Pelajaran 2024/2025</div></div>
                <div class="info"><div>NAMA : ${student.nama}</div><div>KELAS : ${student.kelas}</div></div>`;
            
            categories.forEach(cat => {
                const recs = data.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
                if(recs.length > 0) {
                    html += `<h3 style="border-left: 5px solid #000; padding-left: 10px;">${cat.toUpperCase()}</h3><table class="tbl"><thead><tr><th width="80">HARI KE-</th><th>RINCIAN AMALAN</th></tr></thead><tbody>`;
                    recs.forEach(r => { html += `<tr><td>${r.tanggal}</td><td>${renderDetailData(cat, r.hadir)}</td></tr>`; });
                    html += `</tbody></table>`;
                }
            });

            html += `<div class="footer"><div class="sig"><div>Dicetak pada: ${dateStr}</div><div style="font-weight:bold; margin-top: 60px;">Guru PAI</div><div style="margin-top: 60px;">( ........................................ )</div></div></div>
                <script>window.onload = () => { window.print(); setTimeout(() => window.close(), 500); };<\/script></body></html>`;
            printWindow.document.write(html);
            printWindow.document.close();
        }

        // --- HELPER RENDERING ---
        function getCategoryIcon(k) { switch(k) { case 'Shalat Fardu': return '🕌'; case 'Tarawih': return '🌙'; case 'Puasa': return '🍽️'; case 'Tadarus': return '📖'; case 'Ceramah': return '🎙️'; default: return '📝'; } }
        
        function renderDetailData(k, d) {
            try { d = (typeof d === 'string') ? JSON.parse(d) : d; } catch (e) {}
            if (!d) return '-'; 
            if (k === 'Shalat Fardu') {
                const ordered = ['Subuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya'];
                return ordered.filter(key => d[key]).map(key => `${key}: <span class="text-indigo-600 font-bold">${d[key]}</span>`).join(' | ') || '-';
            } else if (k === 'Tarawih') return `Status: <span class="text-indigo-600 font-bold">${d.status || '-'}</span>, Tempat: <span class="text-indigo-600 font-bold">${d.tempat || '-'}</span>`;
            else if (k === 'Puasa') return `Status: <span class="text-orange-600 font-bold">${typeof d === 'string' ? d : (d.status || d || '-')}</span>`;
            else if (k === 'Tadarus') return `Metode: <span class="text-blue-600 font-bold">${d.pilihan === 'sendiri' ? 'Sendiri' : 'Simakan'}</span>, Surat: <span class="text-blue-600 font-bold">${d.surat || '-'}</span> (Ayat: ${d.ayat || '-'})`;
            else if (k === 'Ceramah') return `Penceramah: <span class="text-rose-600 font-bold">${d.penceramah || '-'}</span>, Media: <span class="text-rose-600 font-bold">${d.tempat || '-'}</span><br><span class="text-[11px] text-slate-400 italic font-normal">"${d.ringkasan || '-'}"</span>`;
            return JSON.stringify(d);
        }

        // --- INITIALIZATION ---
        async function init() { 
            loadAllRecords(); 
            const saved = safeGetStorage('ramadhanUser'); 
            
            if (!SCHOOL_ID) {
                renderRegistration();
            } else {
                if (saved) { 
                    try { 
                        currentUser = JSON.parse(saved); 
                        loadUserState(); 
                        showAmalanPage(); 
                        if (!isAdmin()) setTimeout(syncUserFromCloud, 500); 
                    } catch (e) { 
                        safeRemoveStorage('ramadhanUser'); 
                        showLoginPage(); 
                    } 
                } else { 
                    showLoginPage(); 
                }
            }
        }

        init();
  </script>
 </body>
