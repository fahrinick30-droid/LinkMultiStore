<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amalan Ramadhan Multi-School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tab-button.active { border-bottom: 4px solid #10b981; color: #065f46; background-color: #ecfdf5; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .toast { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .sh-btn-active { background-color: #059669; color: white; border-color: #059669; transform: scale(1.05); }
  </style>
 </head>
 <body class="h-full bg-slate-50 text-slate-800">
  <div id="app" class="w-full h-full overflow-auto"></div>

  <script>
    /**
     * KONFIGURASI MASTER MULTI-TENANCY
     */
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7IjJZdiHITMGhSMSWWneT1E9qIWUOBwkuJv4krc4_IPk-pQYA1hgFXyNfMu9oKjr6Bw/exec';
    
    function getSchoolId() {
        const params = new URLSearchParams(window.location.search);
        let id = params.get('id');
        if (!id && window.location.href.includes('id=')) {
            id = window.location.href.split('id=')[1].split('&')[0];
        }
        return id;
    }

    const SCHOOL_ID = getSchoolId();

    let currentUser = JSON.parse(localStorage.getItem('ramadhanUser')) || null;
    let currentTab = 'Shalat Fardu';
    let allRecords = [];
    const categories = ['Shalat Fardu', 'Tarawih', 'Puasa', 'Tadarus', 'Ceramah'];

    let shalatData = {}, tarawihData = {}, puasaData = {}, tadarusData = {}, ceramahData = {};

    function initDefaultData() {
        for (let i = 1; i <= 30; i++) {
            shalatData[i] = { 'Subuh': null, 'Dzuhur': null, 'Ashar': null, 'Maghrib': null, 'Isya': null };
            tarawihData[i] = { status: null, tempat: null };
            puasaData[i] = null;
            tadarusData[i] = { pilihan: null, surat: '', ayat: '' };
            ceramahData[i] = { penceramah: '', tempat: '', ringkasan: '' };
        }
    }

    function showToast(message, isSuccess = true) {
        const toast = document.createElement('div');
        toast.className = `toast fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-2xl shadow-lg text-white z-[100] font-bold ${isSuccess ? 'bg-emerald-600' : 'bg-rose-600'}`;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function isAdmin() { return currentUser && currentUser.nama === '*'; }

    // --- VIEW: PENDAFTARAN (GURU BARU) ---
    function renderRegistration() {
        document.getElementById('app').innerHTML = `
            <div class="min-h-screen flex items-center justify-center p-6 bg-emerald-600">
                <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                    <div class="text-center mb-8">
                        <h1 class="text-3xl font-black text-slate-800">Daftar Sekolah</h1>
                        <p class="text-slate-400 text-sm mt-2">Buat database amalan sekolah secara otomatis.</p>
                    </div>
                    <form id="regForm" class="space-y-4">
                        <input type="email" id="regEmail" placeholder="Email Guru (Admin)" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                        <input type="text" id="regSchool" placeholder="Nama Sekolah" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                        <button type="submit" id="regBtn" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-black shadow-lg">Daftar & Buat Database</button>
                    </form>
                    <div id="regResult" class="mt-8 hidden p-6 bg-slate-900 rounded-3xl text-white">
                        <p class="text-[10px] font-bold text-emerald-400 uppercase mb-2">Link Siswa Anda:</p>
                        <textarea id="shareLink" class="w-full p-3 text-[11px] font-mono border rounded-xl bg-slate-800 border-slate-700 h-24 mb-3" readonly></textarea>
                        <button onclick="copyLink()" class="w-full py-3 bg-white text-slate-900 rounded-xl font-bold">Salin Link</button>
                    </div>
                </div>
            </div>`;

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            btn.disabled = true; btn.textContent = "Memproses...";
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ 
                    action: 'registerTeacher', 
                    email: document.getElementById('regEmail').value,
                    nama_sekolah: document.getElementById('regSchool').value 
                })});
                const data = await res.json();
                if (data.ss_id) {
                    document.getElementById('regResult').classList.remove('hidden');
                    document.getElementById('shareLink').value = window.location.href.split('?')[0] + '?id=' + data.ss_id;
                    btn.textContent = "Berhasil!";
                }
            } catch (err) { btn.disabled = false; btn.textContent = "Coba Lagi"; }
        };
    }

    window.copyLink = () => {
        const text = document.getElementById('shareLink').value;
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast("Link disalin!");
    };

    // --- VIEW: LOGIN SISWA / GURU ---
    function renderLogin() {
        let classOptions = `<option value="">Pilih Kelas</option>`;
        ['7','8','9'].forEach(g => {
            classOptions += `<optgroup label="Kelas ${g}">`;
            ['A','B','C','D','E','F','G','H','I','J'].forEach(s => {
                classOptions += `<option value="${g}${s}">${g}${s}</option>`;
            });
            classOptions += `</optgroup>`;
        });

        document.getElementById('app').innerHTML = `
            <div class="min-h-screen flex items-center justify-center p-6 bg-emerald-600">
                <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                    <h1 class="text-3xl font-black text-center text-emerald-700 mb-2">Amalan Ramadhan</h1>
                    <p class="text-slate-400 text-center text-sm mb-8">Selamat datang di aplikasi catatan amalan.</p>
                    <form id="loginForm" class="space-y-4">
                        <div>
                            <label class="block mb-1 font-semibold text-gray-700">Nama Lengkap Siswa</label>
                            <input type="text" id="nama" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold text-gray-700">Kelas</label>
                            <select id="kelas" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                                ${classOptions}
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-black shadow-lg transition-all active:scale-95">Masuk Sekarang</button>
                    </form>
                </div>
            </div>`;
        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            const nama = document.getElementById('nama').value.trim();
            const kelas = document.getElementById('kelas').value;
            currentUser = { nama: nama, kelas: kelas };
            localStorage.setItem('ramadhanUser', JSON.stringify(currentUser));
            initDefaultData();
            
            if (nama === '*') {
                renderAdmin();
                fetchAllDataForAdmin();
            } else {
                renderMainApp();
                syncWithCloud();
            }
        };
    }

    // --- VIEW: MAIN APP (SISWA) ---
    function renderMainApp() {
        if (!currentUser) return renderLogin();
        if (isAdmin()) return renderAdmin();

        document.getElementById('app').innerHTML = `
            <div class="w-full h-full overflow-auto bg-emerald-600">
                <div class="max-w-4xl mx-auto p-4 md:p-6 pb-24">
                    <div class="rounded-2xl shadow-xl p-6 mb-6 bg-white">
                        <h1 class="font-bold text-2xl mb-4 text-emerald-800">Amalan Ramadhan Siswa</h1>
                        <div class="mb-6 bg-emerald-50 p-4 rounded-xl text-sm border border-emerald-100">
                            <p class="mb-1 text-emerald-900"><strong>👤 Nama:</strong> ${currentUser.nama}</p>
                            <p class="text-emerald-900"><strong>🏫 Kelas:</strong> ${currentUser.kelas}</p>
                        </div>
                        <div class="flex flex-wrap gap-3">
                            <button onclick="showRekapPage()" class="flex-1 px-4 py-2.5 rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 shadow-md font-bold flex items-center justify-center gap-2">📊 Rekap Saya</button>
                            <button onclick="logout()" class="px-4 py-2.5 rounded-xl text-white bg-red-500 hover:bg-red-600 shadow-md font-bold">Keluar</button>
                        </div>
                    </div>
                    <div class="rounded-xl shadow-lg mb-6 overflow-hidden sticky top-0 z-40 bg-white border">
                        <div class="flex overflow-x-auto no-scrollbar">
                            ${categories.map(cat => `<button onclick="setTab('${cat}')" class="tab-button flex-1 px-4 py-4 font-bold whitespace-nowrap text-sm ${currentTab === cat ? 'active' : 'text-gray-500'}">${cat}</button>`).join('')}
                        </div>
                    </div>
                    <div class="rounded-2xl shadow-xl p-6 bg-white min-h-[500px]">
                        <h2 class="font-bold text-xl mb-6 flex items-center gap-2 text-gray-800 border-b pb-2"><span>📝</span> Isi Data: ${currentTab}</h2>
                        <div id="contentArea"></div>
                    </div>
                </div>
            </div>`;
        renderForm();
    }

    function renderForm() {
        const area = document.getElementById('contentArea');
        const days = Array.from({length: 30}, (_, i) => i + 1);

        if (currentTab === 'Shalat Fardu') {
            area.innerHTML = `<div class="space-y-8">${days.map(t => `
                <div class="p-5 border rounded-2xl bg-white shadow-sm border-l-8 border-emerald-500">
                    <h3 class="font-black text-emerald-800 mb-4 flex justify-between">📅 Hari ke-${t} <span class="text-xs font-normal text-gray-400 italic">Shalat Wajib</span></h3>
                    <div class="space-y-4">
                        ${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(w => `
                            <div class="flex flex-col md:flex-row md:items-center gap-3 pb-3 border-b border-gray-100 last:border-0">
                                <div class="w-24 font-bold text-gray-600">⏰ ${w}</div>
                                <div class="flex flex-wrap gap-2 flex-1">
                                    ${['berjamaah','munfarid','haid','tidak shalat'].map(s => `
                                        <button onclick="updateAmalan(${t}, '${w}', '${s}')" class="px-3 py-1.5 text-xs rounded-full border-2 transition-all font-semibold ${shalatData[t]?.[w] === s ? 'sh-btn-active' : 'bg-white text-gray-500 border-gray-100'}">${s}</button>
                                    `).join('')}
                                </div>
                                <button onclick="handleSimpanPerWaktu(${t}, '${w}')" class="px-3 py-1.5 text-xs rounded-lg bg-blue-600 text-white font-bold shadow hover:bg-blue-700 active:scale-95">💾 Simpan ${w}</button>
                            </div>
                        `).join('')}
                    </div>
                </div>`).join('')}</div>`;
        } else if (currentTab === 'Tarawih') {
            area.innerHTML = `<div class="space-y-6">${days.map(t => `
                <div class="p-5 border rounded-2xl border-l-8 border-indigo-500 shadow-sm">
                    <h3 class="font-black text-indigo-900 mb-4">📅 Hari ke-${t}</h3>
                    <div class="mb-4">
                        <p class="text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">STATUS</p>
                        <div class="flex flex-wrap gap-2">
                            ${['berjamaah','munfarid','tidak mengerjakan','sakit','haid'].map(s => `<button onclick="updateTarawih(${t}, 'status', '${s}')" class="px-3 py-2 text-xs border-2 rounded-xl font-bold ${tarawihData[t]?.status === s ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-gray-100'}">${s}</button>`).join('')}
                        </div>
                    </div>
                    <div class="mb-4">
                        <p class="text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">TEMPAT</p>
                        <div class="flex gap-2">
                            ${['mesjid','rumah'].map(tmp => `<button onclick="updateTarawih(${t}, 'tempat', '${tmp}')" class="px-4 py-2 text-xs border-2 rounded-xl font-bold ${tarawihData[t]?.tempat === tmp ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-gray-100'}">${tmp}</button>`).join('')}
                        </div>
                    </div>
                    <button onclick="saveToCloud(${t})" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-black shadow-lg">💾 SIMPAN DATA TARAWIH</button>
                </div>`).join('')}</div>`;
        } else if (currentTab === 'Puasa') {
            area.innerHTML = `<div class="space-y-4">${days.map(t => `
                <div class="p-5 border rounded-2xl border-l-8 border-orange-500 shadow-sm">
                    <h3 class="font-black text-orange-900 mb-4">📅 Hari ke-${t}</h3>
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${['mengerjakan','tidak mengerjakan','sakit','haid'].map(s => `<button onclick="updatePuasa(${t}, '${s}')" class="px-4 py-2 text-xs border-2 rounded-xl font-bold ${puasaData[t] === s ? 'bg-orange-500 text-white border-orange-500' : 'bg-white border-gray-100'}">${s}</button>`).join('')}
                    </div>
                    <button onclick="saveToCloud(${t})" class="w-full py-3 bg-orange-500 text-white rounded-xl font-black shadow-lg">💾 SIMPAN DATA PUASA</button>
                </div>`).join('')}</div>`;
        } else if (currentTab === 'Tadarus') {
            area.innerHTML = `<div class="space-y-6">${days.map(t => `
                <div class="p-5 border rounded-2xl border-l-8 border-blue-500 shadow-sm">
                    <h3 class="font-black text-blue-900 mb-4">📅 Hari ke-${t}</h3>
                    <div class="flex gap-2 mb-4">
                        ${['sendiri','ustadz'].map(m => `<button onclick="updateTadarus(${t}, 'pilihan', '${m}')" class="px-4 py-2 text-xs border-2 rounded-xl font-bold ${tadarusData[t]?.pilihan === m ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-gray-100'}">${m === 'sendiri' ? 'Sendiri' : 'Bersama Ustadz'}</button>`).join('')}
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <input type="text" oninput="updateTadarus(${t}, 'surat', this.value)" value="${tadarusData[t]?.surat || ''}" placeholder="Nama Surat" class="w-full p-3 border-2 border-gray-50 rounded-xl text-sm">
                        <input type="text" oninput="updateTadarus(${t}, 'ayat', this.value)" value="${tadarusData[t]?.ayat || ''}" placeholder="Ayat" class="w-full p-3 border-2 border-gray-50 rounded-xl text-sm">
                    </div>
                    <button onclick="saveToCloud(${t})" class="w-full py-3 bg-blue-600 text-white rounded-xl font-black shadow-lg">💾 SIMPAN TADARUS</button>
                </div>`).join('')}</div>`;
        } else if (currentTab === 'Ceramah') {
            area.innerHTML = `<div class="space-y-6">${days.map(t => `
                <div class="p-5 border rounded-2xl border-l-8 border-rose-500 shadow-sm">
                    <h3 class="font-black text-rose-900 mb-4">📅 Hari ke-${t}</h3>
                    <div class="space-y-3">
                        <input type="text" oninput="updateCeramah(${t}, 'penceramah', this.value)" value="${ceramahData[t]?.penceramah || ''}" placeholder="Nama Penceramah" class="w-full p-3 border-2 border-gray-50 rounded-xl text-sm">
                        <input type="text" oninput="updateCeramah(${t}, 'tempat', this.value)" value="${ceramahData[t]?.tempat || ''}" placeholder="Tempat / Media" class="w-full p-3 border-2 border-gray-50 rounded-xl text-sm">
                        <textarea oninput="updateCeramah(${t}, 'ringkasan', this.value)" placeholder="Ringkasan isi ceramah..." class="w-full p-3 border-2 border-gray-50 rounded-xl text-sm h-24">${ceramahData[t]?.ringkasan || ''}</textarea>
                    </div>
                    <button onclick="saveToCloud(${t})" class="w-full mt-4 py-3 bg-rose-600 text-white rounded-xl font-black shadow-lg">💾 SIMPAN CERAMAH</button>
                </div>`).join('')}</div>`;
        }
    }

    // --- FORM LOGIC SISWA ---
    window.setTab = (t) => { currentTab = t; renderMainApp(); };
    window.updateAmalan = (t, w, s) => { shalatData[t][w] = s; renderForm(); };
    window.updateTarawih = (t, k, v) => { tarawihData[t][k] = v; renderForm(); };
    window.updatePuasa = (t, v) => { puasaData[t] = v; renderForm(); };
    window.updateTadarus = (t, k, v) => { tadarusData[t][k] = v; };
    window.updateCeramah = (t, k, v) => { ceramahData[t][k] = v; };

    async function handleSimpanPerWaktu(tgl, wkt) {
        if (!SCHOOL_ID) return;
        const status = shalatData[tgl]?.[wkt];
        if (!status) return showToast(`Sila pilih status untuk shalat ${wkt}!`, false);
        
        showToast(`Menyimpan ${wkt}...`);
        const record = {
            ss_id: SCHOOL_ID,
            nama: currentUser.nama,
            kelas: currentUser.kelas,
            kategori: 'Shalat Fardu',
            tanggal: tgl,
            hadir: JSON.stringify(shalatData[tgl]),
            shalat_detail: shalatData[tgl]
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(record) });
            showToast(`Data ${wkt} Hari ke-${tgl} disimpan!`);
        } catch (e) { showToast("Gagal mengirim data.", false); }
    }

    async function saveToCloud(tgl) {
        if (!SCHOOL_ID) return;
        showToast("Menyimpan ke Cloud...");
        let detail = "";
        if (currentTab === 'Shalat Fardu') detail = JSON.stringify(shalatData[tgl]);
        else if (currentTab === 'Tarawih') detail = JSON.stringify(tarawihData[tgl]);
        else if (currentTab === 'Puasa') detail = JSON.stringify(puasaData[tgl]);
        else if (currentTab === 'Tadarus') detail = JSON.stringify(tadarusData[tgl]);
        else if (currentTab === 'Ceramah') detail = JSON.stringify(ceramahData[tgl]);

        const record = {
            ss_id: SCHOOL_ID,
            nama: currentUser.nama,
            kelas: currentUser.kelas,
            kategori: currentTab,
            tanggal: tgl,
            hadir: detail,
            shalat_detail: shalatData[tgl],
            tarawih_detail: tarawihData[tgl],
            puasa_detail: puasaData[tgl],
            tadarus_detail: tadarusData[tgl],
            ceramah_detail: ceramahData[tgl]
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(record) });
            showToast(`Data Hari ke-${tgl} berhasil disimpan!`);
        } catch (e) { showToast("Gagal Simpan.", false); }
    }

    async function syncWithCloud() {
        if (!SCHOOL_ID || !currentUser || isAdmin()) return;
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=read&ss_id=${SCHOOL_ID}&nama=${currentUser.nama}&kelas=${currentUser.kelas}`);
            const result = await res.json();
            if (result.status === 'success') {
                result.data.forEach(item => {
                    let d = item.detail;
                    if (typeof d === 'string') { try { d = JSON.parse(d); } catch(e){} }
                    if (item.kategori === 'Shalat Fardu') shalatData[item.tanggal] = d;
                    else if (item.kategori === 'Tarawih') tarawihData[item.tanggal] = d;
                    else if (item.kategori === 'Puasa') puasaData[item.tanggal] = d.status || d;
                    else if (item.kategori === 'Tadarus') tadarusData[item.tanggal] = d;
                    else if (item.kategori === 'Ceramah') ceramahData[item.tanggal] = d;
                });
                renderForm();
                allRecords = result.data; // Store for recap
            }
        } catch (e) {}
    }

    // --- VIEW: REKAP SAYA ---
    window.showRekapPage = async () => {
        showToast("Memuat rekap...");
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=read&ss_id=${SCHOOL_ID}&nama=${currentUser.nama}&kelas=${currentUser.kelas}`);
            const result = await res.json();
            const myRecords = result.data || [];
            
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-gray-50 p-4 md:p-8">
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-white p-6 rounded-2xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div><h1 class="font-black text-3xl text-emerald-800">📊 Rekap Amalan Saya</h1><p class="text-gray-500">Ringkasan data terbaru Anda.</p></div>
                            <button onclick="renderMainApp()" class="px-6 py-3 bg-emerald-600 text-white font-black rounded-xl shadow-lg active:scale-95">← KEMBALI MENGISI</button>
                        </div>
                        <div class="space-y-8">
                            ${categories.map(cat => { 
                                const items = myRecords.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
                                return `<div class="bg-white rounded-2xl shadow-md overflow-hidden border">
                                    <div class="p-4 bg-emerald-50 border-b flex justify-between items-center"><span class="font-black text-emerald-800">${cat}</span><span class="bg-white px-3 py-1 rounded-full text-xs font-bold text-emerald-600">${items.length} HARI</span></div>
                                    <div class="divide-y">
                                        ${items.length ? items.map(r => `<div class="p-4 flex gap-4 text-sm"><span class="font-black text-gray-300 whitespace-nowrap">HARI ${r.tanggal}</span><div class="flex-1 text-gray-700">${renderDetail(cat, r.detail)}</div></div>`).join('') : '<p class="p-8 text-center text-gray-400 italic">Belum ada data.</p>'}
                                    </div>
                                </div>`; 
                            }).join('')}
                        </div>
                    </div>
                </div>`;
        } catch(e) { showToast("Gagal memuat rekap.", false); }
    };

    // --- VIEW: PANEL GURU (ADMIN) ---
    function renderAdmin() {
        document.getElementById('app').innerHTML = `
            <div class="w-full h-full bg-slate-100 overflow-auto p-4 md:p-8">
                <div class="max-w-6xl mx-auto">
                    <div class="bg-white p-6 rounded-2xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <h1 class="font-black text-2xl text-slate-800 flex items-center gap-2">📋 PANEL GURU</h1>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="fetchAllDataForAdmin()" class="px-4 py-2 bg-blue-600 text-white rounded-xl font-bold">🔄 REFRESH</button>
                            <button onclick="handleCetakGlobal()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl font-bold">🖨️ CETAK</button>
                            <button onclick="logout()" class="px-4 py-2 bg-slate-800 text-white rounded-xl font-bold">KELUAR</button>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-md mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">Tingkat</label>
                            <select id="fTingkat" onchange="filterAdmin()" class="w-full p-2 border rounded-xl bg-slate-50">
                                <option value="all">Semua</option><option value="7">Kelas 7</option><option value="8">Kelas 8</option><option value="9">Kelas 9</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">Kelas</label>
                            <select id="fKelas" onchange="filterAdmin()" class="w-full p-2 border rounded-xl bg-slate-50">
                                <option value="all">Semua</option>${['A','B','C','D','E','F','G','H','I','J'].map(k => `<option value="${k}">${k}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">Cari Nama</label>
                            <input type="text" id="fNama" oninput="filterAdmin()" placeholder="Ketik nama..." class="w-full p-2 border rounded-xl bg-slate-50">
                        </div>
                    </div>

                    <div id="studentGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            </div>`;
    }

    async function fetchAllDataForAdmin() {
        if (!SCHOOL_ID) return;
        showToast("Sinkronisasi database...");
        fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'clearOld', ss_id: SCHOOL_ID }) });

        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=readAll&ss_id=${SCHOOL_ID}`);
            const result = await res.json();
            if (result.status === 'success') {
                allRecords = result.data;
                filterAdmin();
                showToast("Berhasil Sinkron!");
            }
        } catch (e) { showToast("Gagal Sinkron.", false); }
    }

    function filterAdmin() {
        const t = document.getElementById('fTingkat').value;
        const k = document.getElementById('fKelas').value;
        const n = document.getElementById('fNama').value.toLowerCase();

        const uniqueS = [...new Set(allRecords.map(r => JSON.stringify({nama: r.nama, kelas: r.kelas})))].map(s => JSON.parse(s));
        const filtered = uniqueS.filter(s => {
            const matchT = t === 'all' || s.kelas.startsWith(t);
            const matchK = k === 'all' || s.kelas.endsWith(k);
            const matchN = s.nama.toLowerCase().includes(n);
            return matchT && matchK && matchN;
        }).sort((a,b) => a.nama.localeCompare(b.nama));

        const grid = document.getElementById('studentGrid');
        grid.innerHTML = filtered.map(s => `
            <div onclick="showStudentDetail('${s.nama}', '${s.kelas}')" class="bg-white p-5 rounded-3xl shadow-sm border border-transparent hover:border-emerald-500 cursor-pointer transition-all">
                <h3 class="font-black text-slate-800">${s.nama}</h3>
                <p class="text-xs font-bold text-emerald-600">Kelas: ${s.kelas}</p>
                <p class="text-[10px] text-slate-400 mt-2 flex items-center gap-1">📊 Lihat rincian amalan lengkap</p>
            </div>`).join('');
    }

    function showStudentDetail(nama, kelas) {
        const data = allRecords.filter(r => r.nama === nama && r.kelas === kelas);
        document.getElementById('app').innerHTML = `
            <div class="w-full h-full bg-slate-50 p-6 overflow-auto">
                <div class="max-w-4xl mx-auto">
                    <div class="bg-white p-6 rounded-3xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div><h2 class="font-black text-2xl text-slate-800">${nama}</h2><p class="text-emerald-600 font-bold">Kelas: ${kelas}</p></div>
                        <div class="flex gap-2">
                            <button onclick="handleCetakIndividual('${nama}', '${kelas}')" class="px-5 py-2 bg-emerald-600 text-white rounded-xl font-bold">🖨️ CETAK</button>
                            <button onclick="renderAdmin(); filterAdmin();" class="px-5 py-2 bg-slate-800 text-white rounded-xl font-bold">← KEMBALI</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${categories.map(cat => {
                            const items = data.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
                            return `<div class="bg-white p-6 rounded-3xl border shadow-sm">
                                <h3 class="font-black border-b pb-2 mb-4 text-slate-700">${cat}</h3>
                                <div class="space-y-2">
                                    ${items.length ? items.map(r => `<div class="text-[11px] p-3 bg-slate-50 rounded-xl"><b>Hari ke-${r.tanggal}:</b> ${renderDetail(cat, r.detail)}</div>`).join('') : '<p class="text-xs text-slate-300">Belum ada data.</p>'}
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            </div>`;
    }

    // --- PERBAIKAN: Fungsi renderDetail yang lebih cerdas ---
    function renderDetail(k, d) {
        if (!d) return '-';

        // 1. Jika data berupa string JSON, coba parse dulu
        if (typeof d === 'string' && (d.startsWith('{') || d.startsWith('['))) {
            try {
                const parsed = JSON.parse(d);
                if (parsed && typeof parsed === 'object') d = parsed;
            } catch (e) {
                // Biarkan tetap string jika gagal parse
            }
        }
        
        // 2. Jika d adalah string teks biasa (misal: "berjamaah"), tampilkan langsung
        // Ini kunci untuk mencegah split string "b | e | r..."
        if (typeof d === 'string') {
            return `<b>${d}</b>`;
        }

        // 3. Jika d adalah Objek (biasanya Shalat Fardu)
        if (k === 'Shalat Fardu') {
            const prayerNames = ['Subuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya'];
            
            // Cek apakah ini objek shalat yang valid
            const activePrayers = Object.keys(d).filter(key => prayerNames.includes(key) && d[key]);
            
            if (activePrayers.length > 0) {
                return activePrayers.map(w => `${w}: <b>${d[w]}</b>`).join(' | ');
            }
            
            // Fallback: Jika objek berisi indeks numerik (ini indikasi string yang tidak sengaja ter-JSON stringify)
            const keys = Object.keys(d);
            if (keys.length > 0 && keys.every(key => !isNaN(key))) {
                return `<b>${Object.values(d).join('')}</b>`;
            }

            return `<b>${JSON.stringify(d)}</b>`;
        }
        
        // 4. Kategori lain yang menggunakan struktur objek tetap
        if (k === 'Tarawih') return `Status: <b>${d.status || '-'}</b>, Lokasi: <b>${d.tempat || '-'}</b>`;
        if (k === 'Puasa') return `Status: <b>${typeof d === 'object' ? (d.status || '-') : d}</b>`;
        if (k === 'Tadarus') return `Metode: <b>${d.pilihan || '-'}</b>, Surat: <b>${d.surat || '-'}</b> (Ayat: ${d.ayat || '-'})`;
        if (k === 'Ceramah') return `Penceramah: <b>${d.penceramah || '-'}</b>, Lokasi: <b>${d.tempat || '-'}</b>`;
        
        return typeof d === 'object' ? JSON.stringify(d) : d;
    }

    function handleCetakGlobal() {
        const uniqueS = [...new Set(allRecords.map(r => JSON.stringify({nama: r.nama, kelas: r.kelas})))].map(s => JSON.parse(s)).sort((a,b) => a.nama.localeCompare(b.nama));
        const win = window.open('', '_blank');
        let html = `<html><head><title>Rekap Amalan</title><style>table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:8px;text-align:left;font-size:12px;}th{background:#f2f2f2;}</style></head><body>
            <h1 style="text-align:center">Rekapitulasi Amalan Ramadhan</h1>
            <table><thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Status</th></tr></thead><tbody>`;
        uniqueS.forEach((s, i) => {
            html += `<tr><td>${i+1}</td><td>${s.nama}</td><td>${s.kelas}</td><td>Aktif</td></tr>`;
        });
        html += `</tbody></table><script>window.print();<\/script></body></html>`;
        win.document.write(html);
        win.document.close();
    }

    function handleCetakIndividual(nama, kelas) {
        const data = allRecords.filter(r => r.nama === nama && r.kelas === kelas);
        const win = window.open('', '_blank');
        let html = `<html><head><title>${nama}</title><style>body{font-family:Arial;padding:20px}h1{text-align:center;border-bottom:2px solid #000}table{width:100%;border-collapse:collapse;margin-bottom:20px}th,td{border:1px solid #000;padding:5px;font-size:11px}th{background:#f2f2f2;}</style></head><body>
            <h1>LAPORAN AMALAN RAMADHAN</h1>
            <p>Nama: ${nama} | Kelas: ${kelas}</p>`;
        categories.forEach(cat => {
            const items = data.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
            if(items.length) {
                html += `<h3>${cat}</h3><table><thead><tr><th width="80">Hari</th><th>Keterangan</th></tr></thead><tbody>`;
                items.forEach(r => html += `<tr><td>Hari ke-${r.tanggal}</td><td>${renderDetail(cat, r.detail)}</td></tr>`);
                html += `</tbody></table>`;
            }
        });
        html += `<script>window.print();<\/script></body></html>`;
        win.document.write(html);
        win.document.close();
    }

    function logout() { localStorage.clear(); location.reload(); }

    function init() {
        if (!SCHOOL_ID) renderRegistration();
        else if (!currentUser) renderLogin();
        else if (isAdmin()) { renderAdmin(); fetchAllDataForAdmin(); }
        else renderMainApp();
    }
    init();
  </script>
 </body>
