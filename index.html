<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amalan Ramadhan Multi-School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Konfigurasi Default (Fallback jika cloud gagal)
    const DEFAULT_CONFIG = {
        app_title: "Amalan Ramadhan Siswa",
        bank_name: "BANK CENTRAL ASIA (BCA)",
        bank_account: "123-456-7890 a/n Admin Pusat",
        registration_fee: "Rp 50.000",
        master_password: "admin"
    };

    // PASTI KAN URL INI BENAR DAN SUDAH DI-DEPLOY SEBAGAI 'ANYONE'
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7IjJZdiHITMGhSMSWWneT1E9qIWUOBwkuJv4krc4_IPk-pQYA1hgFXyNfMu9oKjr6Bw/exec';

    window.elementSdk = {
        config: JSON.parse(localStorage.getItem('master_config')) || DEFAULT_CONFIG,
        setConfig: (conf) => { 
            window.elementSdk.config = { ...window.elementSdk.config, ...conf };
            localStorage.setItem('master_config', JSON.stringify(window.elementSdk.config));
        }
    };
  </script>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .tab-button.active { background: #10b981; color: white; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
 </head>
 <body class="h-full bg-slate-50">
  <div id="app" class="w-full h-full overflow-auto text-slate-800"></div>
  <script>
        function getSchoolId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            if (!id && window.location.href.includes('id=')) { id = window.location.href.split('id=')[1].split('&')[0]; }
            return id || sessionStorage.getItem('current_school_id');
        }

        let SCHOOL_ID = getSchoolId();
        let currentUser = null;
        let currentTab = 'Shalat Fardu';
        const categories = ['Shalat Fardu', 'Tarawih', 'Puasa', 'Tadarus', 'Ceramah'];

        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `toast fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl text-white z-[600] font-bold ${isSuccess ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Ambil Pengaturan Global dari Apps Script dengan Error Handling yang lebih kuat
        async function fetchGlobalSettings() {
            try {
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getGlobalSettings`);
                
                // Jika Apps Script mengembalikan error HTML (seperti minta login), throw error
                const contentType = res.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Apps Script tidak mengembalikan JSON. Pastikan akses diatur ke 'Anyone'.");
                }

                const data = await res.json();
                if (data.status === 'success') {
                    window.elementSdk.setConfig(data.config);
                    return data.config;
                }
            } catch (e) { 
                console.warn("Koneksi cloud gagal, menggunakan data lokal:", e.message); 
            }
            return window.elementSdk.config;
        }

        // --- MASTER ADMIN PANEL ---
        window.showMasterLogin = () => {
            const overlay = document.createElement('div');
            overlay.id = 'masterLoginOverlay';
            overlay.className = 'fixed inset-0 bg-slate-900/95 z-[500] flex items-center justify-center p-6 backdrop-blur-md';
            overlay.innerHTML = `
                <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-sm text-center">
                    <h2 class="text-2xl font-black text-slate-800 mb-2">Master Admin</h2>
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-6 tracking-widest">Kontrol Pusat</p>
                    <input id="masterPassInput" type="password" placeholder="Password Master" class="w-full p-4 bg-slate-100 rounded-2xl outline-none font-bold text-center mb-4 border-2 border-transparent focus:border-emerald-500 transition-all">
                    <div class="flex gap-2">
                        <button onclick="document.getElementById('masterLoginOverlay').remove()" class="flex-1 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl">BATAL</button>
                        <button onclick="validateMasterLogin()" class="flex-1 py-4 bg-emerald-600 text-white font-bold rounded-2xl shadow-lg">MASUK</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
        };

        window.validateMasterLogin = () => {
            if (document.getElementById('masterPassInput').value === window.elementSdk.config.master_password) {
                document.getElementById('masterLoginOverlay').remove();
                renderMasterAdmin();
            } else { showToast("Password Salah!", false); }
        };

        function renderMasterAdmin() {
            const config = window.elementSdk.config;
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-slate-900 p-6 text-white">
                    <div class="max-w-2xl mx-auto">
                        <h1 class="text-2xl font-black text-emerald-400 mb-8">Master Control</h1>
                        <div class="bg-slate-800 p-8 rounded-[2.5rem] shadow-xl space-y-6">
                            <div class="grid gap-5">
                                <div><label class="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">Nama Aplikasi</label><input id="m_title" type="text" value="${config.app_title}" class="w-full p-4 bg-slate-700 rounded-xl font-bold border-2 border-slate-600"></div>
                                <div><label class="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">Nama Bank</label><input id="m_bank" type="text" value="${config.bank_name}" class="w-full p-4 bg-slate-700 rounded-xl font-bold border-2 border-slate-600"></div>
                                <div><label class="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">Nomor Rekening</label><input id="m_rek" type="text" value="${config.bank_account}" class="w-full p-4 bg-slate-700 rounded-xl font-bold border-2 border-slate-600"></div>
                                <div><label class="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">Biaya Aktivasi</label><input id="m_fee" type="text" value="${config.registration_fee}" class="w-full p-4 bg-slate-700 rounded-xl font-bold border-2 border-slate-600"></div>
                                <div><label class="block text-[10px] text-slate-400 font-black uppercase mb-1 tracking-widest">Password Master</label><input id="m_pass" type="text" value="${config.master_password}" class="w-full p-4 bg-slate-700 rounded-xl font-bold border-2 border-slate-600"></div>
                            </div>
                            <button id="saveGlobalBtn" onclick="saveMasterSettings()" class="w-full py-5 bg-emerald-600 rounded-[1.5rem] font-black shadow-lg">SIMPAN KE CLOUD</button>
                            <button onclick="location.reload()" class="w-full text-slate-400 font-bold py-2">BATAL & KELUAR</button>
                        </div>
                    </div>
                </div>`;
        }

        window.saveMasterSettings = async () => {
            const btn = document.getElementById('saveGlobalBtn');
            btn.disabled = true; btn.textContent = "SEDANG MENYIMPAN...";
            
            const newConf = {
                app_title: document.getElementById('m_title').value,
                bank_name: document.getElementById('m_bank').value,
                bank_account: document.getElementById('m_rek').value,
                registration_fee: document.getElementById('m_fee').value,
                master_password: document.getElementById('m_pass').value
            };

            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'setGlobalSettings', config: newConf })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    window.elementSdk.setConfig(newConf);
                    showToast("Berhasil disimpan ke Cloud!");
                    setTimeout(() => location.reload(), 1500);
                }
            } catch (e) { 
                showToast("Gagal simpan ke cloud, data disimpan lokal.", false); 
                window.elementSdk.setConfig(newConf);
            } finally { btn.disabled = false; btn.textContent = "SIMPAN KE CLOUD"; }
        };

        // --- REGISTRASI ---
        async function renderLanding() {
            document.getElementById('app').innerHTML = `<div class="min-h-screen flex items-center justify-center"><p class="font-bold text-emerald-600 animate-pulse">Memuat Konfigurasi...</p></div>`;
            const config = await fetchGlobalSettings();

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-emerald-600 flex flex-col items-center justify-center p-6">
                    <div id="mainBox" class="glass p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                        <div id="step-1">
                            <h1 class="text-4xl font-black text-slate-800 text-center mb-8 tracking-tight">Daftar Sekolah</h1>
                            <form id="regForm" class="space-y-4">
                                <input type="email" id="regEmail" placeholder="Gmail Guru / Admin" class="w-full p-4 bg-slate-100 rounded-2xl outline-none font-bold" required>
                                <input type="text" id="regSchool" placeholder="Nama Sekolah" class="w-full p-4 bg-slate-100 rounded-2xl outline-none font-bold" required>
                                <button type="submit" class="w-full bg-emerald-600 text-white p-5 rounded-2xl font-black shadow-xl">LANJUT KE PEMBAYARAN</button>
                            </form>
                            <button onclick="window.showMasterLogin()" class="w-full mt-6 text-slate-400 text-[10px] font-black uppercase tracking-widest py-2">Akses Admin Pusat</button>
                        </div>

                        <div id="step-2" class="hidden space-y-6 text-center">
                            <div class="bg-emerald-50 p-6 rounded-3xl border-2 border-dashed border-emerald-200 text-left">
                                <p class="text-[10px] font-black text-emerald-600 uppercase mb-1 tracking-widest">Transfer Ke:</p>
                                <p class="font-black text-slate-800 text-xl leading-none">${config.bank_name}</p>
                                <p class="text-2xl font-black text-emerald-700 tracking-tighter mt-1">${config.bank_account}</p>
                                <div class="mt-4 pt-4 border-t border-emerald-200">
                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Biaya Aktivasi:</p>
                                    <p class="text-xl font-black text-slate-800">${config.registration_fee}</p>
                                </div>
                            </div>
                            <input type="file" id="proofImg" accept="image/*" class="w-full p-4 bg-white border-2 border-slate-100 rounded-2xl text-[10px] font-black uppercase">
                            <button id="confirmBtn" class="w-full bg-slate-900 text-white p-5 rounded-[1.5rem] font-black shadow-lg">KONFIRMASI PEMBAYARAN</button>
                        </div>

                        <div id="step-3" class="hidden text-center space-y-6">
                            <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">✅</div>
                            <h2 class="text-2xl font-black text-slate-800">Berhasil Terdaftar!</h2>
                            <textarea id="shareLink" class="w-full p-4 bg-slate-800 text-white rounded-xl text-[10px] font-mono h-24 mb-4 outline-none" readonly></textarea>
                            <button onclick="window.copyLink()" class="w-full py-4 bg-emerald-600 text-white rounded-xl font-bold shadow-lg mb-2">SALIN LINK</button>
                            <button onclick="location.reload()" class="w-full py-3 bg-slate-100 text-slate-400 rounded-xl font-bold">SELESAI</button>
                        </div>
                    </div>
                </div>`;

            document.getElementById('regForm').onsubmit = (e) => {
                e.preventDefault();
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
            };

            document.getElementById('confirmBtn').onclick = async () => {
                if(!document.getElementById('proofImg').files[0]) return showToast("Upload bukti transfer!", false);
                const btn = document.getElementById('confirmBtn');
                btn.disabled = true; btn.textContent = "MEMPROSES...";
                
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, { 
                        method: 'POST', 
                        body: JSON.stringify({ 
                            action: 'registerTeacher', 
                            email: document.getElementById('regEmail').value, 
                            nama_sekolah: document.getElementById('regSchool').value 
                        })
                    });
                    const data = await res.json();
                    if(data.ss_id) {
                        document.getElementById('step-2').classList.add('hidden');
                        document.getElementById('step-3').classList.remove('hidden');
                        document.getElementById('shareLink').value = window.location.href.split('?')[0] + '?id=' + data.ss_id;
                        showToast("Pendaftaran sukses!");
                    }
                } catch(e) { btn.disabled = false; btn.textContent = "KONFIRMASI PEMBAYARAN"; showToast("Gagal mendaftar.", false); }
            };
        }

        async function renderSchoolPortal() {
            document.getElementById('app').innerHTML = `<div class="min-h-screen flex items-center justify-center"><p class="font-bold text-emerald-600 animate-pulse">Memuat Portal Sekolah...</p></div>`;
            const config = await fetchGlobalSettings();
            
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-emerald-600 flex items-center justify-center p-6">
                    <div class="glass p-10 rounded-[3rem] shadow-2xl w-full max-w-md text-center">
                        <h1 class="text-3xl font-black text-slate-800 mb-8 leading-tight tracking-tight">${config.app_title}</h1>
                        <div class="space-y-4">
                            <button onclick="window.showLoginSiswa()" class="w-full p-6 bg-emerald-600 text-white rounded-[2rem] font-black shadow-xl hover:bg-emerald-700 transition-all flex flex-col items-center">
                                <span class="text-3xl mb-1">📖</span>
                                <span>MASUK SISWA</span>
                            </button>
                            <div class="flex items-center gap-4 my-6 opacity-30">
                                <div class="flex-1 h-px bg-slate-800"></div>
                                <span class="text-[10px] font-black uppercase">ATAU</span>
                                <div class="flex-1 h-px bg-slate-800"></div>
                            </div>
                            <button onclick="window.showLoginGuru()" class="w-full p-4 bg-slate-900 text-white rounded-2xl font-black shadow-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-3">
                                <span>👨‍🏫</span>
                                <span>PANEL GURU</span>
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        window.showLoginSiswa = () => {
            let opts = `<option value="">Pilih Kelas</option>`;
            ['7','8','9'].forEach(g => {
                opts += `<optgroup label="Kelas ${g}">`;
                ['A','B','C','D','E','F','G','H','I','J'].forEach(s => { opts += `<option value="${g}${s}">${g}${s}</option>`; });
                opts += `</optgroup>`;
            });

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-emerald-600 flex items-center justify-center p-6">
                    <div class="glass p-10 rounded-[3rem] shadow-2xl w-full max-w-md">
                        <h2 class="text-2xl font-black text-slate-800 mb-6 text-center">Login Siswa</h2>
                        <form id="sLogin" class="space-y-4">
                            <input id="sNama" type="text" placeholder="Nama Lengkap" class="w-full p-4 bg-slate-100 rounded-2xl outline-none font-bold" required>
                            <select id="sKelas" class="w-full p-4 bg-slate-100 rounded-2xl outline-none font-bold" required>${opts}</select>
                            <button class="w-full bg-emerald-600 text-white p-5 rounded-2xl font-black shadow-lg">MASUK</button>
                            <button type="button" onclick="renderSchoolPortal()" class="w-full text-slate-400 text-xs font-bold py-2">KEMBALI</button>
                        </form>
                    </div>
                </div>`;
            
            document.getElementById('sLogin').onsubmit = (e) => {
                e.preventDefault();
                const n = document.getElementById('sNama').value.trim();
                const k = document.getElementById('sKelas').value;
                currentUser = { nama_lengkap: n, kelas: k, role: 'siswa' };
                showAmalanPage();
            };
        };

        window.showLoginGuru = () => {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-slate-900 flex items-center justify-center p-6">
                    <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md text-center">
                        <h2 class="text-2xl font-black text-slate-800 mb-6">Login Guru</h2>
                        <form id="gLogin" class="space-y-4">
                            <input id="gPass" type="password" placeholder="Password Guru (*)" class="w-full p-4 bg-slate-100 rounded-2xl outline-none font-bold text-center">
                            <button class="w-full bg-slate-900 text-white p-5 rounded-2xl font-black shadow-lg">MASUK</button>
                            <button type="button" onclick="renderSchoolPortal()" class="w-full text-slate-400 text-xs font-bold py-2">KEMBALI</button>
                        </form>
                    </div>
                </div>`;
            
            document.getElementById('gLogin').onsubmit = (e) => {
                e.preventDefault();
                if(document.getElementById('gPass').value === '*') {
                    currentUser = { nama_lengkap: '*', kelas: '*', role: 'guru' };
                    fetchAllDataForAdmin();
                } else { showToast("Password Guru Salah!", false); }
            };
        };

        window.switchTab = (t) => { currentTab = t; showAmalanPage(); };
        
        window.copyLink = () => {
            const el = document.getElementById('shareLink');
            el.select();
            document.execCommand('copy');
            showToast("Link Disalin!");
        };

        function showAmalanPage() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-emerald-600 p-4">
                    <div class="max-w-4xl mx-auto pb-24">
                        <div class="bg-white rounded-[2rem] shadow-xl p-8 mb-6">
                            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Amalan Harian</h1>
                            <div class="mt-4 flex flex-col md:flex-row justify-between items-center bg-slate-50 p-6 rounded-3xl gap-4 border border-slate-100 text-center md:text-left">
                                <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Siswa</p><p class="text-lg font-black text-slate-800">${currentUser.nama_lengkap} (${currentUser.kelas})</p></div>
                                <button onclick="location.reload()" class="px-6 py-3 bg-rose-500 text-white rounded-xl font-bold text-xs">KELUAR</button>
                            </div>
                        </div>
                        <div class="bg-white rounded-[1.5rem] shadow-lg mb-6 overflow-hidden flex sticky top-2 z-50 border-4 border-white overflow-x-auto no-scrollbar">
                            ${categories.map(cat => `<button class="tab-button flex-1 py-4 px-4 font-black text-[10px] uppercase whitespace-nowrap tracking-widest transition-all ${currentTab === cat ? 'active' : 'bg-slate-50 text-slate-400'}" onclick="window.switchTab('${cat}')">${cat.split(' ')[0]}</button>`).join('')}
                        </div>
                        <div id="contentArea" class="bg-white rounded-[2rem] shadow-xl p-8 min-h-[400px]"></div>
                    </div>
                </div>`;
            renderContentArea();
        }

        function renderContentArea() {
            const area = document.getElementById('contentArea');
            const days = Array.from({length: 30}, (_, i) => i + 1);
            area.innerHTML = `<div class="space-y-6">${days.map(t => `
                <div class="p-6 border-2 border-slate-50 rounded-3xl hover:border-emerald-100 transition-all">
                    <h3 class="font-black text-slate-800 mb-4 flex items-center gap-2 text-sm"><span class="w-6 h-6 rounded-full bg-emerald-100 flex items-center justify-center text-[10px] text-emerald-700 font-black">${t}</span> HARI KE-${t}</h3>
                    <div class="flex flex-wrap gap-2">
                        ${['Selesai', 'Tidak', 'Berhalangan'].map(s => `
                            <button class="flex-1 py-3 bg-slate-50 border-2 border-transparent rounded-xl font-bold text-[10px] uppercase hover:bg-emerald-50 active:border-emerald-500 transition-all" onclick="window.saveAmalan(${t}, '${s}')">${s}</button>
                        `).join('')}
                    </div>
                </div>`).join('')}</div>`;
        }

        window.saveAmalan = async (tgl, status) => {
            if(!SCHOOL_ID) return showToast("ID Sekolah Hilang!", false);
            showToast(`Menyimpan Hari ke-${tgl}...`);
            try {
                await fetch(GOOGLE_SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ ss_id: SCHOOL_ID, nama: currentUser.nama_lengkap, kelas: currentUser.kelas, kategori: currentTab, tanggal: tgl, hadir: status })
                });
                showToast(`Hari ke-${tgl} Terkirim!`);
            } catch(e) { showToast("Gagal mengirim data.", false); }
        };

        async function fetchAllDataForAdmin() {
            showToast("Memuat Database...");
            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'readAll');
                url.searchParams.append('ss_id', SCHOOL_ID);
                const res = await fetch(url);
                const result = await res.json();
                if(result.status === 'success') {
                    renderLaporanPanel(result.data);
                }
            } catch(e) { showToast("Gagal muat data sekolah.", false); }
        }

        function renderLaporanPanel(data) {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-slate-100 p-6">
                    <div class="max-w-6xl mx-auto">
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div><h1 class="text-3xl font-black text-slate-800 tracking-tight">Panel Rekap Guru</h1><p class="text-xs text-slate-400 font-bold uppercase tracking-widest">ID Sekolah: ${SCHOOL_ID}</p></div>
                            <button onclick="location.reload()" class="px-6 py-3 bg-slate-900 text-white rounded-xl font-bold">KELUAR</button>
                        </div>
                        <div class="bg-white p-10 rounded-[2.5rem] shadow-lg text-center font-bold text-slate-400">
                             Database Sekolah Aktif (${data ? data.length : 0} baris data).
                        </div>
                    </div>
                </div>`;
        }

        function init() { if (!SCHOOL_ID) renderLanding(); else renderSchoolPortal(); }
        init();
  </script>
 </body>
</html>
