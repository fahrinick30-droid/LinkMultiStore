<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amalan Ramadhan Multi-School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Error Handler Global
    window.onerror = function(msg, url, line, col, error) {
        const app = document.getElementById('app');
        if (app) {
            app.innerHTML = `
                <div style="padding: 20px; color: red; font-family: sans-serif; text-align: center;">
                    <h3>Terjadi Kesalahan Aplikasi</h3>
                    <p>${msg}</p>
                    <button onclick="localStorage.clear(); location.reload();" style="margin-top:10px; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        Reset & Reload Aplikasi
                    </button>
                </div>
            `;
        }
        return false;
    };

    window.elementSdk = {
        config: {},
        init: (options) => {
            if (options.onConfigChange) options.onConfigChange(options.defaultConfig);
        },
        setConfig: (conf) => { Object.assign(window.elementSdk.config, conf); }
    };
    window.dataSdk = {
        init: () => Promise.resolve({ isOk: true }),
        create: (data) => Promise.resolve({ isOk: true })
    };
  </script>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .tab-button.active { border-bottom: 4px solid #10b981; color: #065f46; background-color: #ecfdf5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        
        /* Animasi dari sistem lama */
        @keyframes pulseBlue {
          0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
          70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
          100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        @keyframes pulseGreen {
          0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
          70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
          100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .pulse-blue { animation: pulseBlue 2s infinite; }
        .pulse-green { animation: pulseGreen 2s infinite; }
    </style>
 </head>
 <body class="h-full bg-gray-50">
  <div id="app" class="w-full h-full overflow-auto"></div>
  <script>
        /**
         * KONFIGURASI SISTEM INTI
         */
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7IjJZdiHITMGhSMSWWneT1E9qIWUOBwkuJv4krc4_IPk-pQYA1hgFXyNfMu9oKjr6Bw/exec';
        
        function getSchoolId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            if (!id && window.location.href.includes('id=')) {
                id = window.location.href.split('id=')[1].split('&')[0];
            }
            if (!id) {
                id = sessionStorage.getItem('current_school_id');
            }
            return id;
        }

        let SCHOOL_ID = getSchoolId();
        let registeredSchoolName = localStorage.getItem('registeredSchoolName') || "Sekolah";
        let registeredAppName = localStorage.getItem('registeredAppName') || "Amalan Ramadhan";

        let currentUser = null;
        let currentTab = 'Shalat Fardu';
        let allRecords = [];
        const categories = ['Shalat Fardu', 'Tarawih', 'Puasa', 'Tadarus', 'Ceramah'];

        let shalatData = {}, tarawihData = {}, puasaData = {}, tadarusData = {}, ceramahData = {};

        function initDefaultData() {
            for (let i = 1; i <= 30; i++) {
                shalatData[i] = { 'Subuh': null, 'Dzuhur': null, 'Ashar': null, 'Maghrib': null, 'Isya': null };
                tarawihData[i] = { status: null, tempat: null };
                puasaData[i] = null;
                tadarusData[i] = { pilihan: null, surat: '', ayat: '' };
                ceramahData[i] = { penceramah: '', tempat: '', ringkasan: '' };
            }
        }
        initDefaultData();

        function safeGetStorage(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function safeSetStorage(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
        function safeRemoveStorage(key) { try { localStorage.removeItem(key); } catch (e) {} }

        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `toast fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white z-[100] ${isSuccess ? 'bg-green-600' : 'bg-red-600'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function isAdmin() { return currentUser && currentUser.nama_lengkap === '*'; }

        // --- SISTEM: DAFTAR SEKOLAH ---
        function renderRegistration() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-6 bg-emerald-600">
                    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-black text-slate-800">Daftar Sekolah</h1>
                            <p class="text-slate-400 text-sm mt-2">isi data berikut dengan benar.</p>
                        </div>
                        <form id="regForm" class="space-y-4">
                            <input type="email" id="regEmail" placeholder="Gmail Guru" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                            <input type="text" id="regSchool" placeholder="Nama Sekolah" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                            <input type="text" id="regAppName" placeholder="Nama Aplikasi" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                            <button type="submit" id="regBtn" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-black shadow-lg">DAFTAR</button>
                        </form>
                        <div id="regResult" class="mt-8 hidden p-6 bg-slate-900 rounded-3xl text-white">
                            <p class="text-[10px] font-bold text-emerald-400 uppercase mb-2">Link Siswa Anda:</p>
                            <textarea id="shareLink" class="w-full p-3 text-[11px] font-mono border rounded-xl bg-slate-800 border-slate-700 h-24 mb-3" readonly></textarea>
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <button onclick="downloadLink()" class="py-3 bg-blue-600 text-white rounded-xl font-bold pulse-blue shadow-lg text-xs">Unduh Link</button>
                                <button onclick="copyLink()" class="py-3 bg-emerald-600 text-white rounded-xl font-bold pulse-green shadow-lg text-xs">Salin Link</button>
                            </div>
                            <button onclick="location.reload()" class="w-full py-3 bg-slate-700 text-white rounded-xl font-bold">SELESAI</button>
                        </div>
                    </div>
                </div>`;

            document.getElementById('regForm').onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('regBtn');
                const emailInput = document.getElementById('regEmail').value;
                const schoolInput = document.getElementById('regSchool').value;
                const appNameInput = document.getElementById('regAppName').value;

                btn.disabled = true; btn.textContent = "Memproses...";
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, { 
                        method: 'POST', 
                        body: JSON.stringify({ 
                            action: 'registerTeacher', 
                            email: emailInput,
                            nama_sekolah: schoolInput,
                            nama_aplikasi: appNameInput 
                        })
                    });
                    const data = await res.json();
                    if (data.ss_id) {
                        localStorage.setItem('registeredSchoolName', schoolInput);
                        localStorage.setItem('registeredAppName', appNameInput);
                        document.getElementById('regResult').classList.remove('hidden');
                        document.getElementById('shareLink').value = window.location.href.split('?')[0] + '?id=' + data.ss_id;
                        btn.textContent = "Berhasil!";
                    }
                } catch (err) { btn.disabled = false; btn.textContent = "Coba Lagi"; }
            };
        }

        window.copyLink = () => {
            const text = document.getElementById('shareLink').value;
            const ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast("Link disalin!");
        };

        window.downloadLink = () => {
            const link = document.getElementById('shareLink').value;
            const textContent = 
`INFO AKSES APLIKASI: ${registeredAppName}\nSEKOLAH: ${registeredSchoolName}\n-----------------------------------------\nLINK SISWA : \n${link}\n\nCARA MASUK KE PANEL GURU:\n-----------------------------------------\n1. Buka link di atas.\n2. Nama Lengkap Siswa : * (tanda bintang)\n3. Klik Masuk.`;

            const blob = new Blob([textContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'instruksi_akses_guru.txt';
            a.click();
            window.URL.revokeObjectURL(url);
            showToast("Instruksi diunduh!");
        };

        async function fetchSchoolInfo() {
            if (!SCHOOL_ID) return;
            try {
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getSchoolInfo&ss_id=${SCHOOL_ID}`);
                const result = await res.json();
                if (result.status === 'success') {
                    registeredSchoolName = result.nama_sekolah || "Sekolah";
                    registeredAppName = result.nama_aplikasi || "Amalan Siswa";
                    localStorage.setItem('registeredSchoolName', registeredSchoolName);
                    localStorage.setItem('registeredAppName', registeredAppName);
                }
            } catch (e) {}
        }

        function showLoginPage() {
            let classOptions = `<option value="">Pilih Kelas</option>`;
            ['7','8','9'].forEach(g => {
                classOptions += `<optgroup label="Kelas ${g}">`;
                ['A','B','C','D','E','F','G','H','I','J'].forEach(s => {
                    classOptions += `<option value="${g}${s}">${g}${s}</option>`;
                });
                classOptions += `</optgroup>`;
            });
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full flex items-center justify-center p-4 bg-emerald-600">
                    <div class="w-full max-w-md rounded-[2.5rem] shadow-2xl p-10 bg-white">
                        <h1 class="text-center font-black text-2xl text-emerald-700">${registeredAppName}</h1>
                        <h2 class="text-center font-bold text-slate-500 mb-8">${registeredSchoolName}</h2>
                        <form id="loginForm" class="space-y-4">
                            <div><label class="block mb-1 font-bold text-gray-700 text-sm">Nama Lengkap Siswa</label><input type="text" id="nama" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all"></div>
                            <div><label class="block mb-1 font-bold text-gray-700 text-sm">Kelas</label><select id="kelas" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all">${classOptions}</select></div>
                            <button type="submit" class="w-full py-4 rounded-2xl text-white font-black bg-emerald-600 hover:bg-emerald-700 shadow-lg active:scale-95 transition-all">Masuk Sekarang</button>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('loginForm').onsubmit = (e) => {
                e.preventDefault();
                const nama = document.getElementById('nama').value.trim();
                const kelas = document.getElementById('kelas').value;
                if (!nama || (nama !== '*' && !kelas)) return showToast("Mohon isi data dengan lengkap", false);
                
                currentUser = { nama_lengkap: nama, kelas: nama === '*' ? '*' : kelas };
                safeSetStorage('ramadhanUser', JSON.stringify(currentUser));
                
                if (nama === '*') {
                    renderAdmin();
                    fetchAllDataForAdmin();
                } else {
                    renderMainApp();
                    syncUserFromCloud();
                }
            };
        }

        function renderMainApp() {
            if (!currentUser) return showLoginPage();
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-emerald-600">
                    <div class="max-w-4xl mx-auto p-4 md:p-6 pb-24">
                        <div class="rounded-2xl shadow-xl p-6 mb-6 bg-white">
                            <h1 class="font-black text-xl text-emerald-800">${registeredAppName}</h1>
                            <p class="font-bold text-slate-500 text-sm mb-4">${registeredSchoolName}</p>
                            <div class="mb-6 bg-emerald-50 p-4 rounded-xl text-xs flex justify-between border border-emerald-100">
                                <span>👤 <b>${currentUser.nama_lengkap}</b></span>
                                <span>🏫 <b>${currentUser.kelas}</b></span>
                            </div>
                            <div class="flex flex-wrap gap-3">
                                <button onclick="showRekapPage()" class="flex-1 px-4 py-2.5 rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 shadow-md font-bold flex items-center justify-center gap-2">📊 Rekap Saya</button>
                                <button onclick="handleLogout()" class="px-4 py-2.5 rounded-xl text-white bg-red-500 hover:bg-red-600 shadow-md font-bold">Keluar</button>
                            </div>
                        </div>
                        <div class="rounded-xl shadow-lg mb-6 overflow-hidden sticky top-0 z-40 bg-white border flex overflow-x-auto no-scrollbar">
                            ${categories.map(cat => `<button onclick="setTab('${cat}')" class="tab-button flex-1 px-4 py-4 font-black text-[10px] uppercase whitespace-nowrap ${currentTab === cat ? 'active' : 'text-slate-400'}">${cat}</button>`).join('')}
                        </div>
                        <div id="contentArea" class="rounded-2xl shadow-xl p-6 bg-white min-h-[500px]"></div>
                    </div>
                </div>
            `;
            renderFormContent();
        }

        function setTab(t) { currentTab = t; renderMainApp(); }

        function renderFormContent() {
            const area = document.getElementById('contentArea');
            const days = Array.from({length: 30}, (_, i) => i + 1);
            if (currentTab === 'Shalat Fardu') {
                area.innerHTML = `<div class="space-y-8">${days.map(t => `
                    <div class="p-5 border rounded-2xl bg-white shadow-sm border-l-8 border-emerald-500">
                        <h3 class="font-black text-emerald-800 mb-4 flex justify-between">📅 Hari ke-${t}</h3>
                        <div class="space-y-4">
                            ${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(w => `
                                <div class="flex flex-col md:flex-row md:items-center gap-3 pb-3 border-b border-gray-100 last:border-0">
                                    <div class="w-24 font-bold text-gray-600">⏰ ${w}</div>
                                    <div class="flex flex-wrap gap-2 flex-1">
                                        ${['berjamaah','munfarid','haid','tidak shalat'].map(s => `
                                            <button onclick="updateData(${t}, '${w}', '${s}')" class="px-3 py-1.5 text-[10px] rounded-full border-2 transition-all font-semibold ${shalatData[t]?.[w] === s ? 'bg-emerald-600 text-white border-emerald-600 scale-105' : 'bg-white text-gray-500 border-gray-100'}">${s}</button>
                                        `).join('')}
                                    </div>
                                    <button onclick="saveDataPerWaktu(${t}, '${w}')" class="px-3 py-1.5 text-[10px] rounded-lg bg-blue-600 text-white font-bold shadow">💾 Simpan</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>`).join('')}</div>`;
            } else if (currentTab === 'Tarawih') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-5 border rounded-2xl border-l-8 border-indigo-500 shadow-sm"><h3 class="font-black text-indigo-900 mb-4">📅 Hari ke-${t}</h3><div class="mb-4"><p class="text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">STATUS</p><div class="flex flex-wrap gap-2">${['berjamaah','munfarid','tidak mengerjakan','sakit','haid'].map(s => `<button onclick="tarawihData[${t}].status='${s}'; renderFormContent();" class="px-3 py-2 text-xs border-2 rounded-xl font-bold ${tarawihData[t]?.status === s ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-gray-100'}">${s}</button>`).join('')}</div></div><div class="mb-4"><p class="text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">TEMPAT</p><div class="flex gap-2">${['mesjid','rumah'].map(tmp => `<button onclick="tarawihData[${t}].tempat='${tmp}'; renderFormContent();" class="px-4 py-2 text-xs border-2 rounded-xl font-bold ${tarawihData[t]?.tempat === tmp ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-gray-100'}">${tmp}</button>`).join('')}</div></div><button onclick="saveHarian(${t})" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-black shadow-lg">💾 SIMPAN DATA</button></div>`).join('')}</div>`;
            } else if (currentTab === 'Puasa') {
                area.innerHTML = `<div class="space-y-4">${days.map(t => `<div class="p-5 border rounded-2xl border-l-8 border-orange-500 shadow-sm"><h3 class="font-black text-orange-900 mb-4">📅 Hari ke-${t}</h3><div class="flex flex-wrap gap-2 mb-4">${['mengerjakan','tidak mengerjakan','sakit','haid'].map(s => `<button onclick="puasaData[${t}]='${s}'; renderFormContent();" class="px-4 py-2 text-xs border-2 rounded-xl font-bold ${puasaData[t] === s ? 'bg-orange-500 text-white border-orange-500' : 'bg-white border-gray-100'}">${s}</button>`).join('')}</div><button onclick="saveHarian(${t})" class="w-full py-3 bg-orange-500 text-white rounded-xl font-black shadow-lg">💾 SIMPAN DATA</button></div>`).join('')}</div>`;
            } else if (currentTab === 'Tadarus') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-5 border rounded-2xl border-l-8 border-blue-500 shadow-sm"><h3 class="font-black text-blue-900 mb-4">📅 Hari ke-${t}</h3><div class="flex gap-2 mb-4">${['sendiri','ustadz'].map(m => `<button onclick="tadarusData[${t}].pilihan='${m}'; renderFormContent();" class="px-4 py-2 text-xs border-2 rounded-xl font-bold ${tadarusData[t]?.pilihan === m ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-gray-100'}">${m === 'sendiri' ? 'Sendiri' : 'Bersama Ustadz'}</button>`).join('')}</div><div class="grid grid-cols-2 gap-4 mb-4"><input type="text" oninput="tadarusData[${t}].surat=this.value" value="${tadarusData[t]?.surat || ''}" placeholder="Nama Surat" class="w-full p-3 border-2 border-gray-50 rounded-xl text-sm"><input type="text" oninput="tadarusData[${t}].ayat=this.value" value="${tadarusData[t]?.ayat || ''}" placeholder="Ayat" class="w-full p-3 border-2 border-gray-50 rounded-xl text-sm"></div><button onclick="saveHarian(${t})" class="w-full py-3 bg-blue-600 text-white rounded-xl font-black shadow-lg">💾 SIMPAN DATA</button></div>`).join('')}</div>`;
            } else if (currentTab === 'Ceramah') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-5 border rounded-2xl border-l-8 border-rose-500 shadow-sm"><h3 class="font-black text-rose-900 mb-4">📅 Hari ke-${t}</h3><div class="space-y-3"><input type="text" oninput="ceramahData[${t}].penceramah=this.value" value="${ceramahData[t]?.penceramah || ''}" placeholder="Nama Penceramah" class="w-full p-3 border-2 border-gray-50 rounded-xl text-sm"><input type="text" oninput="ceramahData[${t}].tempat=this.value" value="${ceramahData[t]?.tempat || ''}" placeholder="Tempat / Media" class="w-full p-3 border-2 border-gray-50 rounded-xl text-sm"><textarea oninput="ceramahData[${t}].ringkasan=this.value" placeholder="Ringkasan isi ceramah..." class="w-full p-3 border-2 border-gray-50 rounded-xl text-sm h-24">${ceramahData[t]?.ringkasan || ''}</textarea></div><button onclick="saveHarian(${t})" class="w-full mt-4 py-3 bg-rose-600 text-white rounded-xl font-black shadow-lg">💾 SIMPAN DATA</button></div>`).join('')}</div>`;
            }
        }

        window.updateData = (t, w, s) => { shalatData[t][w] = s; renderFormContent(); };

        async function saveDataPerWaktu(tgl, wkt) {
            if (!SCHOOL_ID) return;
            const val = shalatData[tgl][wkt]; if(!val) return showToast("Pilih status!", false);
            showToast("Menyimpan...");
            const record = { ss_id: SCHOOL_ID, nama: currentUser.nama_lengkap, kelas: currentUser.kelas, kategori: 'Shalat Fardu', tanggal: tgl, hadir: JSON.stringify(shalatData[tgl]) };
            try { await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(record) }); showToast("Tersimpan!"); } catch(e) { showToast("Gagal simpan", false); }
        }

        async function saveHarian(tgl) {
            if (!SCHOOL_ID) return;
            let detail = "";
            if (currentTab === 'Tarawih') { if (!tarawihData[tgl].status || !tarawihData[tgl].tempat) return showToast("Lengkapi data!", false); detail = JSON.stringify(tarawihData[tgl]); }
            else if (currentTab === 'Puasa') { if (!puasaData[tgl]) return showToast("Pilih status!", false); detail = JSON.stringify(puasaData[tgl]); }
            else if (currentTab === 'Tadarus') { if (!tadarusData[tgl].surat || !tadarusData[tgl].ayat) return showToast("Lengkapi data!", false); detail = JSON.stringify(tadarusData[tgl]); }
            else if (currentTab === 'Ceramah') { if (!ceramahData[tgl].ringkasan) return showToast("Lengkapi data!", false); detail = JSON.stringify(ceramahData[tgl]); }
            
            showToast("Menyimpan...");
            const record = { ss_id: SCHOOL_ID, nama: currentUser.nama_lengkap, kelas: currentUser.kelas, kategori: currentTab, tanggal: tgl, hadir: detail };
            try { await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(record) }); showToast("Tersimpan!"); } catch(e) { showToast("Gagal simpan", false); }
        }

        async function syncUserFromCloud() {
            if (!SCHOOL_ID || isAdmin()) return;
            try {
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=read&ss_id=${SCHOOL_ID}&nama=${currentUser.nama_lengkap}&kelas=${currentUser.kelas}`);
                const result = await res.json();
                if (result.status === 'success') {
                    result.data.forEach(item => {
                        let d = item.detail; if (typeof d === 'string') { try { d = JSON.parse(d); } catch(e){} }
                        if (item.kategori === 'Shalat Fardu') shalatData[item.tanggal] = d;
                        else if (item.kategori === 'Tarawih') tarawihData[item.tanggal] = d;
                        else if (item.kategori === 'Puasa') puasaData[item.tanggal] = d.status || d;
                        else if (item.kategori === 'Tadarus') tadarusData[item.tanggal] = d;
                        else if (item.kategori === 'Ceramah') ceramahData[item.tanggal] = d;
                    });
                    renderFormContent();
                }
            } catch (e) {}
        }

        // --- PANEL GURU ---
        function renderAdmin() {
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full bg-slate-100 overflow-auto p-4 md:p-8">
                    <div class="max-w-6xl mx-auto">
                        <div class="bg-white p-6 rounded-3xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <h1 class="font-black text-2xl text-slate-800">📋 PANEL GURU</h1>
                            <div class="flex gap-2">
                                <button onclick="fetchAllDataForAdmin()" class="px-4 py-2 bg-blue-600 text-white rounded-xl font-bold text-xs">REFRESH DATA</button>
                                <button onclick="handleLogout()" class="px-4 py-2 bg-slate-800 text-white rounded-xl font-bold text-xs">KELUAR</button>
                            </div>
                        </div>
                        <div id="studentGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
                    </div>
                </div>`;
        }

        async function fetchAllDataForAdmin() {
            try {
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=readAll&ss_id=${SCHOOL_ID}`);
                const result = await res.json();
                if (result.status === 'success') {
                    allRecords = result.data;
                    const uniqueS = [...new Set(allRecords.map(r => JSON.stringify({nama: r.nama, kelas: r.kelas})))].map(s => JSON.parse(s));
                    document.getElementById('studentGrid').innerHTML = uniqueS.map(s => `
                        <div onclick="showStudentDetail('${s.nama}', '${s.kelas}')" class="bg-white p-5 rounded-3xl border hover:border-emerald-500 cursor-pointer shadow-sm transition-all">
                            <h3 class="font-black text-slate-800">${s.nama}</h3>
                            <p class="text-xs font-bold text-emerald-600">${s.kelas}</p>
                        </div>`).join('');
                    showToast("Berhasil Sinkron!");
                }
            } catch (e) {}
        }

        function showStudentDetail(nama, kelas) {
            const data = allRecords.filter(r => r.nama === nama && r.kelas === kelas);
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full bg-slate-50 p-6 overflow-auto pb-20">
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-white p-6 rounded-3xl shadow-xl mb-6 flex justify-between items-center">
                            <div><h2 class="font-black text-xl">${nama}</h2><p class="text-xs text-emerald-600">Kelas: ${kelas}</p></div>
                            <button onclick="renderAdmin(); fetchAllDataForAdmin();" class="px-4 py-2 bg-slate-800 text-white rounded-xl font-bold text-xs">KEMBALI</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${categories.map(cat => {
                                const items = data.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
                                return `<div class="bg-white p-6 rounded-3xl border"><h3 class="font-black text-[10px] uppercase text-slate-400 mb-4 border-b pb-2">${cat}</h3><div class="space-y-3">${items.length ? items.map(r => `<div class="p-3 bg-slate-50 rounded-xl text-[10px] border border-slate-100"><b>Hari ke-${r.tanggal}:</b><br>${renderDetail(cat, r.detail)}</div>`).join('') : '<p class="text-[10px] text-slate-300">Kosong</p>'}</div></div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function renderDetail(cat, data) {
            let d = data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch(e){} }
            if (!d) return '-';
            if (cat === 'Shalat Fardu') return Object.keys(d).map(w => `${w}: ${d[w]}`).join(' | ');
            if (cat === 'Tarawih') return `Status: ${d.status}, Lokasi: ${d.tempat}`;
            if (cat === 'Puasa') return typeof d === 'string' ? d : d.status;
            if (cat === 'Tadarus') return `QS. ${d.surat} (${d.ayat})`;
            if (cat === 'Ceramah') return `${d.penceramah}: ${d.ringkasan}`;
            return JSON.stringify(d);
        }

        function showRekapPage() {
            const my = allRecords.filter(r => r.nama === currentUser.nama_lengkap && r.kelas === currentUser.kelas);
            document.getElementById('app').innerHTML = `
                <div class="bg-slate-50 p-6 overflow-auto h-full pb-20"><div class="max-w-4xl mx-auto">
                    <div class="bg-white p-6 rounded-3xl mb-8 flex justify-between items-center shadow-md"><div><h1 class="font-black text-2xl">Rekap Saya</h1></div><button onclick="renderMainApp()" class="px-6 py-2 bg-emerald-600 text-white rounded-xl font-bold">KEMBALI</button></div>
                    ${categories.map(cat => {
                        const recs = my.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
                        return `<div class="bg-white rounded-2xl border mb-6 overflow-hidden"><div class="p-4 bg-emerald-50 font-black uppercase text-[10px] tracking-tight text-emerald-900">${cat}</div><div class="divide-y">${recs.map(r => `<div class="p-4 flex gap-4"><div class="bg-slate-50 p-2 rounded-xl text-center min-w-[50px]"><span class="block text-[8px] font-bold">HARI</span><span class="block font-black text-slate-800">${r.tanggal}</span></div><div class="flex-1">${renderDetail(cat, r.hadir)}</div></div>`).join('')}</div></div>`;
                    }).join('')}
                </div></div>`;
        }

        function handleLogout() { localStorage.removeItem('ramadhanUser'); location.reload(); }

        async function init() {
            if (!SCHOOL_ID) {
                renderRegistration();
            } else {
                await fetchSchoolInfo();
                const savedUser = safeGetStorage('ramadhanUser');
                if (savedUser) {
                    currentUser = JSON.parse(savedUser);
                    if (isAdmin()) { renderAdmin(); fetchAllDataForAdmin(); }
                    else { renderMainApp(); syncUserFromCloud(); }
                } else {
                    showLoginPage();
                }
            }
        }
        init();
  </script>
 </body>
</html>
