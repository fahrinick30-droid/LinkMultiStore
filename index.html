<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amalan Ramadhan Multi-School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Error Handler Global
    window.onerror = function(msg, url, line, col, error) {
        const app = document.getElementById('app');
        if (app) {
            app.innerHTML = `
                <div style="padding: 20px; color: red; font-family: sans-serif; text-align: center;">
                    <h3>Terjadi Kesalahan Aplikasi</h3>
                    <p>${msg}</p>
                    <button onclick="localStorage.clear(); location.reload();" style="margin-top:10px; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        Reset & Reload Aplikasi
                    </button>
                </div>
            `;
        }
        return false;
    };

    window.elementSdk = {
        config: {},
        init: (options) => {
            if (options.onConfigChange) options.onConfigChange(options.defaultConfig);
        },
        setConfig: (conf) => { Object.assign(window.elementSdk.config, conf); }
    };
    window.dataSdk = {
        init: () => Promise.resolve({ isOk: true }),
        create: (data) => Promise.resolve({ isOk: true })
    };
  </script>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .tab-button.active { border-bottom: 3px solid; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        
        @keyframes pulseBlue {
          0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
          70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
          100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        .pulse-blue { animation: pulseBlue 2s infinite; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom Table Style */
        .master-table-container { max-height: 70vh; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 12px; }
        .master-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .master-table th { position: sticky; top: 0; background: #f9fafb; z-index: 10; border-bottom: 2px solid #e5e7eb; padding: 12px 8px; }
        .master-table td { padding: 10px 8px; border-bottom: 1px solid #f3f4f6; text-align: center; }
        .master-table tr:hover { background-color: #f0fdf4; }
    </style>
 </head>
 <body class="h-full bg-gray-50">
  <div id="app" class="w-full h-full overflow-auto"></div>
  <script>
        /**
         * KONFIGURASI SISTEM
         */
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7IjJZdiHITMGhSMSWWneT1E9qIWUOBwkuJv4krc4_IPk-pQYA1hgFXyNfMu9oKjr6Bw/exec';
        
        function getSchoolId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            if (!id && window.location.href.includes('id=')) {
                id = window.location.href.split('id=')[1].split('&')[0];
            }
            if (!id) id = sessionStorage.getItem('current_school_id');
            return id;
        }

        let SCHOOL_ID = getSchoolId();

        const defaultConfig = {
            app_title: "Amalan Ramadhan Siswa",
            welcome_message: "Selamat datang di aplikasi Amalan Ramadhan",
            background_color: "#10b981",
            surface_color: "#ffffff",
            text_color: "#1f2937",
            primary_action_color: "#059669",
            font_family: "Arial",
            font_size: 16
        };

        let currentUser = null;
        let currentTab = 'Shalat Fardu';
        let allRecords = [];
        const categories = ['Shalat Fardu', 'Tarawih', 'Puasa', 'Tadarus', 'Ceramah'];

        let shalatData = {};
        let tarawihData = {};
        let puasaData = {};
        let tadarusData = {};
        let ceramahData = {};

        function initDefaultData() {
            for (let i = 1; i <= 30; i++) {
                shalatData[i] = { 'Subuh': null, 'Dzuhur': null, 'Ashar': null, 'Maghrib': null, 'Isya': null };
                tarawihData[i] = { status: null, tempat: null };
                puasaData[i] = null;
                tadarusData[i] = { pilihan: null, surat: '', ayat: '', ustadz: '' };
                ceramahData[i] = { penceramah: '', tempat: '', media: '', ringkasan: '' };
            }
        }
        initDefaultData();

        function safeGetStorage(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function safeSetStorage(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
        function safeRemoveStorage(key) { try { localStorage.removeItem(key); } catch (e) {} }
        
        function loadAllRecords() {
            const saved = safeGetStorage('ramadhanAllRecords');
            if (saved) { try { allRecords = JSON.parse(saved); } catch(e) {} }
        }
        function saveAllRecords() { safeSetStorage('ramadhanAllRecords', JSON.stringify(allRecords)); }

        function getUserStateKey() {
            if (!currentUser) return null;
            return `ramadhanState_${currentUser.nama.replace(/\s+/g, '_')}_${currentUser.kelas}`;
        }

        function loadUserState() {
            const key = getUserStateKey();
            if (!key) return;
            const savedState = safeGetStorage(key);
            if (savedState) {
                try {
                    const state = JSON.parse(savedState);
                    if (state.shalatData) shalatData = state.shalatData;
                    if (state.tarawihData) tarawihData = state.tarawihData;
                    if (state.puasaData) puasaData = state.puasaData;
                    if (state.tadarusData) tadarusData = state.tadarusData;
                    if (state.ceramahData) ceramahData = state.ceramahData;
                } catch (e) { initDefaultData(); }
            } else { initDefaultData(); }
        }

        function saveUserState() {
            const key = getUserStateKey();
            if (!key || isAdmin()) return;
            safeSetStorage(key, JSON.stringify({ shalatData, tarawihData, puasaData, tadarusData, ceramahData }));
        }

        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `toast fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white z-[100] ${isSuccess ? 'bg-green-600' : 'bg-red-600'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function isAdmin() { return currentUser && currentUser.nama === '*'; }

        function getCategoryDisplay(cat) {
            if (cat === 'Ceramah') return 'Kultum';
            if (cat === 'Shalat Fardu') return 'Shalat';
            return cat;
        }

        function showLoginPage() {
            const config = window.elementSdk?.config || defaultConfig;
            const lastNama = safeGetStorage('last_nama') || '';
            let classOptions = `<option value="">Pilih Kelas</option>`;
            ['7','8','9'].forEach(g => {
                classOptions += `<optgroup label="Kelas ${g}">`;
                ['A','B','C','D','E','F','G','H','I','J'].forEach(s => { const c = `${g}${s}`; classOptions += `<option value="${c}">${c}</option>`; });
                classOptions += `</optgroup>`;
            });
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full flex items-center justify-center p-4" style="background: ${config.background_color};">
                    <div class="w-full max-w-md rounded-2xl shadow-2xl p-8 bg-white">
                        <h1 class="text-center font-bold text-3xl mb-2 text-emerald-700 uppercase">${config.app_title}</h1>
                        <p class="text-center text-sm mb-8 text-gray-500">${config.welcome_message}</p>
                        <form id="loginForm" class="space-y-4">
                            <div><label class="block mb-1 font-semibold text-gray-700">Nama Lengkap Siswa</label><input type="text" id="nama" value="${lastNama}" class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500"></div>
                            <div><label class="block mb-1 font-semibold text-gray-700">Kelas</label><select id="kelas" class="w-full px-4 py-2 border rounded-xl bg-white outline-none focus:ring-2 focus:ring-emerald-500">${classOptions}</select></div>
                            <button type="submit" class="w-full py-3 rounded-xl text-white font-bold bg-emerald-600 hover:bg-emerald-700 transition-all shadow-lg active:scale-95">Masuk Sekarang</button>
                        </form>
                    </div>
                </div>`;
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const nama = document.getElementById('nama').value.trim(); const kelas = document.getElementById('kelas').value.trim();
                const admin = nama === '*';
                if (!admin && (!nama || !kelas)) return showToast("Mohon isi nama dan kelas", false);
                if (!admin) safeSetStorage('last_nama', nama);
                currentUser = { nama: nama, kelas: admin ? '*' : kelas };
                safeSetStorage('ramadhanUser', JSON.stringify(currentUser));
                loadUserState(); if (!admin) syncUserFromCloud();
                showAmalanPage();
            });
        }

        async function syncUserFromCloud() {
            if (!currentUser || isAdmin() || !SCHOOL_ID) return;
            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'read'); url.searchParams.append('ss_id', SCHOOL_ID);
                url.searchParams.append('nama', currentUser.nama); url.searchParams.append('kelas', currentUser.kelas);
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === 'success' && Array.isArray(result.data)) {
                    allRecords = allRecords.filter(r => !(r.nama === currentUser.nama && r.kelas === currentUser.kelas));
                    result.data.forEach(item => {
                        const tgl = item.tanggal; const cat = item.kategori;
                        let detail = item.detail; // Menggunakan 'detail' sesuai script Apps Script yang Anda kirim
                        if (typeof detail === 'string') { try { detail = JSON.parse(detail); } catch(e) {} }
                        
                        allRecords.push({
                            nama: currentUser.nama, kelas: currentUser.kelas, kategori: cat, tanggal: tgl, detail: detail 
                        });

                        if (cat === 'Shalat Fardu') shalatData[tgl] = { ...shalatData[tgl], ...detail };
                        else if (cat === 'Tarawih') tarawihData[tgl] = { ...tarawihData[tgl], ...detail };
                        else if (cat === 'Puasa') puasaData[tgl] = detail.status || detail;
                        else if (cat === 'Tadarus') tadarusData[tgl] = { ...tadarusData[tgl], ...detail };
                        else if (cat === 'Ceramah') ceramahData[tgl] = { ...ceramahData[tgl], ...detail };
                    });
                    saveUserState();
                    saveAllRecords();
                    if (document.getElementById('contentArea')) renderContentArea();
                }
            } catch (e) {}
        }

        async function fetchAllDataForAdmin() {
            if (!SCHOOL_ID) return showToast("Error: ID Sekolah tidak ditemukan.", false);
            const loadingToast = document.createElement('div');
            loadingToast.className = `toast fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white z-50 bg-indigo-600 flex items-center gap-2`;
            loadingToast.innerHTML = `<span>🔄</span> Sinkronisasi database...`;
            document.body.appendChild(loadingToast);
            
            try {
                const url = new URL(GOOGLE_SCRIPT_URL); 
                url.searchParams.append('action', 'readAll'); 
                url.searchParams.append('ss_id', SCHOOL_ID);
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === 'success' && Array.isArray(result.data)) {
                    allRecords = result.data.map(item => ({ 
                        nama: item.nama, 
                        kelas: item.kelas, 
                        kategori: item.kategori, 
                        tanggal: item.tanggal, 
                        detail: item.detail 
                    }));
                    saveAllRecords();
                    if (isAdmin()) showLaporanPage();
                    showToast("Database Sinkron!");
                }
            } catch (e) { showToast("Gagal sinkronisasi.", false); }
            finally { loadingToast.remove(); }
        }

        function showAmalanPage() {
            if (!currentUser) return showLoginPage();
            if (isAdmin()) return (showLaporanPage(), fetchAllDataForAdmin());
            const config = window.elementSdk?.config || defaultConfig;
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto" style="background: ${config.background_color};">
                    <div class="max-w-4xl mx-auto p-4 md:p-6 pb-24">
                        <div class="rounded-2xl shadow-xl p-6 mb-6 bg-white">
                            <h1 class="font-bold text-2xl mb-4 text-emerald-800">${config.app_title}</h1>
                            <div class="mb-6 bg-emerald-50 p-4 rounded-xl text-sm border border-emerald-100">
                                <p class="mb-1 text-emerald-900"><strong>👤 Nama:</strong> ${currentUser.nama}</p>
                                <p class="text-emerald-900"><strong>🏫 Kelas:</strong> ${currentUser.kelas}</p>
                            </div>
                            <div class="flex flex-wrap gap-3">
                                <button id="rekapBtn" class="flex-1 px-4 py-2.5 rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 shadow-md font-bold flex items-center justify-center gap-2">📊 Rekap Saya</button>
                                <button id="logoutBtn" class="px-4 py-2.5 rounded-xl text-white bg-red-500 hover:bg-red-600 shadow-md font-bold">Keluar</button>
                            </div>
                        </div>
                        <div class="rounded-xl shadow-lg mb-6 overflow-hidden sticky top-0 z-40 bg-white border">
                            <div class="flex overflow-x-auto no-scrollbar">
                                ${categories.map(cat => `<button class="tab-button flex-1 px-4 py-4 font-bold whitespace-nowrap text-sm ${currentTab === cat ? 'active text-emerald-600 border-b-4 border-emerald-600 bg-emerald-50/50' : 'text-gray-500'}" data-tab="${cat}">${cat}</button>`).join('')}
                            </div>
                        </div>
                        <div class="rounded-2xl shadow-xl p-6 bg-white min-h-[500px]">
                            <h2 class="font-bold text-xl mb-6 flex items-center gap-2 text-gray-800 border-b pb-2"><span>📝</span> Isi Data: ${currentTab}</h2>
                            <div id="contentArea"></div>
                        </div>
                    </div>
                </div>`;
            document.querySelectorAll('.tab-button').forEach(btn => btn.onclick = (e) => { currentTab = e.target.dataset.tab; showAmalanPage(); });
            document.getElementById('rekapBtn').onclick = showRekapPage;
            document.getElementById('logoutBtn').onclick = () => {
                if(confirm("Yakin ingin keluar?")) {
                    safeRemoveStorage('ramadhanUser'); currentUser = null; showLoginPage();
                }
            };
            renderContentArea();
        }

        function renderContentArea() {
            const area = document.getElementById('contentArea'); const days = Array.from({length: 30}, (_, i) => i + 1);
            if (currentTab === 'Shalat Fardu') {
                area.innerHTML = `<div class="space-y-8">${days.map(t => `
                    <div class="p-5 border rounded-2xl bg-white shadow-sm border-l-8 border-emerald-500">
                        <h3 class="font-black text-emerald-800 mb-4">📅 Hari ke-${t}</h3>
                        <div class="space-y-4">
                            ${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(w => `
                                <div class="flex flex-col md:flex-row md:items-center gap-3 pb-3 border-b border-gray-100 last:border-0">
                                    <div class="w-24 font-bold text-gray-600">⏰ ${w}</div>
                                    <div class="flex flex-wrap gap-2 flex-1">
                                        ${['berjamaah','munfarid','haid','tidak shalat'].map(s => `
                                            <button class="sh-btn px-3 py-1.5 text-xs rounded-full border-2 transition-all font-semibold ${shalatData[t]?.[w] === s ? 'bg-emerald-600 text-white border-emerald-600 scale-105' : 'bg-white text-gray-500 border-gray-100'}" data-t="${t}" data-w="${w}" data-s="${s}">${s}</button>
                                        `).join('')}
                                    </div>
                                    <button class="sv-wkt-btn px-3 py-1.5 text-xs rounded-lg bg-blue-600 text-white font-bold shadow hover:bg-blue-700 active:scale-95" data-t="${t}" data-w="${w}">💾 Simpan</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>`).join('')}</div>`;
                area.querySelectorAll('.sh-btn').forEach(b => b.onclick = (e) => { const d = e.target.dataset; shalatData[d.t][d.w] = d.s; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.sv-wkt-btn').forEach(b => b.onclick = (e) => handleSimpanPerWaktu(e.target.dataset.t, e.target.dataset.w));
            } else if (currentTab === 'Tarawih') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-5 border rounded-2xl shadow-sm border-l-8 border-indigo-500"><h3 class="font-black text-indigo-900 mb-4">📅 Hari ke-${t}</h3><div class="mb-4"><p class="text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">STATUS</p><div class="flex flex-wrap gap-2">${['berjamaah','munfarid','tidak mengerjakan','sakit','haid'].map(s => `<button class="tr-s px-3 py-2 text-xs border-2 rounded-xl font-bold ${tarawihData[t]?.status === s ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-gray-100'}" data-t="${t}" data-s="${s}">${s}</button>`).join('')}</div></div><div class="mb-4"><p class="text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">TEMPAT</p><div class="flex gap-2">${['mesjid','rumah'].map(tmp => `<button class="tr-t px-4 py-2 text-xs border-2 rounded-xl font-bold ${tarawihData[t]?.tempat === tmp ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-gray-100'}" data-t="${t}" data-tmp="${tmp}">${tmp}</button>`).join('')}</div></div><button class="sv-harian w-full py-3 bg-indigo-600 text-white rounded-xl font-black shadow-lg" data-t="${t}">💾 SIMPAN</button></div>`).join('')}</div>`;
                area.querySelectorAll('.tr-s').forEach(b => b.onclick = (e) => { tarawihData[e.target.dataset.t].status = e.target.dataset.s; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.tr-t').forEach(b => b.onclick = (e) => { tarawihData[e.target.dataset.t].tempat = e.target.dataset.tmp; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.sv-harian').forEach(b => b.onclick = (e) => handleSimpanHarian(e.target.dataset.t));
            } else if (currentTab === 'Puasa') {
                area.innerHTML = `<div class="space-y-4">${days.map(t => `<div class="p-5 border rounded-2xl border-l-8 border-orange-500 shadow-sm"><h3 class="font-black text-orange-900 mb-4">📅 Hari ke-${t}</h3><div class="flex flex-wrap gap-2 mb-4">${['mengerjakan','tidak mengerjakan','sakit','haid'].map(s => `<button class="ps-s px-4 py-2 text-xs border-2 rounded-xl font-bold ${puasaData[t] === s ? 'bg-orange-500 text-white border-orange-500' : 'bg-white border-gray-100'}" data-t="${t}" data-s="${s}">${s}</button>`).join('')}</div><button class="sv-harian w-full py-3 bg-orange-500 text-white rounded-xl font-black shadow-lg" data-t="${t}">💾 SIMPAN</button></div>`).join('')}</div>`;
                area.querySelectorAll('.ps-s').forEach(b => b.onclick = (e) => { puasaData[e.target.dataset.t] = e.target.dataset.s; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.sv-harian').forEach(b => b.onclick = (e) => handleSimpanHarian(e.target.dataset.t));
            } else if (currentTab === 'Tadarus') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-5 border rounded-2xl border-l-8 border-blue-500 shadow-sm"><h3 class="font-black text-blue-900 mb-4">📅 Hari ke-${t}</h3><div class="flex gap-2 mb-4">${['sendiri','ustadz'].map(m => `<button class="td-m px-4 py-2 text-xs border-2 rounded-xl font-bold ${tadarusData[t]?.pilihan === m ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-gray-100'}" data-t="${t}" data-m="${m}">${m === 'sendiri' ? 'Sendiri' : 'Bersama Ustadz'}</button>`).join('')}</div><div class="grid grid-cols-2 gap-4 mb-4"><div><label class="text-[10px] font-black text-gray-400">SURAT</label><input type="text" class="td-s w-full p-3 border-2 border-gray-50 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="Al-Baqarah" data-t="${t}" value="${tadarusData[t]?.surat || ''}"></div><div><label class="text-[10px] font-black text-gray-400">AYAT</label><input type="text" class="td-a w-full p-3 border-2 border-gray-50 rounded-xl text-sm outline-none focus:border-blue-500" placeholder="1-20" data-t="${t}" value="${tadarusData[t]?.ayat || ''}"></div></div><button class="sv-harian w-full py-3 bg-blue-600 text-white rounded-xl font-black shadow-lg" data-t="${t}">💾 SIMPAN</button></div>`).join('')}</div>`;
                area.querySelectorAll('.td-m').forEach(b => b.onclick = (e) => { tadarusData[e.target.dataset.t].pilihan = e.target.dataset.m; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.td-s').forEach(i => i.oninput = (e) => { tadarusData[e.target.dataset.t].surat = e.target.value; saveUserState(); });
                area.querySelectorAll('.td-a').forEach(i => i.oninput = (e) => { tadarusData[e.target.dataset.t].ayat = e.target.value; saveUserState(); });
                area.querySelectorAll('.sv-harian').forEach(b => b.onclick = (e) => handleSimpanHarian(e.target.dataset.t));
            } else if (currentTab === 'Ceramah') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-5 border rounded-2xl border-l-8 border-rose-500 shadow-sm"><h3 class="font-black text-rose-900 mb-4">📅 Hari ke-${t}</h3><div class="space-y-3"><input type="text" class="cr-p w-full p-3 border-2 border-gray-50 rounded-xl text-sm outline-none focus:border-rose-500" placeholder="Penceramah" data-t="${t}" value="${ceramahData[t]?.penceramah || ''}"><input type="text" class="cr-t w-full p-3 border-2 border-gray-50 rounded-xl text-sm outline-none focus:border-rose-500" placeholder="Tempat / Media" data-t="${t}" value="${ceramahData[t]?.tempat || ''}"><textarea class="cr-r w-full p-3 border-2 border-gray-50 rounded-xl text-sm outline-none focus:border-rose-500" placeholder="Ringkasan..." data-t="${t}">${ceramahData[t]?.ringkasan || ''}</textarea></div><button class="sv-harian w-full mt-4 py-3 bg-rose-600 text-white rounded-xl font-black shadow-lg" data-t="${t}">💾 SIMPAN</button></div>`).join('')}</div>`;
                area.querySelectorAll('.cr-p').forEach(i => i.oninput = (e) => { ceramahData[e.target.dataset.t].penceramah = e.target.value; saveUserState(); });
                area.querySelectorAll('.cr-t').forEach(i => i.oninput = (e) => { ceramahData[e.target.dataset.t].tempat = e.target.value; saveUserState(); });
                area.querySelectorAll('.cr-r').forEach(i => i.oninput = (e) => { ceramahData[e.target.dataset.t].ringkasan = e.target.value; saveUserState(); });
                area.querySelectorAll('.sv-harian').forEach(b => b.onclick = (e) => handleSimpanHarian(e.target.dataset.t));
            }
        }

        async function handleSimpanPerWaktu(tgl, wkt) {
            if (!SCHOOL_ID) return showToast("Error: ID Sekolah tidak ditemukan.", false);
            const status = shalatData[tgl]?.[wkt]; if (!status) return showToast(`Pilih status shalat ${wkt}!`, false);
            const btn = document.querySelector(`.sv-wkt-btn[data-t="${tgl}"][data-w="${wkt}"]`); if (btn) { btn.disabled = true; btn.textContent = '...'; }
            
            const detailObj = shalatData[tgl];
            const record = { nama: currentUser.nama, kelas: currentUser.kelas, kategori: 'Shalat Fardu', tanggal: tgl, detail: detailObj };
            
            allRecords = allRecords.filter(r => !(r.nama === currentUser.nama && r.kelas === currentUser.kelas && r.kategori === 'Shalat Fardu' && r.tanggal == tgl));
            allRecords.push(record); saveAllRecords();

            try { 
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ ss_id: SCHOOL_ID, ...record, sheet: 'Shalat Fardu', shalat_detail: detailObj }) }); 
                showToast(`Berhasil disimpan!`); 
            } 
            catch (e) { showToast("Gagal mengirim data.", false); } finally { if (btn) { btn.disabled = false; btn.textContent = `💾 Simpan`; } }
        }

        async function handleSimpanHarian(tgl) {
            if (!SCHOOL_ID) return showToast("Error: ID Sekolah tidak ditemukan.", false);
            const btn = document.querySelector(`.sv-harian[data-t="${tgl}"]`); if (btn) { btn.disabled = true; btn.textContent = '...'; }
            let detail = "";
            if (currentTab === 'Tarawih') detail = tarawihData[tgl];
            else if (currentTab === 'Puasa') detail = { status: puasaData[tgl] };
            else if (currentTab === 'Tadarus') detail = tadarusData[tgl];
            else if (currentTab === 'Ceramah') detail = ceramahData[tgl];
            
            const record = { nama: currentUser.nama, kelas: currentUser.kelas, kategori: currentTab, tanggal: tgl, detail: detail };
            allRecords = allRecords.filter(r => !(r.nama === currentUser.nama && r.kelas === currentUser.kelas && r.kategori === currentTab && r.tanggal == tgl));
            allRecords.push(record); saveAllRecords();

            try { 
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ 
                    ss_id: SCHOOL_ID, ...record, sheet: currentTab, 
                    tarawih_detail: tarawihData[tgl], puasa_detail: puasaData[tgl], 
                    tadarus_detail: tadarusData[tgl], ceramah_detail: ceramahData[tgl] 
                }) }); 
                showToast(`Data berhasil dikirim!`); 
            } 
            catch (e) { showToast("Gagal terhubung.", false); } finally { if (btn) { btn.disabled = false; btn.textContent = `💾 SIMPAN`; } }
        }

        function showRekapPage() {
            const allMerged = getMergedRecords(allRecords);
            const my = allMerged.filter(r => r.nama === currentUser.nama && r.kelas === currentUser.kelas);
            
            document.getElementById('app').innerHTML = `<div class="w-full h-full overflow-auto bg-gray-50 p-4 md:p-8"><div class="max-w-4xl mx-auto"><div class="bg-white p-6 rounded-2xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4"><div><h1 class="font-black text-3xl text-emerald-800">📊 Rekap Amalan Saya</h1><p class="text-gray-500 text-sm">Data yang tersinkronisasi dari server.</p></div><button id="backBtn" class="px-6 py-3 bg-emerald-600 text-white font-black rounded-xl shadow-lg active:scale-95">← KEMBALI</button></div><div class="space-y-8">${categories.map(cat => { const items = my.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal)); return `<div class="bg-white rounded-2xl shadow-md overflow-hidden border"><div class="p-4 bg-emerald-50 border-b flex justify-between items-center"><span class="font-black text-emerald-800">${getCategoryIcon(cat)} ${cat}</span><span class="bg-white px-3 py-1 rounded-full text-xs font-bold text-emerald-600">${items.length} HARI</span></div><div class="divide-y">${items.length ? items.map(r => `<div class="p-4 flex gap-4 text-sm"><span class="font-black text-gray-300 whitespace-nowrap">HARI ${r.tanggal}</span><div class="flex-1 text-gray-700">${renderDetailData(cat, r.detail)}</div></div>`).join('') : '<p class="p-8 text-center text-gray-400 italic">Belum ada data.</p>'}</div></div>`; }).join('')}</div></div></div>`;
            document.getElementById('backBtn').onclick = showAmalanPage;
        }

        function showMasterTable() {
            const allMerged = getMergedRecords(allRecords);
            const allS = [...new Set(allMerged.map(r => JSON.stringify({nama: r.nama, kelas: r.kelas})))].map(s => JSON.parse(s)).sort((a,b) => a.nama.localeCompare(b.nama));
            
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full bg-slate-100 p-4 overflow-auto">
                    <div class="max-w-6xl mx-auto">
                        <div class="bg-white p-6 rounded-2xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 border-l-8 border-indigo-600">
                            <h1 class="font-black text-2xl text-slate-800 uppercase">📊 Rekap Rinci Seluruh Siswa</h1>
                            <button id="backToAdmin" class="px-6 py-2 bg-slate-800 text-white rounded-xl font-bold">KEMBALI</button>
                        </div>
                        
                        <div class="bg-white p-2 rounded-2xl shadow-md overflow-hidden">
                            <div class="master-table-container">
                                <table class="master-table">
                                    <thead>
                                        <tr>
                                            <th>Nama Siswa</th>
                                            <th>Kelas</th>
                                            <th>🕌 Shalat</th>
                                            <th>🍽️ Puasa</th>
                                            <th>🌙 Tarawih</th>
                                            <th>📖 Tadarus</th>
                                            <th>🎙️ Kultum</th>
                                            <th>Progress</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${allS.map(s => {
                                            const sData = allMerged.filter(r => r.nama === s.nama && r.kelas === s.kelas);
                                            let shalatSum = 0;
                                            sData.filter(r => r.kategori === 'Shalat Fardu').forEach(item => {
                                                const d = item.detail;
                                                if (d && typeof d === 'object') {
                                                    ['Subuh','Dzuhur','Ashar','Maghrib','Isya'].forEach(w => {
                                                        if (d[w] && d[w] !== 'tidak shalat' && d[w] !== 'haid') shalatSum++;
                                                    });
                                                }
                                            });
                                            const ps = sData.filter(r => r.kategori === 'Puasa').length;
                                            const tr = sData.filter(r => r.kategori === 'Tarawih').length;
                                            const td = sData.filter(r => r.kategori === 'Tadarus').length;
                                            const cr = sData.filter(r => r.kategori === 'Ceramah').length;
                                            const uniqueDays = [...new Set(sData.map(r => r.tanggal))].length;
                                            const pct = Math.round((uniqueDays/30)*100);

                                            return `
                                                <tr>
                                                    <td class="text-left font-bold text-slate-700 uppercase">${s.nama}</td>
                                                    <td>${s.kelas}</td>
                                                    <td class="font-black text-blue-600">${shalatSum}</td>
                                                    <td class="font-bold text-orange-600">${ps}</td>
                                                    <td class="font-bold text-indigo-600">${tr}</td>
                                                    <td class="font-bold text-emerald-600">${td}</td>
                                                    <td class="font-bold text-rose-600">${cr}</td>
                                                    <td>
                                                        <div class="flex items-center gap-2">
                                                            <div class="w-16 bg-gray-100 h-2 rounded-full overflow-hidden">
                                                                <div class="bg-emerald-500 h-full" style="width: ${pct}%"></div>
                                                            </div>
                                                            <span class="text-[10px] font-bold">${pct}%</span>
                                                        </div>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>`;
            document.getElementById('backToAdmin').onclick = showLaporanPage;
        }

        function showLaporanPage() {
            const allMerged = getMergedRecords(allRecords);
            const allS = [...new Set(allMerged.map(r => JSON.stringify({nama: r.nama, kelas: r.kelas})))].map(s => JSON.parse(s)).sort((a,b) => a.nama.localeCompare(b.nama));
            
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-slate-100 p-4 md:p-6">
                    <div class="max-w-6xl mx-auto">
                        <div class="bg-white p-6 rounded-2xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 border-b-4 border-indigo-600">
                            <h1 class="font-black text-2xl text-slate-800 flex items-center gap-2">📋 PANEL GURU</h1>
                            <div class="flex flex-wrap gap-2">
                                <button id="syncBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-md">🔄 REFRESH</button>
                                <button id="masterTableBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow-md hover:bg-indigo-700">📊 REKAP RINCI</button>
                                <button id="cetakGlobalBtn" class="px-4 py-2 bg-emerald-600 text-white rounded-lg font-bold hover:bg-emerald-700">🖨️ CETAK</button>
                                <button id="adminLogOut" class="px-4 py-2 bg-slate-800 text-white rounded-lg font-bold">KELUAR</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-blue-500"><p class="text-[10px] font-black text-gray-400 uppercase">Siswa Aktif</p><p class="text-2xl font-black text-slate-800">${allS.length}</p></div>
                            <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-emerald-500"><p class="text-[10px] font-black text-gray-400 uppercase">Total Entri</p><p class="text-2xl font-black text-slate-800">${allMerged.length}</p></div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-md mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div><label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest">Tingkat</label><select id="filterTingkat" class="w-full p-2 border-2 border-gray-100 rounded-xl bg-gray-50 outline-none focus:border-indigo-500"><option value="all">Semua</option><option value="7">Kelas 7</option><option value="8">Kelas 8</option><option value="9">Kelas 9</option></select></div>
                            <div><label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest">Kelas</label><select id="filterKelas" class="w-full p-2 border-2 border-gray-100 rounded-xl bg-gray-50 outline-none focus:border-indigo-500"><option value="all">Semua</option>${['A','B','C','D','E','F','G','H','I','J'].map(k => `<option value="${k}">${k}</option>`).join('')}</select></div>
                            <div><label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest">Cari Nama</label><input type="text" id="searchNama" class="w-full p-2 border-2 border-gray-100 rounded-xl bg-gray-50 outline-none focus:border-indigo-500" placeholder="Ketik nama..."></div>
                        </div>

                        <div id="studentListGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                    </div>
                </div>`;

            let filterT = 'all', filterK = 'all', searchN = '';
            const renderFilteredStudents = () => {
                const filtered = allS.filter(s => (filterT === 'all' || s.kelas.startsWith(filterT)) && (filterK === 'all' || s.kelas.endsWith(filterK)) && s.nama.toLowerCase().includes(searchN.toLowerCase()));
                const grid = document.getElementById('studentListGrid');
                if (filtered.length === 0) { grid.innerHTML = `<div class="col-span-full p-12 bg-white rounded-2xl text-center text-gray-400 italic">Data tidak ditemukan.</div>`; return; }
                grid.innerHTML = filtered.map(s => {
                    const sData = allMerged.filter(r => r.nama === s.nama && r.kelas === s.kelas); 
                    const uniqueDays = [...new Set(sData.map(r => r.tanggal))].length; 
                    const lastData = sData.sort((a,b) => parseInt(b.tanggal) - parseInt(a.tanggal))[0];
                    let statusColor = uniqueDays > 15 ? 'bg-emerald-100 text-emerald-800' : (uniqueDays > 5 ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800');
                    return `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-xl hover:border-indigo-300 transition-all student-card cursor-pointer group" data-n="${s.nama}" data-k="${s.kelas}">
                        <div class="p-5">
                            <div class="flex justify-between items-start mb-4">
                                <div><h3 class="font-black text-slate-800 text-lg group-hover:text-indigo-600 transition-colors uppercase">${s.nama}</h3><p class="text-sm font-bold text-gray-400">Kelas ${s.kelas}</p></div>
                                <div class="text-right"><span class="text-[10px] px-3 py-1 rounded-full font-black ${statusColor}">${uniqueDays}/30 HARI</span></div>
                            </div>
                            
                            <div class="grid grid-cols-5 gap-1 mb-4">
                                ${categories.map(cat => {
                                    let displayCount = 0;
                                    const items = sData.filter(r => r.kategori === cat);
                                    if (cat === 'Shalat Fardu') {
                                        items.forEach(item => {
                                            const d = item.detail;
                                            if (d && typeof d === 'object') {
                                                ['Subuh','Dzuhur','Ashar','Maghrib','Isya'].forEach(w => {
                                                    if (d[w] && d[w] !== 'tidak shalat' && d[w] !== 'haid') displayCount++;
                                                });
                                            }
                                        });
                                    } else { displayCount = items.length; }
                                    return `<div class="flex flex-col items-center p-1.5 rounded-lg ${displayCount > 0 ? 'bg-indigo-50' : 'bg-gray-50'}">
                                        <span class="text-lg">${getCategoryIcon(cat)}</span>
                                        <span class="text-[8px] font-black uppercase text-gray-400 mt-0.5">${getCategoryDisplay(cat)}</span>
                                        <span class="text-[10px] font-black ${displayCount > 0 ? 'text-indigo-600' : 'text-gray-200'}">${displayCount}</span>
                                    </div>`;
                                }).join('')}
                            </div>

                            <div class="space-y-2 border-t pt-3">
                                <div class="flex justify-between text-[10px] font-bold">
                                    <span class="text-gray-400 uppercase">Terakhir:</span>
                                    <span class="${lastData ? 'text-indigo-600' : 'text-red-400'}">${lastData ? `Hari ${lastData.tanggal} (${getCategoryDisplay(lastData.kategori)})` : '-'}</span>
                                </div>
                                <div class="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden"><div class="bg-indigo-600 h-full transition-all duration-1000" style="width: ${(uniqueDays/30)*100}%"></div></div>
                            </div>
                        </div>
                        <div class="bg-gray-50 px-5 py-3 text-center border-t border-gray-100 group-hover:bg-indigo-600 transition-colors"><span class="text-[10px] font-black text-gray-500 group-hover:text-white uppercase tracking-widest">Detail Siswa</span></div>
                    </div>`;
                }).join('');
                grid.querySelectorAll('.student-card').forEach(c => c.onclick = (e) => showStudentDetail({ nama: e.currentTarget.dataset.n, kelas: e.currentTarget.dataset.k }));
            };
            document.getElementById('filterTingkat').onchange = (e) => { filterT = e.target.value; renderFilteredStudents(); };
            document.getElementById('filterKelas').onchange = (e) => { filterK = e.target.value; renderFilteredStudents(); };
            document.getElementById('searchNama').oninput = (e) => { searchN = e.target.value; renderFilteredStudents(); };
            document.getElementById('syncBtn').onclick = fetchAllDataForAdmin;
            document.getElementById('masterTableBtn').onclick = showMasterTable;
            document.getElementById('cetakGlobalBtn').onclick = showCetakDialog;
            document.getElementById('adminLogOut').onclick = () => {
                safeRemoveStorage('ramadhanUser'); currentUser = null; showLoginPage();
            };
            renderFilteredStudents();
        }

        function showStudentDetail(s) {
            const dataRaw = allRecords.filter(r => r.nama === s.nama && r.kelas === s.kelas);
            const data = getMergedRecords(dataRaw);
            document.getElementById('app').innerHTML = `<div class="w-full h-full overflow-auto bg-slate-50 p-6"><div class="max-w-4xl mx-auto"><div class="bg-white p-6 rounded-2xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 border-l-8 border-indigo-600"><div><h2 class="font-black text-2xl text-slate-800 uppercase">${s.nama}</h2><p class="font-bold text-indigo-600 italic">Kelas: ${s.kelas}</p></div><div class="flex gap-2"><button id="backAdmin" class="px-5 py-2 bg-slate-800 text-white rounded-xl font-bold shadow-md">← KEMBALI</button></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4">${categories.map(cat => { const recs = data.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal)); return `<div class="bg-white p-6 rounded-2xl shadow-sm border"><h3 class="font-black border-b pb-2 mb-4 text-slate-700 flex items-center gap-2"><span>${getCategoryIcon(cat)}</span> ${getCategoryDisplay(cat)}</h3><div class="space-y-2">${recs.length ? recs.map(r => `<div class="text-xs p-3 bg-slate-50 rounded-lg border border-slate-100"><strong>Hari ${r.tanggal}:</strong><br>${renderDetailData(cat, r.detail)}</div>`).join('') : '<p class="text-xs text-gray-400">Belum ada data.</p>'}</div></div>`; }).join('')}</div></div></div>`;
            document.getElementById('backAdmin').onclick = showLaporanPage;
        }

        function getCategoryIcon(k) { switch(k) { case 'Shalat Fardu': return '🕌'; case 'Tarawih': return '🌙'; case 'Puasa': return '🍽️'; case 'Tadarus': return '📖'; case 'Ceramah': return '🎙️'; default: return '📝'; } }
        
        function renderDetailData(k, d) { 
            if (!d) return '-'; 
            if (k === 'Shalat Fardu') { 
                if (typeof d !== 'object') return d; 
                const orderedKeys = ['Subuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya']; 
                const activePrayers = orderedKeys.filter(key => d[key] && d[key] !== 'tidak shalat' && d[key] !== 'haid');
                const entries = orderedKeys.filter(key => d[key]).map(key => `${key}: <span class="font-bold text-indigo-600">${d[key]}</span>`); 
                const summary = `<div class="mb-1 font-black text-indigo-800">${activePrayers.length} Waktu Terisi</div>`;
                return summary + (entries.length ? entries.join(' | ') : '-'); 
            } else if (k === 'Tarawih') return `Status: <b>${d.status || '-'}</b>, Lokasi: <b>${d.tempat || '-'}</b>`; 
            else if (k === 'Puasa') return `Status: <b>${d.status || '-'}</b>`; 
            else if (k === 'Tadarus') return `Metode: <b>${d.pilihan || '-'}</b>, Surat: <b>${d.surat || '-'}</b> (${d.ayat || '-'})`; 
            else if (k === 'Ceramah') return `Penceramah: <b>${d.penceramah || '-'}</b>, Lokasi: <b>${d.tempat || '-'}</b><br><span class="text-xs text-slate-500 italic">"${d.ringkasan || '-'}"</span>`; 
            return JSON.stringify(d); 
        }

        async function init() { 
            loadAllRecords(); const saved = safeGetStorage('ramadhanUser'); 
            if (!SCHOOL_ID) {
                document.getElementById('app').innerHTML = `<div class="min-h-screen flex items-center justify-center p-6 bg-emerald-600 text-white font-bold">Harap gunakan Link Siswa yang diberikan Guru.</div>`;
            } else {
                if (saved) { 
                    try { currentUser = JSON.parse(saved); loadUserState(); showAmalanPage(); if (!isAdmin()) setTimeout(syncUserFromCloud, 500); } 
                    catch (e) { safeRemoveStorage('ramadhanUser'); showLoginPage(); } 
                } else showLoginPage();
            }
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  </script>
 </body>
</html>
