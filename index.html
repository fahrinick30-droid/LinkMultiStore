<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amalan Ramadhan Multi-School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Error Handler Global
    window.onerror = function(msg, url, line, col, error) {
        const app = document.getElementById('app');
        if (app) {
            app.innerHTML = `
                <div style="padding: 20px; color: red; font-family: sans-serif; text-align: center;">
                    <h3>Terjadi Kesalahan Aplikasi</h3>
                    <p>${msg}</p>
                    <button onclick="localStorage.clear(); location.reload();" style="margin-top:10px; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        Reset & Reload Aplikasi
                    </button>
                </div>
            `;
        }
        return false;
    };

    window.elementSdk = {
        config: {},
        init: (options) => {
            if (options.onConfigChange) options.onConfigChange(options.defaultConfig);
        },
        setConfig: (conf) => { Object.assign(window.elementSdk.config, conf); }
    };
    window.dataSdk = {
        init: () => Promise.resolve({ isOk: true }),
        create: (data) => Promise.resolve({ isOk: true })
    };
  </script>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .tab-button.active { border-bottom: 3px solid; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
    </style>
 </head>
 <body class="h-full bg-gray-50">
  <div id="app" class="w-full h-full overflow-auto"></div>
  <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7IjJZdiHITMGhSMSWWneT1E9qIWUOBwkuJv4krc4_IPk-pQYA1hgFXyNfMu9oKjr6Bw/exec';
        
        function getSchoolId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            if (!id && window.location.href.includes('id=')) {
                id = window.location.href.split('id=')[1].split('&')[0];
            }
            if (!id) id = sessionStorage.getItem('current_school_id');
            return id;
        }

        let SCHOOL_ID = getSchoolId();
        const defaultConfig = {
            app_title: "Amalan Ramadhan Siswa",
            welcome_message: "Selamat datang di aplikasi Amalan Ramadhan",
            background_color: "#10b981",
            surface_color: "#ffffff",
            text_color: "#1f2937",
            primary_action_color: "#059669",
            secondary_action_color: "#6b7280",
            font_family: "Arial",
            font_size: 16
        };

        let currentUser = null;
        let currentTab = 'Shalat Fardu';
        let allRecords = [];
        const categories = ['Shalat Fardu', 'Tarawih', 'Puasa', 'Tadarus', 'Ceramah'];

        let shalatData = {};
        let tarawihData = {};
        let puasaData = {};
        let tadarusData = {};
        let ceramahData = {};

        function initDefaultData() {
            for (let i = 1; i <= 30; i++) {
                shalatData[i] = { 'Subuh': null, 'Dzuhur': null, 'Ashar': null, 'Maghrib': null, 'Isya': null };
                tarawihData[i] = { status: null, tempat: null };
                puasaData[i] = null;
                tadarusData[i] = { pilihan: null, surat: '', ayat: '', ustadz: '' };
                ceramahData[i] = { penceramah: '', tempat: '', media: '', ringkasan: '' };
            }
        }
        initDefaultData();

        function safeGetStorage(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function safeSetStorage(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
        function safeRemoveStorage(key) { try { localStorage.removeItem(key); } catch (e) {} }
        
        function loadAllRecords() {
            const saved = safeGetStorage('ramadhanAllRecords');
            if (saved) { try { allRecords = JSON.parse(saved); } catch(e) {} }
        }
        function saveAllRecords() { safeSetStorage('ramadhanAllRecords', JSON.stringify(allRecords)); }

        function getUserStateKey() {
            if (!currentUser) return null;
            return `ramadhanState_${currentUser.nama.replace(/\s+/g, '_')}_${currentUser.kelas}`;
        }

        function loadUserState() {
            const key = getUserStateKey();
            if (!key) return;
            const savedState = safeGetStorage(key);
            if (savedState) {
                try {
                    const state = JSON.parse(savedState);
                    if (state.shalatData) shalatData = state.shalatData;
                    if (state.tarawihData) tarawihData = state.tarawihData;
                    if (state.puasaData) puasaData = state.puasaData;
                    if (state.tadarusData) tadarusData = state.tadarusData;
                    if (state.ceramahData) ceramahData = state.ceramahData;
                } catch (e) { initDefaultData(); }
            } else { initDefaultData(); }
        }

        function saveUserState() {
            const key = getUserStateKey();
            if (!key || isAdmin()) return;
            safeSetStorage(key, JSON.stringify({ shalatData, tarawihData, puasaData, tadarusData, ceramahData }));
        }

        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `toast fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white z-[100] ${isSuccess ? 'bg-green-600' : 'bg-red-600'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function handleLogout() {
            safeRemoveStorage('ramadhanUser');
            currentUser = null;
            showLoginPage();
            showToast("Berhasil keluar.");
        }

        function isAdmin() { return currentUser && currentUser.nama === '*'; }

        function renderRegistration() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-6 bg-emerald-600">
                    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-black text-slate-800">Daftar Sekolah</h1>
                            <p class="text-slate-400 text-sm mt-2">Silahkan isi dengan gmail yang aktif dan Nama Sekolah.</p>
                        </div>
                        <form id="regForm" class="space-y-4">
                            <input type="email" id="regEmail" placeholder="Gmail Guru" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                            <input type="text" id="regSchool" placeholder="Nama Sekolah" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                            <button type="submit" id="regBtn" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-black shadow-lg">DAFTAR</button>
                        </form>
                        <div id="regResult" class="mt-8 hidden p-6 bg-slate-900 rounded-3xl text-white">
                            <p class="text-[10px] font-bold text-emerald-400 uppercase mb-2">Link Siswa Anda:</p>
                            <textarea id="shareLink" class="w-full p-3 text-[11px] font-mono border rounded-xl bg-slate-800 border-slate-700 h-24 mb-3" readonly></textarea>
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <button onclick="downloadLink()" class="py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg text-xs">Unduh Link</button>
                                <button onclick="copyLink()" class="py-3 bg-emerald-600 text-white rounded-xl font-bold shadow-lg text-xs">Salin Link</button>
                            </div>
                            <button onclick="location.reload()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold shadow-lg">SELESAI</button>
                        </div>
                    </div>
                </div>`;

            document.getElementById('regForm').onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('regBtn');
                btn.disabled = true; btn.textContent = "Memproses...";
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ 
                        action: 'registerTeacher', email: document.getElementById('regEmail').value, nama_sekolah: document.getElementById('regSchool').value 
                    })});
                    const data = await res.json();
                    if (data.ss_id) {
                        document.getElementById('regResult').classList.remove('hidden');
                        sessionStorage.setItem('current_school_id', data.ss_id);
                        document.getElementById('shareLink').value = window.location.href.split('?')[0] + '?id=' + data.ss_id;
                        btn.textContent = "Berhasil!";
                    }
                } catch (err) { btn.disabled = false; btn.textContent = "Coba Lagi"; }
            };
        }

        window.copyLink = () => {
            const text = document.getElementById('shareLink').value;
            const ta = document.createElement("textarea"); ta.value = text;
            document.body.appendChild(ta); ta.select(); document.execCommand('copy');
            document.body.removeChild(ta); showToast("Link disalin!");
        };

        window.downloadLink = () => {
            const link = document.getElementById('shareLink').value;
            const textContent = `LINK SISWA: ${link}\n\nPANEL GURU:\n1. Buka link di atas.\n2. Nama Lengkap Siswa : * (tanda bintang)\n3. Klik Masuk.`;
            const blob = new Blob([textContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'akses_guru.txt'; a.click();
            showToast("Link diunduh!");
        };

        async function syncUserFromCloud() {
            if (!currentUser || isAdmin() || !SCHOOL_ID) return;
            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'read');
                url.searchParams.append('ss_id', SCHOOL_ID);
                url.searchParams.append('nama', currentUser.nama);
                url.searchParams.append('kelas', currentUser.kelas);
                const res = await fetch(url);
                const result = await res.json();
                if (result.status === 'success' && Array.isArray(result.data)) {
                    result.data.forEach(item => {
                        const tgl = item.tanggal;
                        const cat = item.kategori;
                        let detail = item.detail;
                        if (typeof detail === 'string') try { detail = JSON.parse(detail); } catch(e) {}
                        
                        if (cat === 'Shalat Fardu') shalatData[tgl] = { ...shalatData[tgl], ...detail };
                        else if (cat === 'Tarawih') tarawihData[tgl] = { ...tarawihData[tgl], ...detail };
                        else if (cat === 'Puasa') puasaData[tgl] = detail.status || detail;
                        else if (cat === 'Tadarus') tadarusData[tgl] = { ...tadarusData[tgl], ...detail };
                        else if (cat === 'Ceramah') ceramahData[tgl] = { ...ceramahData[tgl], ...detail };
                    });
                    saveUserState();
                    if (document.getElementById('contentArea')) renderContentArea();
                }
            } catch (e) {}
        }

        async function fetchAllDataForAdmin() {
            if (!SCHOOL_ID) return showToast("Error: ID Sekolah tidak ditemukan.", false);
            const loadingToast = document.createElement('div');
            loadingToast.className = `fixed top-4 left-1/2 -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white z-50 bg-indigo-600 font-bold`;
            loadingToast.innerHTML = `🔄 Sedang Sinkronisasi...`;
            document.body.appendChild(loadingToast);
            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'readAll');
                url.searchParams.append('ss_id', SCHOOL_ID);
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === 'success' && Array.isArray(result.data)) {
                    // MAPPING DATA: Memastikan trim pada nama dan kelas untuk kecocokan filter
                    allRecords = result.data.map(item => ({
                        nama: String(item.nama).trim(), 
                        kelas: String(item.kelas).trim(), 
                        kategori: item.kategori, 
                        tanggal: item.tanggal, 
                        hadir: item.detail // Sesuai properti 'detail' di script Apps Script
                    }));
                    saveAllRecords();
                    if (isAdmin()) showLaporanPage();
                    showToast("Database Sinkron!");
                }
            } catch (e) { showToast("Gagal sinkronisasi.", false); }
            finally { loadingToast.remove(); }
        }

        function showLoginPage() {
            const config = window.elementSdk?.config || defaultConfig;
            const lastNama = safeGetStorage('last_nama') || '';
            const lastKelas = safeGetStorage('last_kelas') || '';
            let classOptions = `<option value="">Pilih Kelas</option>`;
            ['7','8','9'].forEach(g => {
                classOptions += `<optgroup label="Kelas ${g}">`;
                ['A','B','C','D','E','F','G','H','I','J'].forEach(s => {
                    const c = `${g}${s}`;
                    classOptions += `<option value="${c}" ${c === lastKelas ? 'selected' : ''}>${c}</option>`;
                });
                classOptions += `</optgroup>`;
            });
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full flex items-center justify-center p-4" style="background: ${config.background_color};">
                    <div class="w-full max-w-md rounded-2xl shadow-2xl p-8 bg-white">
                        <h1 class="text-center font-bold text-3xl mb-2 text-emerald-700">${config.app_title}</h1>
                        <p class="text-center text-sm mb-8 text-gray-500">${config.welcome_message}</p>
                        <form id="loginForm" class="space-y-4">
                            <div><label class="block mb-1 font-semibold text-gray-700">Nama Lengkap Siswa</label><input type="text" id="nama" value="${lastNama}" class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500"></div>
                            <div><label class="block mb-1 font-semibold text-gray-700">Kelas</label><select id="kelas" class="w-full px-4 py-2 border rounded-xl bg-white outline-none focus:ring-2 focus:ring-emerald-500">${classOptions}</select></div>
                            <button type="submit" class="w-full py-3 rounded-xl text-white font-bold bg-emerald-600 hover:bg-emerald-700 transition-all shadow-lg">Masuk Sekarang</button>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const nama = document.getElementById('nama').value.trim();
                const kelas = document.getElementById('kelas').value.trim();
                const admin = nama === '*';
                if (!admin && (!nama || !kelas)) return showToast("Mohon isi nama dan kelas", false);
                if (!admin) { safeSetStorage('last_nama', nama); safeSetStorage('last_kelas', kelas); }
                currentUser = { nama: nama, kelas: admin ? '*' : kelas };
                safeSetStorage('ramadhanUser', JSON.stringify(currentUser));
                loadUserState();
                if (!admin) syncUserFromCloud();
                showAmalanPage();
            });
        }

        function showAmalanPage() {
            if (!currentUser) return showLoginPage();
            if (isAdmin()) return (showLaporanPage(), fetchAllDataForAdmin());
            const config = window.elementSdk?.config || defaultConfig;
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto" style="background: ${config.background_color};">
                    <div class="max-w-4xl mx-auto p-4 md:p-6 pb-24">
                        <div class="rounded-2xl shadow-xl p-6 mb-6 bg-white">
                            <h1 class="font-bold text-2xl mb-4 text-emerald-800">${config.app_title}</h1>
                            <div class="mb-6 bg-emerald-50 p-4 rounded-xl text-sm border border-emerald-100">
                                <p class="mb-1 text-emerald-900"><strong>👤 Nama:</strong> ${currentUser.nama}</p>
                                <p class="text-emerald-900"><strong>🏫 Kelas:</strong> ${currentUser.kelas}</p>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="showRekapPage()" class="flex-1 px-4 py-3 rounded-xl text-white bg-emerald-600 font-bold shadow-md">📊 Rekap Saya</button>
                                <button onclick="handleLogout()" class="px-4 py-3 rounded-xl text-white bg-red-500 font-bold shadow-md">Keluar</button>
                            </div>
                        </div>
                        <div class="rounded-xl shadow-lg mb-6 overflow-hidden sticky top-0 z-40 bg-white border">
                            <div class="flex overflow-x-auto no-scrollbar">
                                ${categories.map(cat => `<button class="tab-button flex-1 px-4 py-4 font-bold whitespace-nowrap text-sm ${currentTab === cat ? 'active text-emerald-600 border-b-4 border-emerald-600 bg-emerald-50/50' : 'text-gray-500'}" onclick="currentTab='${cat}'; showAmalanPage();">${cat}</button>`).join('')}
                            </div>
                        </div>
                        <div class="rounded-2xl shadow-xl p-6 bg-white min-h-[500px]">
                            <h2 class="font-bold text-xl mb-6 flex items-center gap-2 text-gray-800 border-b pb-2"><span>📝</span> Isi Data: ${currentTab}</h2>
                            <div id="contentArea"></div>
                        </div>
                    </div>
                </div>
            `;
            renderContentArea();
        }

        function renderContentArea() {
            const area = document.getElementById('contentArea');
            const days = Array.from({length: 30}, (_, i) => i + 1);
            if (currentTab === 'Shalat Fardu') {
                area.innerHTML = `<div class="space-y-8">${days.map(t => `
                    <div class="p-5 border rounded-2xl bg-white shadow-sm border-l-8 border-emerald-500">
                        <h3 class="font-black text-emerald-800 mb-4">📅 Hari ke-${t}</h3>
                        <div class="space-y-4">
                            ${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(w => `
                                <div class="flex flex-col md:flex-row md:items-center gap-3 pb-3 border-b last:border-0">
                                    <div class="w-24 font-bold text-gray-600">${w}</div>
                                    <div class="flex flex-wrap gap-2 flex-1">
                                        ${['berjamaah','munfarid','haid','tidak shalat'].map(s => `
                                            <button onclick="shalatData[${t}]['${w}']='${s}'; saveUserState(); renderContentArea();" class="px-3 py-1.5 text-xs rounded-full border-2 transition-all font-semibold ${shalatData[t]?.[w] === s ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-gray-400 border-gray-100'}">${s}</button>
                                        `).join('')}
                                    </div>
                                    <button onclick="handleSimpanHarian(${t}, 'Shalat Fardu')" class="px-3 py-1.5 text-xs rounded-lg bg-blue-600 text-white font-bold">Simpan</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>`).join('')}</div>`;
            } else if (currentTab === 'Tarawih') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-5 border rounded-2xl shadow-sm border-l-8 border-indigo-500"><h3 class="font-black text-indigo-900 mb-4">📅 Hari ke-${t}</h3><div class="mb-4"><p class="text-[10px] font-black text-gray-400 mb-2 uppercase">Status</p><div class="flex flex-wrap gap-2">${['berjamaah','munfarid','tidak mengerjakan','sakit','haid'].map(s => `<button onclick="tarawihData[${t}].status='${s}'; saveUserState(); renderContentArea();" class="px-3 py-2 text-xs border-2 rounded-xl font-bold ${tarawihData[t]?.status === s ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-gray-100'}">${s}</button>`).join('')}</div></div><div class="mb-4"><p class="text-[10px] font-black text-gray-400 mb-2 uppercase">Tempat</p><div class="flex gap-2">${['mesjid','rumah'].map(tmp => `<button onclick="tarawihData[${t}].tempat='${tmp}'; saveUserState(); renderContentArea();" class="px-4 py-2 text-xs border-2 rounded-xl font-bold ${tarawihData[t]?.tempat === tmp ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-gray-100'}">${tmp}</button>`).join('')}</div></div><button onclick="handleSimpanHarian(${t}, 'Tarawih')" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-black">💾 SIMPAN DATA</button></div>`).join('')}</div>`;
            } else if (currentTab === 'Puasa') {
                area.innerHTML = `<div class="space-y-4">${days.map(t => `<div class="p-5 border rounded-2xl border-l-8 border-orange-500 shadow-sm"><h3 class="font-black text-orange-900 mb-4">📅 Hari ke-${t}</h3><div class="flex flex-wrap gap-2 mb-4">${['mengerjakan','tidak mengerjakan','sakit','haid'].map(s => `<button onclick="puasaData[${t}]='${s}'; saveUserState(); renderContentArea();" class="px-4 py-2 text-xs border-2 rounded-xl font-bold ${puasaData[t] === s ? 'bg-orange-500 text-white border-orange-500' : 'bg-white border-gray-100'}">${s}</button>`).join('')}</div><button onclick="handleSimpanHarian(${t}, 'Puasa')" class="w-full py-3 bg-orange-500 text-white rounded-xl font-black">💾 SIMPAN DATA</button></div>`).join('')}</div>`;
            } else if (currentTab === 'Tadarus') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-5 border rounded-2xl border-l-8 border-blue-500 shadow-sm"><h3 class="font-black text-blue-900 mb-4">📅 Hari ke-${t}</h3><div class="flex gap-2 mb-4">${['sendiri','ustadz'].map(m => `<button onclick="tadarusData[${t}].pilihan='${m}'; saveUserState(); renderContentArea();" class="px-4 py-2 text-xs border-2 rounded-xl font-bold ${tadarusData[t]?.pilihan === m ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-gray-100'}">${m === 'sendiri' ? 'Sendiri' : 'Simakan Bersama Ustadz'}</button>`).join('')}</div><div class="grid grid-cols-2 gap-4 mb-4"><div><label class="text-[10px] font-black">NAMA SURAT</label><input type="text" oninput="tadarusData[${t}].surat=this.value; saveUserState();" class="w-full p-3 border-2 rounded-xl text-sm" placeholder="Al-Baqarah" value="${tadarusData[t]?.surat || ''}"></div><div><label class="text-[10px] font-black">AYAT</label><input type="text" oninput="tadarusData[${t}].ayat=this.value; saveUserState();" class="w-full p-3 border-2 rounded-xl text-sm" placeholder="1-20" value="${tadarusData[t]?.ayat || ''}"></div></div><button onclick="handleSimpanHarian(${t}, 'Tadarus')" class="w-full py-3 bg-blue-600 text-white rounded-xl font-black">💾 SIMPAN DATA</button></div>`).join('')}</div>`;
            } else if (currentTab === 'Ceramah') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-5 border rounded-2xl border-l-8 border-rose-500 shadow-sm"><h3 class="font-black text-rose-900 mb-4">📅 Hari ke-${t}</h3><div class="space-y-3"><input type="text" oninput="ceramahData[${t}].penceramah=this.value; saveUserState();" class="w-full p-3 border-2 rounded-xl text-sm" placeholder="Nama Penceramah" value="${ceramahData[t]?.penceramah || ''}"><input type="text" oninput="ceramahData[${t}].tempat=this.value; saveUserState();" class="w-full p-3 border-2 rounded-xl text-sm" placeholder="Tempat / Media" value="${ceramahData[t]?.tempat || ''}"><textarea oninput="ceramahData[${t}].ringkasan=this.value; saveUserState();" class="w-full p-3 border-2 rounded-xl text-sm" placeholder="Ringkasan isi ceramah...">${ceramahData[t]?.ringkasan || ''}</textarea></div><button onclick="handleSimpanHarian(${t}, 'Ceramah')" class="w-full mt-4 py-3 bg-rose-600 text-white rounded-xl font-black">💾 SIMPAN DATA</button></div>`).join('')}</div>`;
            }
        }

        async function handleSimpanHarian(tgl, cat) {
            if (!SCHOOL_ID) return showToast("Error: ID Sekolah tidak ditemukan.", false);
            let detail = null;
            if (cat === 'Shalat Fardu') detail = shalatData[tgl];
            else if (cat === 'Tarawih') detail = tarawihData[tgl];
            else if (cat === 'Puasa') detail = { status: puasaData[tgl] };
            else if (cat === 'Tadarus') detail = tadarusData[tgl];
            else if (cat === 'Ceramah') detail = ceramahData[tgl];

            const record = { nama: currentUser.nama, kelas: currentUser.kelas, kategori: cat, tanggal: tgl, hadir: JSON.stringify(detail) };
            allRecords = allRecords.filter(r => !(r.nama === currentUser.nama && r.kelas === currentUser.kelas && r.kategori === cat && r.tanggal == tgl));
            allRecords.push(record); saveAllRecords();

            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ 
                    ss_id: SCHOOL_ID, ...record, 
                    shalat_detail: shalatData[tgl], 
                    tarawih_detail: tarawihData[tgl], 
                    puasa_detail: puasaData[tgl], 
                    tadarus_detail: tadarusData[tgl], 
                    ceramah_detail: ceramahData[tgl] 
                })});
                showToast(`Data Hari ke-${tgl} berhasil dikirim!`);
            } catch (e) { showToast("Gagal terhubung ke Cloud.", false); }
        }

        function getMergedRecords(records) {
            const map = new Map();
            records.forEach(r => map.set(`${String(r.nama).trim()}-${String(r.kelas).trim()}-${r.kategori}-${r.tanggal}`, r));
            return Array.from(map.values());
        }

        function showRekapPage() {
            const my = getMergedRecords(allRecords.filter(r => String(r.nama).trim() === String(currentUser.nama).trim() && String(r.kelas).trim() === String(currentUser.kelas).trim()));
            document.getElementById('app').innerHTML = `<div class="w-full h-full overflow-auto bg-gray-50 p-4 md:p-8"><div class="max-w-4xl mx-auto"><div class="bg-white p-6 rounded-2xl shadow-xl mb-6 flex justify-between items-center"><div><h1 class="font-black text-3xl text-emerald-800">📊 Rekap Saya</h1></div><button onclick="showAmalanPage()" class="px-6 py-3 bg-emerald-600 text-white font-black rounded-xl shadow-lg active:scale-95">← KEMBALI</button></div><div class="space-y-8">${categories.map(cat => { const items = my.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal)); return `<div class="bg-white rounded-2xl shadow-md overflow-hidden border"><div class="p-4 bg-emerald-50 border-b flex justify-between items-center"><span class="font-black text-emerald-800">${cat}</span><span class="bg-white px-3 py-1 rounded-full text-xs font-bold text-emerald-600">${items.length} HARI</span></div><div class="divide-y">${items.length ? items.map(r => `<div class="p-4 flex gap-4 text-sm"><span class="font-black text-gray-300">HARI ${r.tanggal}</span><div class="flex-1">${renderDetailData(cat, r.hadir)}</div></div>`).join('') : '<p class="p-8 text-center text-gray-400 italic">Belum ada data.</p>'}</div></div>`; }).join('')}</div></div></div>`;
        }

        function showLaporanPage() {
            const allMerged = getMergedRecords(allRecords);
            // Group students by trimmed name/class to ensure uniqueness
            const allSMap = new Map();
            allMerged.forEach(r => allSMap.set(`${String(r.nama).trim()}-${String(r.kelas).trim()}`, {nama: String(r.nama).trim(), kelas: String(r.kelas).trim()}));
            const allS = Array.from(allSMap.values()).sort((a,b) => a.nama.localeCompare(b.nama));

            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-slate-100 p-4 md:p-6">
                    <div class="max-w-6xl mx-auto">
                        <div class="bg-white p-6 rounded-2xl shadow-xl mb-6 flex justify-between items-center">
                            <h1 class="font-black text-2xl text-slate-800">📋 PANEL GURU</h1>
                            <div class="flex gap-2">
                                <button onclick="fetchAllDataForAdmin()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold shadow-md">🔄 REFRESH</button>
                                <button onclick="handleLogout()" class="px-4 py-2 bg-slate-800 text-white rounded-lg font-bold shadow-md">KELUAR</button>
                            </div>
                        </div>
                        <div id="studentListGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${allS.map(s => `
                                <div onclick='showStudentDetail(${JSON.stringify(s)})' class="bg-white p-5 rounded-2xl shadow-sm border hover:border-emerald-500 cursor-pointer transition-all">
                                    <h3 class="font-black text-gray-800">${s.nama}</h3>
                                    <p class="text-xs font-bold text-emerald-600">Kelas: ${s.kelas}</p>
                                    <p class="text-[10px] text-gray-400 mt-3 italic">Klik untuk detail lengkap</p>
                                </div>`).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function showStudentDetail(s) {
            const data = getMergedRecords(allRecords.filter(r => String(r.nama).trim() === s.nama && String(r.kelas).trim() === s.kelas));
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-slate-50 p-6">
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-white p-6 rounded-2xl shadow-xl mb-6 flex justify-between items-center">
                            <div><h2 class="font-black text-2xl">${s.nama}</h2><p class="text-emerald-600 font-bold">Kelas: ${s.kelas}</p></div>
                            <button onclick="showLaporanPage()" class="px-5 py-2 bg-slate-800 text-white rounded-xl font-bold shadow-md">← KEMBALI</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${categories.map(cat => {
                                const recs = data.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
                                return `<div class="bg-white p-6 rounded-2xl shadow-sm border"><h3 class="font-black border-b pb-2 mb-4 text-slate-700">${cat}</h3><div class="space-y-2">${recs.length ? recs.map(r => `<div class="text-xs p-3 bg-slate-50 rounded-lg border border-slate-100"><strong>Hari ke-${r.tanggal}:</strong><br>${renderDetailData(cat, r.hadir)}</div>`).join('') : '<p class="text-xs text-gray-400 italic">Belum ada data.</p>'}</div></div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function parseRecordData(d) { 
            if (typeof d === 'object' && d !== null) return d;
            if (!d) return null;
            try { return JSON.parse(d); } catch (e) { return d; } 
        }
        
        function renderDetailData(k, d) {
            const data = parseRecordData(d);
            if (!data) return '-'; 
            
            // LOGIKA RENDERING YANG DIPERKUAT
            if (k === 'Shalat Fardu') {
                // Jika data adalah string tunggal (misal 'berjamaah'), tampilkan langsung
                if (typeof data === 'string' && data !== '{"' && !data.includes(':')) return data;
                
                const keys = ['Subuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya'];
                return keys.map(key => {
                    const val = (typeof data === 'object' && data !== null) ? (data[key] || '-') : '-';
                    return `${key}: <span class="font-bold text-emerald-600">${val}</span>`;
                }).join(' | ');
            } else if (k === 'Tarawih') {
                return `Status: <b>${data.status || '-'}</b>, Lokasi: <b>${data.tempat || '-'}</b>`;
            } else if (k === 'Puasa') {
                return `Status: <b>${data.status || (typeof data === 'string' ? data : '-')}</b>`;
            } else if (k === 'Tadarus') {
                return `Metode: <b>${data.pilihan || '-'}</b>, Surat: <b>${data.surat || '-'}</b> (${data.ayat || '-'})`;
            } else if (k === 'Ceramah') {
                return `Penceramah: <b>${data.penceramah || '-'}</b>, Lokasi: <b>${data.tempat || '-'}</b><br><span class="text-xs italic">"${data.ringkasan || '-'}"</span>`;
            }
            return typeof data === 'object' ? JSON.stringify(data) : data;
        }

        async function init() { 
            loadAllRecords(); 
            const saved = safeGetStorage('ramadhanUser'); 
            if (!SCHOOL_ID) renderRegistration();
            else if (saved) { try { currentUser = JSON.parse(saved); loadUserState(); showAmalanPage(); } catch(e) { showLoginPage(); } }
            else showLoginPage();
        }
        init();
  </script>
 </body>
</html>
