<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amalan Ramadhan Multi-School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.onerror = function(msg, url, line, col, error) {
        const app = document.getElementById('app');
        if (app) {
            app.innerHTML = `<div class="p-10 text-center"><h3 class="text-red-600 font-bold">Terjadi Kesalahan Aplikasi</h3><p class="text-gray-500">${msg}</p><button onclick="localStorage.clear(); location.reload();" class="mt-4 px-4 py-2 bg-gray-800 text-white rounded-lg">Reset & Reload Aplikasi</button></div>`;
        }
        return false;
    };
  </script>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .tab-button.active { border-bottom: 3px solid; color: #059669; background-color: #ecfdf5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
 </head>
 <body class="h-full bg-gray-50">
  <div id="app" class="w-full h-full overflow-auto"></div>
  <script>
        // --- KONFIGURASI ---
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7IjJZdiHITMGhSMSWWneT1E9qIWUOBwkuJv4krc4_IPk-pQYA1hgFXyNfMu9oKjr6Bw/exec';
        
        function getSchoolId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            if (!id && window.location.href.includes('id=')) id = window.location.href.split('id=')[1].split('&')[0];
            if (!id) id = sessionStorage.getItem('current_school_id');
            return id;
        }

        let SCHOOL_ID = getSchoolId();
        let currentUser = null;
        let currentTab = 'Shalat Fardu';
        let allRecords = []; 
        const categories = ['Shalat Fardu', 'Tarawih', 'Puasa', 'Tadarus', 'Ceramah'];

        let shalatData = {};
        let tarawihData = {};
        let puasaData = {};
        let tadarusData = {};
        let ceramahData = {};

        function initDefaultData() {
            for (let i = 1; i <= 30; i++) {
                shalatData[i] = { 'Subuh': null, 'Dzuhur': null, 'Ashar': null, 'Maghrib': null, 'Isya': null };
                tarawihData[i] = { status: null, tempat: null };
                puasaData[i] = null;
                tadarusData[i] = { pilihan: null, surat: '', ayat: '', ustadz: '' };
                ceramahData[i] = { penceramah: '', tempat: '', media: '', ringkasan: '' };
            }
        }
        initDefaultData();

        // --- STORAGE HELPERS ---
        function safeGetStorage(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function safeSetStorage(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
        function safeRemoveStorage(key) { try { localStorage.removeItem(key); } catch (e) {} }

        function loadAllRecords() {
            const saved = safeGetStorage('ramadhanAllRecords');
            if (saved) { 
                try { 
                    allRecords = JSON.parse(saved); 
                    if (!Array.isArray(allRecords)) allRecords = [];
                } catch(e) { 
                    allRecords = []; 
                } 
            } else {
                allRecords = [];
            }
        }
        function saveAllRecords() { safeSetStorage('ramadhanAllRecords', JSON.stringify(allRecords)); }

        function loadUserState() {
            if (!currentUser) return;
            const key = `ramadhanState_${currentUser.nama.replace(/\s+/g, '_')}_${currentUser.kelas}`;
            const saved = safeGetStorage(key);
            if (saved) {
                try {
                    const state = JSON.parse(saved);
                    shalatData = state.shalatData || shalatData;
                    tarawihData = state.tarawihData || tarawihData;
                    puasaData = state.puasaData || puasaData;
                    tadarusData = state.tadarusData || tadarusData;
                    ceramahData = state.ceramahData || ceramahData;
                } catch (e) { initDefaultData(); }
            } else { initDefaultData(); }
        }

        function saveUserState() {
            if (!currentUser || isAdmin()) return;
            const key = `ramadhanState_${currentUser.nama.replace(/\s+/g, '_')}_${currentUser.kelas}`;
            safeSetStorage(key, JSON.stringify({ shalatData, tarawihData, puasaData, tadarusData, ceramahData }));
        }

        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl shadow-lg text-white z-[100] transition-all duration-300 ${isSuccess ? 'bg-emerald-600' : 'bg-red-600'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function isAdmin() { return currentUser && currentUser.nama === '*'; }

        // --- SINKRONISASI CLOUD ---
        async function fetchAllDataForAdmin() {
            if (!SCHOOL_ID) return showToast("ID Sekolah tidak ditemukan.", false);
            const loading = document.createElement('div');
            loading.className = "fixed inset-0 bg-black/20 z-[90] flex items-center justify-center";
            loading.innerHTML = '<div class="bg-white p-6 rounded-2xl shadow-xl font-bold flex items-center gap-3"><span>🔄</span> Sinkronisasi Cloud...</div>';
            document.body.appendChild(loading);

            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'readAll');
                url.searchParams.append('ss_id', SCHOOL_ID);
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === 'success') {
                    allRecords = result.data.map(item => ({
                        nama: String(item.nama || '').trim(),
                        kelas: String(item.kelas || '').trim(),
                        kategori: item.kategori,
                        tanggal: item.tanggal,
                        hadir: item.detail 
                    }));
                    saveAllRecords();
                    showLaporanPage();
                    showToast("Data Berhasil Disinkronkan!");
                }
            } catch (e) { showToast("Gagal mengambil data dari Cloud.", false); }
            finally { if(loading.parentNode) loading.remove(); }
        }

        async function syncUserFromCloud() {
            if (!currentUser || isAdmin() || !SCHOOL_ID) return;
            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'read');
                url.searchParams.append('ss_id', SCHOOL_ID);
                url.searchParams.append('nama', currentUser.nama);
                url.searchParams.append('kelas', currentUser.kelas);
                const res = await fetch(url);
                const result = await res.json();
                if (result.status === 'success' && Array.isArray(result.data)) {
                    result.data.forEach(item => {
                        const tgl = item.tanggal;
                        const cat = item.kategori;
                        if (cat === 'Shalat Fardu') shalatData[tgl] = { ...shalatData[tgl], ...item.detail };
                        else if (cat === 'Tarawih') tarawihData[tgl] = { ...tarawihData[tgl], ...item.detail };
                        else if (cat === 'Puasa') puasaData[tgl] = item.detail.status || item.detail;
                        else if (cat === 'Tadarus') tadarusData[tgl] = { ...tadarusData[tgl], ...item.detail };
                        else if (cat === 'Ceramah') ceramahData[tgl] = { ...ceramahData[tgl], ...item.detail };
                    });
                    saveUserState();
                    if (document.getElementById('contentArea')) renderContentArea();
                }
            } catch (e) {}
        }

        // --- LOGIN ---
        function showLoginPage() {
            const lastNama = safeGetStorage('last_nama') || '';
            const lastKelas = safeGetStorage('last_kelas') || '';
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-emerald-600 p-4">
                    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8">
                        <h1 class="text-3xl font-black text-center text-emerald-800 mb-2">Amalan Ramadhan</h1>
                        <p class="text-center text-gray-400 text-sm mb-8">Silakan masuk untuk mencatat ibadah.</p>
                        <form id="loginForm" class="space-y-4">
                            <div><label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Nama Lengkap</label><input type="text" id="nama" value="${lastNama}" class="w-full p-3 border-2 border-gray-100 rounded-xl outline-none focus:border-emerald-500 transition-all"></div>
                            <div><label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Kelas</label><input type="text" id="kelas" value="${lastKelas}" class="w-full p-3 border-2 border-gray-100 rounded-xl outline-none focus:border-emerald-500 transition-all" placeholder="Contoh: 9A"></div>
                            <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-all">MASUK APLIKASI</button>
                        </form>
                    </div>
                </div>`;
            document.getElementById('loginForm').onsubmit = (e) => {
                e.preventDefault();
                const nama = document.getElementById('nama').value.trim();
                const kelas = document.getElementById('kelas').value.trim();
                if (!nama || (!kelas && nama !== '*')) return showToast("Isi Nama dan Kelas!", false);
                currentUser = { nama, kelas };
                if (nama !== '*') { safeSetStorage('last_nama', nama); safeSetStorage('last_kelas', kelas); }
                safeSetStorage('ramadhanUser', JSON.stringify(currentUser));
                loadUserState();
                if (isAdmin()) {
                    fetchAllDataForAdmin();
                } else { 
                    syncUserFromCloud(); 
                    showAmalanPage(); 
                }
            };
        }

        // --- TAMPILAN SISWA ---
        function showAmalanPage() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-emerald-600 pb-24">
                    <div class="max-w-xl mx-auto p-4">
                        <div class="bg-white rounded-3xl shadow-xl p-6 mb-4">
                            <h2 class="text-xl font-black text-emerald-800">${currentUser.nama}</h2>
                            <p class="text-sm font-bold text-emerald-500">Kelas ${currentUser.kelas}</p>
                            <div class="flex gap-2 mt-4">
                                <button onclick="showRekapPage()" class="flex-1 bg-emerald-50 text-emerald-700 py-3 rounded-xl font-bold">📊 REKAP SAYA</button>
                                <button onclick="handleLogout()" class="px-4 bg-red-50 text-red-600 rounded-xl font-bold">KELUAR</button>
                            </div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-md flex overflow-x-auto no-scrollbar mb-4 sticky top-4 z-50 p-1">
                            ${categories.map(cat => `<button onclick="currentTab='${cat}'; showAmalanPage();" class="tab-button flex-1 py-3 px-4 rounded-xl font-bold text-xs whitespace-nowrap transition-all ${currentTab === cat ? 'active' : 'text-gray-400'}">${cat}</button>`).join('')}
                        </div>
                        <div id="contentArea" class="space-y-4"></div>
                    </div>
                </div>`;
            renderContentArea();
        }

        function renderContentArea() {
            const area = document.getElementById('contentArea');
            const days = Array.from({length: 30}, (_, i) => i + 1);
            let html = "";
            days.forEach(t => {
                html += `<div class="bg-white p-6 rounded-3xl shadow-sm border-l-8 ${getCategoryColor()}">
                    <h3 class="font-black text-gray-800 mb-4 flex justify-between">Hari ke-${t} <span class="text-xs text-gray-300">Ramadhan</span></h3>
                    <div class="space-y-4">`;

                if (currentTab === 'Shalat Fardu') {
                    ['Subuh','Dzuhur','Ashar','Maghrib','Isya'].forEach(w => {
                        html += `<div class="flex flex-col gap-2 pb-3 border-b last:border-0 border-gray-50">
                            <span class="text-xs font-black text-gray-400">${w}</span>
                            <div class="flex flex-wrap gap-1">
                                ${['berjamaah','munfarid','haid','tidak shalat'].map(s => `
                                    <button onclick="updateShalat(${t}, '${w}', '${s}')" class="px-3 py-1.5 text-[10px] rounded-lg border-2 font-bold transition-all ${shalatData[t]?.[w] === s ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-white text-gray-400 border-gray-100'}">${s}</button>
                                `).join('')}
                            </div>
                        </div>`;
                    });
                } else if (currentTab === 'Tarawih') {
                    html += `<div><p class="text-[10px] font-bold text-gray-400 mb-1">STATUS</p><div class="flex flex-wrap gap-1 mb-3">${['berjamaah','munfarid','tidak','sakit','haid'].map(s => `<button onclick="tarawihData[${t}].status='${s}'; saveUserState(); renderContentArea();" class="px-3 py-2 text-[10px] border-2 rounded-lg font-bold ${tarawihData[t]?.status === s ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-gray-50'}">${s}</button>`).join('')}</div></div>`;
                    html += `<div><p class="text-[10px] font-bold text-gray-400 mb-1">LOKASI</p><div class="flex gap-1">${['mesjid','rumah'].map(tmp => `<button onclick="tarawihData[${t}].tempat='${tmp}'; saveUserState(); renderContentArea();" class="flex-1 py-2 text-[10px] border-2 rounded-lg font-bold ${tarawihData[t]?.tempat === tmp ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-gray-50'}">${tmp}</button>`).join('')}</div></div>`;
                } else if (currentTab === 'Puasa') {
                    html += `<div class="flex flex-wrap gap-1">${['mengerjakan','tidak mengerjakan','sakit','haid'].map(s => `<button onclick="puasaData[${t}]='${s}'; saveUserState(); renderContentArea();" class="px-3 py-2 text-[10px] border-2 rounded-lg font-bold ${puasaData[t] === s ? 'bg-orange-500 border-orange-500 text-white' : 'border-gray-50'}">${s}</button>`).join('')}</div>`;
                } else if (currentTab === 'Tadarus') {
                    html += `<select onchange="tadarusData[${t}].pilihan=this.value; saveUserState();" class="w-full p-3 bg-gray-50 rounded-xl text-sm border-0"><option value="">Pilih Metode</option><option value="sendiri" ${tadarusData[t].pilihan=='sendiri'?'selected':''}>Sendiri</option><option value="ustadz" ${tadarusData[t].pilihan=='ustadz'?'selected':''}>Simakan Bersama Ustadz</option></select>
                             <div class="grid grid-cols-2 gap-2 mt-2"><input type="text" placeholder="Surat" value="${tadarusData[t].surat}" oninput="tadarusData[${t}].surat=this.value; saveUserState();" class="p-3 bg-gray-50 rounded-xl text-sm border-0"><input type="text" placeholder="Ayat" value="${tadarusData[t].ayat}" oninput="tadarusData[${t}].ayat=this.value; saveUserState();" class="p-3 bg-gray-50 rounded-xl text-sm border-0"></div>`;
                } else if (currentTab === 'Ceramah') {
                    html += `<div class="space-y-2"><input type="text" placeholder="Nama Penceramah" value="${ceramahData[t].penceramah}" oninput="ceramahData[${t}].penceramah=this.value; saveUserState();" class="w-full p-3 bg-gray-50 rounded-xl text-sm border-0"><input type="text" placeholder="Lokasi / Media" value="${ceramahData[t].tempat}" oninput="ceramahData[${t}].tempat=this.value; saveUserState();" class="w-full p-3 bg-gray-50 rounded-xl text-sm border-0"><textarea placeholder="Ringkasan..." oninput="ceramahData[${t}].ringkasan=this.value; saveUserState();" class="w-full p-3 bg-gray-50 rounded-xl text-sm border-0 h-20">${ceramahData[t].ringkasan}</textarea></div>`;
                }
                html += `<button onclick="handleSimpan(${t})" class="w-full py-3 mt-4 bg-gray-800 text-white rounded-xl font-bold text-xs">💾 SIMPAN DATA HARI KE-${t}</button>`;
                html += `</div></div>`;
            });
            area.innerHTML = html;
        }

        function getCategoryColor() {
            switch(currentTab) {
                case 'Shalat Fardu': return 'border-emerald-500';
                case 'Tarawih': return 'border-indigo-500';
                case 'Puasa': return 'border-orange-500';
                case 'Tadarus': return 'border-blue-500';
                case 'Ceramah': return 'border-rose-500';
                default: return 'border-gray-200';
            }
        }

        function updateShalat(t, w, s) { shalatData[t][w] = s; saveUserState(); renderContentArea(); }

        async function handleSimpan(tgl) {
            if (!SCHOOL_ID) return showToast("Akses Link Sekolah diperlukan!", false);
            const btn = event.currentTarget;
            btn.disabled = true; btn.textContent = "⏳ MENGIRIM...";
            const payload = {
                ss_id: SCHOOL_ID, nama: currentUser.nama, kelas: currentUser.kelas, kategori: currentTab, tanggal: tgl,
                shalat_detail: shalatData[tgl], tarawih_detail: tarawihData[tgl], puasa_detail: puasaData[tgl], tadarus_detail: tadarusData[tgl], ceramah_detail: ceramahData[tgl]
            };
            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                showToast(`Data Hari ke-${tgl} Terkirim!`);
            } catch (e) { showToast("Gagal kirim data.", false); }
            finally { btn.disabled = false; btn.textContent = `💾 SIMPAN DATA HARI KE-${tgl}`; }
        }

        // --- TAMPILAN ADMIN ---
        function showLaporanPage() {
            const studentsMap = new Map();
            allRecords.forEach(r => studentsMap.set(`${r.nama}|${r.kelas}`, { nama: r.nama, kelas: r.kelas }));
            const students = Array.from(studentsMap.values()).sort((a,b) => a.nama.localeCompare(b.nama));

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-slate-900 p-6">
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-white/10 backdrop-blur-md p-6 rounded-3xl shadow-xl border border-white/10 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div><h1 class="text-2xl font-black text-white">PANEL GURU</h1><p class="text-white/40 text-xs">Rekapitulasi Amalan Ramadhan Siswa</p></div>
                            <div class="flex gap-2 w-full md:w-auto">
                                <button onclick="fetchAllDataForAdmin()" class="flex-1 md:flex-none px-6 py-3 bg-emerald-600 text-white rounded-xl font-bold shadow-lg">🔄 REFRESH DATA</button>
                                <button onclick="handleLogout()" class="px-6 py-3 bg-white/10 text-white rounded-xl font-bold border border-white/20">KELUAR</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${students.length ? students.map(s => `
                                <div onclick='showStudentDetail(${JSON.stringify(s)})' class="bg-white p-5 rounded-2xl shadow-sm cursor-pointer hover:ring-2 hover:ring-emerald-500 transition-all">
                                    <h3 class="font-black text-gray-800">${s.nama}</h3>
                                    <p class="text-xs font-bold text-emerald-600">Kelas ${s.kelas}</p>
                                    <div class="mt-4 flex items-center justify-between"><span class="text-[10px] text-gray-400">Klik rincian</span><span class="text-emerald-500">→</span></div>
                                </div>`).join('') : '<div class="col-span-full py-20 text-center text-white/20 italic font-bold">Data kosong atau sedang memuat...</div>'}
                        </div>
                    </div>
                </div>`;
        }

        function showStudentDetail(s) {
            const data = allRecords.filter(r => r.nama === s.nama && r.kelas === s.kelas);
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-slate-100 p-6">
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-white p-6 rounded-3xl shadow-lg mb-6 flex justify-between items-center border-b-4 border-emerald-600">
                            <div><h2 class="text-2xl font-black text-gray-800">${s.nama}</h2><p class="text-emerald-600 font-bold">Kelas ${s.kelas}</p></div>
                            <button onclick="showLaporanPage()" class="px-6 py-3 bg-gray-800 text-white rounded-xl font-bold">← KEMBALI</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${categories.map(cat => {
                                const recs = data.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
                                return `<div class="bg-white p-6 rounded-2xl shadow-sm"><h3 class="font-black text-emerald-800 border-b pb-2 mb-4">${cat}</h3><div class="space-y-3">${recs.length ? recs.map(r => `<div class="p-3 bg-slate-50 rounded-xl border"><p class="text-[10px] font-black text-emerald-600 mb-1">HARI KE-${r.tanggal}</p><div class="text-[11px] leading-relaxed">${renderDetailData(cat, r.hadir)}</div></div>`).join('') : '<p class="text-xs text-gray-400 italic">Tidak ada data.</p>'}</div></div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function renderDetailData(k, d) {
            if (!d) return '-';
            const data = (typeof d === 'string') ? JSON.parse(d) : d;
            if (k === 'Shalat Fardu') {
                const wkt = ['Subuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya'];
                return wkt.map(w => `<div class="flex justify-between border-b border-gray-100 py-0.5"><span>${w}</span><span class="font-bold text-emerald-600">${data[w] || '-'}</span></div>`).join('');
            } else if (k === 'Tarawih') {
                return `Status: <b>${data.status || '-'}</b><br>Lokasi: <b>${data.tempat || '-'}</b>`;
            } else if (k === 'Puasa') {
                return `Status: <b>${data.status || (typeof data === 'string' ? data : '-')}</b>`;
            } else if (k === 'Tadarus') {
                return `Metode: <b>${data.pilihan || '-'}</b><br>Surat: <b>${data.surat || '-'}</b> (${data.ayat || '-'})`;
            } else if (k === 'Ceramah') {
                return `Penceramah: <b>${data.penceramah || '-'}</b><br>Media: <b>${data.tempat || '-'}</b><br><p class="mt-1 italic text-gray-500">"${data.ringkasan || '-'}"</p>`;
            }
            return JSON.stringify(data);
        }

        function showRekapPage() {
            const records = JSON.parse(safeGetStorage('ramadhanAllRecords') || '[]').filter(r => r.nama === currentUser.nama && r.kelas === currentUser.kelas);
            document.getElementById('app').innerHTML = `<div class="min-h-screen bg-gray-50 p-6"><div class="max-w-xl mx-auto"><div class="bg-white p-6 rounded-3xl shadow-lg mb-6 flex justify-between items-center"><h1 class="text-2xl font-black">📊 Rekap Saya</h1><button onclick="showAmalanPage()" class="px-5 py-2 bg-emerald-600 text-white rounded-xl font-bold">KEMBALI</button></div>${categories.map(cat => { const items = records.filter(r => r.kategori === cat); return `<div class="bg-white rounded-2xl shadow-md overflow-hidden mb-4"><div class="p-4 bg-emerald-50 font-black text-emerald-800 border-b">${cat}</div><div class="p-4 space-y-2">${items.length ? items.map(r => `<div class="text-xs pb-2 border-b last:border-0"><b>Hari ${r.tanggal}:</b> ${renderDetailData(cat, r.hadir)}</div>`).join('') : '<p class="text-xs text-gray-400 italic">Data Cloud kosong.</p>'}</div></div>` }).join('')}</div></div>`;
        }

        // --- INIT ---
        function init() {
            loadAllRecords();
            const savedUser = safeGetStorage('ramadhanUser');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    if (isAdmin()) {
                        fetchAllDataForAdmin(); 
                    } else { 
                        loadUserState(); 
                        syncUserFromCloud(); 
                        showAmalanPage(); 
                    }
                } catch (e) { showLoginPage(); }
            } else showLoginPage();
        }
        
        init();
  </script>
 </body>
</html>
