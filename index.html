<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amalan Ramadhan Multi-School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Error Handler Global
    window.onerror = function(msg, url, line, col, error) {
        const app = document.getElementById('app');
        if (app) {
            app.innerHTML = `
                <div style="padding: 20px; color: red; font-family: sans-serif; text-align: center;">
                    <h3>Terjadi Kesalahan Aplikasi</h3>
                    <p>${msg}</p>
                    <button onclick="localStorage.clear(); location.reload();" style="margin-top:10px; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        Reset & Reload Aplikasi
                    </button>
                </div>
            `;
        }
        return false;
    };

    window.elementSdk = {
        config: {},
        init: (options) => {
            if (options.onConfigChange) options.onConfigChange(options.defaultConfig);
        },
        setConfig: (conf) => { Object.assign(window.elementSdk.config, conf); }
    };
    window.dataSdk = {
        init: () => Promise.resolve({ isOk: true }),
        create: (data) => Promise.resolve({ isOk: true })
    };
  </script>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .tab-button.active { border-bottom: 3px solid; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        
        @keyframes pulseBlue {
          0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
          70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
          100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        @keyframes pulseGreen {
          0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
          70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
          100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .pulse-blue { animation: pulseBlue 2s infinite; }
        .pulse-green { animation: pulseGreen 2s infinite; }
    </style>
 </head>
 <body class="h-full bg-gray-50">
  <div id="app" class="w-full h-full"></div>
  <script>
        /**
         * KONFIGURASI MULTI-SCHOOL
         */
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7IjJZdiHITMGhSMSWWneT1E9qIWUOBwkuJv4krc4_IPk-pQYA1hgFXyNfMu9oKjr6Bw/exec';
        
        function getSchoolId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            if (!id && window.location.href.includes('id=')) {
                id = window.location.href.split('id=')[1].split('&')[0];
            }
            if (!id) {
                id = sessionStorage.getItem('current_school_id');
            }
            return id;
        }

        let SCHOOL_ID = getSchoolId();

        const defaultConfig = {
            app_title: "Amalan Ramadhan Siswa",
            welcome_message: "Selamat datang di aplikasi Amalan Ramadhan",
            background_color: "#10b981",
            surface_color: "#ffffff",
            text_color: "#1f2937",
            primary_action_color: "#059669",
            secondary_action_color: "#6b7280",
            font_family: "Plus Jakarta Sans",
            font_size: 16
        };

        let currentUser = null;
        let currentTab = 'Shalat Fardu';
        let allRecords = [];
        const categories = ['Shalat Fardu', 'Tarawih', 'Puasa', 'Tadarus', 'Ceramah'];

        let shalatData = {};
        let tarawihData = {};
        let puasaData = {};
        let tadarusData = {};
        let ceramahData = {};

        function initDefaultData() {
            for (let i = 1; i <= 30; i++) {
                shalatData[i] = { 'Subuh': null, 'Dzuhur': null, 'Ashar': null, 'Maghrib': null, 'Isya': null };
                tarawihData[i] = { status: null, tempat: null };
                puasaData[i] = null;
                tadarusData[i] = { pilihan: null, surat: '', ayat: '', ustadz: '' };
                ceramahData[i] = { penceramah: '', tempat: '', media: '', ringkasan: '' };
            }
        }
        initDefaultData();

        function safeGetStorage(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function safeSetStorage(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
        function safeRemoveStorage(key) { try { localStorage.removeItem(key); } catch (e) {} }
        
        function loadAllRecords() {
            const saved = safeGetStorage('ramadhanAllRecords');
            if (saved) { try { allRecords = JSON.parse(saved); } catch(e) {} }
        }
        function saveAllRecords() { safeSetStorage('ramadhanAllRecords', JSON.stringify(allRecords)); }

        function getUserStateKey() {
            if (!currentUser) return null;
            return `ramadhanState_${SCHOOL_ID}_${currentUser.nama.replace(/\s+/g, '_')}_${currentUser.kelas}`;
        }

        function loadUserState() {
            const key = getUserStateKey();
            if (!key) return;
            const savedState = safeGetStorage(key);
            if (savedState) {
                try {
                    const state = JSON.parse(savedState);
                    if (state.shalatData) shalatData = state.shalatData;
                    if (state.tarawihData) tarawihData = state.tarawihData;
                    if (state.puasaData) puasaData = state.puasaData;
                    if (state.tadarusData) tadarusData = state.tadarusData;
                    if (state.ceramahData) ceramahData = state.ceramahData;
                } catch (e) { initDefaultData(); }
            } else { initDefaultData(); }
        }

        function saveUserState() {
            const key = getUserStateKey();
            if (!key || isAdmin()) return;
            safeSetStorage(key, JSON.stringify({ shalatData, tarawihData, puasaData, tadarusData, ceramahData }));
        }

        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `toast fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white z-[100] ${isSuccess ? 'bg-green-600' : 'bg-red-600'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showConfirmDialog(message, onConfirm, isDanger = false) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black bg-opacity-50 z-[70] flex items-center justify-center p-4 transition-opacity duration-200';
            overlay.style.opacity = '0';
            const modal = document.createElement('div');
            modal.className = 'bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full transform transition-all duration-200 scale-95';
            modal.innerHTML = `
                <div class="text-center">
                    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full ${isDanger ? 'bg-red-100' : 'bg-blue-100'} mb-4">
                        <svg class="h-6 w-6 ${isDanger ? 'text-red-600' : 'text-blue-600'}" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                    </div>
                    <h3 class="text-lg leading-6 font-bold text-gray-900 mb-2">Konfirmasi</h3>
                    <p class="text-sm text-gray-500 mb-6">${message}</p>
                    <div class="flex gap-3 justify-center">
                        <button class="modal-cancel-btn flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium">Batal</button>
                        <button class="modal-confirm-btn flex-1 px-4 py-2 text-white rounded-lg font-medium shadow-md ${isDanger ? 'bg-red-600' : 'bg-blue-600'}">Ya, Lanjutkan</button>
                    </div>
                </div>
            `;
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            requestAnimationFrame(() => { overlay.style.opacity = '1'; modal.classList.add('scale-100'); });
            const close = () => { overlay.style.opacity = '0'; setTimeout(() => overlay.remove(), 200); };
            overlay.querySelector('.modal-cancel-btn').onclick = close;
            overlay.querySelector('.modal-confirm-btn').onclick = () => { close(); onConfirm(); };
        }

        function handleLogout() {
            showConfirmDialog("Apakah Anda yakin ingin keluar?", () => {
                safeRemoveStorage('ramadhanUser');
                currentUser = null;
                showLoginPage();
                showToast("Berhasil keluar.");
            });
        }

        function isAdmin() { return currentUser && currentUser.nama === '*'; }

        function renderRegistration() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-6 bg-emerald-600">
                    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-black text-slate-800">Daftar Sekolah</h1>
                            <p class="text-slate-400 text-sm mt-2">Buat sistem amalan ramadhan khusus sekolah Anda.</p>
                        </div>
                        <form id="regForm" class="space-y-4">
                            <input type="email" id="regEmail" placeholder="Gmail Guru" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                            <input type="text" id="regSchool" placeholder="Nama Sekolah" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                            <button type="submit" id="regBtn" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-black shadow-lg">BUAT SEKARANG</button>
                        </form>
                        <div id="regResult" class="mt-8 hidden p-6 bg-slate-900 rounded-3xl text-white">
                            <p class="text-[10px] font-bold text-emerald-400 uppercase mb-2">Link Siswa Anda:</p>
                            <textarea id="shareLink" class="w-full p-3 text-[11px] font-mono border rounded-xl bg-slate-800 border-slate-700 h-24 mb-3" readonly></textarea>
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <button onclick="downloadLink()" class="py-3 bg-blue-600 text-white rounded-xl font-bold pulse-blue shadow-lg text-xs">Unduh Instruksi</button>
                                <button onclick="copyLink()" class="py-3 bg-emerald-600 text-white rounded-xl font-bold pulse-green shadow-lg text-xs">Salin Link</button>
                            </div>
                            <button onclick="location.reload()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold shadow-lg">COBA MASUK</button>
                        </div>
                    </div>
                </div>`;

            document.getElementById('regForm').onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('regBtn');
                const email = document.getElementById('regEmail').value;
                const school = document.getElementById('regSchool').value;
                
                btn.disabled = true; btn.textContent = "Sedang Menyiapkan...";
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, { 
                        method: 'POST', 
                        body: JSON.stringify({ action: 'registerTeacher', email, nama_sekolah: school })
                    });
                    const data = await res.json();
                    if (data.ss_id) {
                        document.getElementById('regResult').classList.remove('hidden');
                        sessionStorage.setItem('current_school_id', data.ss_id);
                        document.getElementById('shareLink').value = window.location.href.split('?')[0] + '?id=' + data.ss_id;
                        btn.textContent = "Sekolah Terdaftar!";
                        showToast("Pendaftaran Berhasil!");
                    }
                } catch (err) { 
                    btn.disabled = false; btn.textContent = "Coba Lagi"; 
                    showToast("Gagal mendaftar. Periksa koneksi.", false);
                }
            };
        }

        window.copyLink = () => {
            const text = document.getElementById('shareLink').value;
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast("Link disalin!");
        };

        window.downloadLink = () => {
            const link = document.getElementById('shareLink').value;
            const textContent = `INFO AKSES APLIKASI AMALAN RAMADHAN\n-----------------------------------------\nLINK UNTUK SISWA :\n${link}\n\nCARA MASUK PANEL GURU :\n-----------------------------------------\n1. Buka link di atas.\n2. Nama Lengkap: * (tanda bintang)\n3. Pilih kelas apa saja.\n4. Klik Masuk.\n\nSelamat beribadah!`;
            const blob = new Blob([textContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'instruksi_guru_ramadhan.txt'; a.click();
            showToast("Instruksi diunduh!");
        };

        function showLoginPage() {
            const config = window.elementSdk?.config || defaultConfig;
            const lastNama = safeGetStorage('last_nama') || '';
            const lastKelas = safeGetStorage('last_kelas') || '';
            let classOptions = `<option value="">Pilih Kelas</option>`;
            ['7','8','9'].forEach(g => {
                classOptions += `<optgroup label="Kelas ${g}">`;
                ['A','B','C','D','E','F','G','H','I','J'].forEach(s => {
                    const c = `${g}${s}`;
                    classOptions += `<option value="${c}" ${c === lastKelas ? 'selected' : ''}>${c}</option>`;
                });
                classOptions += `</optgroup>`;
            });
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full flex items-center justify-center p-4" style="background: ${config.background_color};">
                    <div class="w-full max-w-md rounded-[2rem] shadow-2xl p-8 bg-white">
                        <h1 class="text-center font-black text-3xl mb-2 text-emerald-700">${config.app_title}</h1>
                        <p class="text-center text-sm mb-8 text-gray-500">${config.welcome_message}</p>
                        <form id="loginForm" class="space-y-4">
                            <div><label class="block mb-1 font-semibold text-gray-700">Nama Lengkap Siswa</label><input type="text" id="nama" value="${lastNama}" class="w-full px-4 py-3 bg-gray-50 border-2 border-transparent rounded-xl outline-none focus:ring-2 focus:ring-emerald-500"></div>
                            <div><label class="block mb-1 font-semibold text-gray-700">Kelas</label><select id="kelas" class="w-full px-4 py-3 bg-gray-50 border-2 border-transparent rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">${classOptions}</select></div>
                            <button type="submit" class="w-full py-4 rounded-xl text-white font-black bg-emerald-600 hover:bg-emerald-700 transition-all shadow-lg active:scale-95 uppercase tracking-wider">Masuk</button>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const nama = document.getElementById('nama').value.trim();
                const kelas = document.getElementById('kelas').value.trim();
                const admin = nama === '*';
                if (!admin && (!nama || !kelas)) return showToast("Mohon isi nama dan kelas", false);
                if (!admin) { safeSetStorage('last_nama', nama); safeSetStorage('last_kelas', kelas); }
                currentUser = { nama: nama, kelas: admin ? '*' : kelas, password: admin ? '*' : '' };
                safeSetStorage('ramadhanUser', JSON.stringify(currentUser));
                loadUserState();
                if (!admin) syncUserFromCloud();
                showAmalanPage();
            });
        }

        async function syncUserFromCloud() {
            if (!currentUser || isAdmin() || !SCHOOL_ID) return;
            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'read');
                url.searchParams.append('ss_id', SCHOOL_ID);
                url.searchParams.append('nama', currentUser.nama);
                url.searchParams.append('kelas', currentUser.kelas);
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === 'success' && Array.isArray(result.data)) {
                    result.data.forEach(item => {
                        const tgl = item.tanggal;
                        const cat = item.kategori;
                        let detail = item.detail || item.hadir;
                        if (typeof detail === 'string') { try { detail = JSON.parse(detail); } catch(e) {} }
                        
                        const record = { nama: currentUser.nama, kelas: currentUser.kelas, kategori: cat, tanggal: tgl, hadir: JSON.stringify(detail) };
                        allRecords = allRecords.filter(r => !(r.nama === record.nama && r.kategori === record.kategori && r.tanggal == record.tanggal));
                        allRecords.push(record);

                        if (cat === 'Shalat Fardu') shalatData[tgl] = { ...shalatData[tgl], ...detail };
                        else if (cat === 'Tarawih') tarawihData[tgl] = { ...tarawihData[tgl], ...detail };
                        else if (cat === 'Puasa') puasaData[tgl] = detail.status || detail;
                        else if (cat === 'Tadarus') tadarusData[tgl] = { ...tadarusData[tgl], ...detail };
                        else if (cat === 'Ceramah') ceramahData[tgl] = { ...ceramahData[tgl], ...detail };
                    });
                    saveAllRecords();
                    saveUserState();
                    if (document.getElementById('contentArea')) renderContentArea();
                }
            } catch (e) {}
        }

        function showAmalanPage() {
            if (!currentUser) return showLoginPage();
            if (isAdmin()) return (showLaporanPage(), fetchAllDataForAdmin());
            const config = window.elementSdk?.config || defaultConfig;
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-gray-50">
                    <div class="max-w-4xl mx-auto p-4 md:p-6 pb-24">
                        <div class="rounded-3xl shadow-xl p-6 mb-6 bg-white border border-emerald-50">
                            <h1 class="font-black text-2xl mb-4 text-emerald-800">${config.app_title}</h1>
                            <div class="mb-6 bg-emerald-50 p-5 rounded-2xl text-sm border border-emerald-100 flex flex-col md:flex-row justify-between gap-4">
                                <div>
                                    <p class="mb-1 text-emerald-900 font-bold uppercase text-[10px] tracking-widest opacity-60">Siswa Aktif</p>
                                    <p class="text-emerald-900 font-black text-xl">${currentUser.nama}</p>
                                    <p class="text-emerald-600 font-bold">Kelas ${currentUser.kelas}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button id="rekapBtn" class="flex-1 px-5 py-2.5 rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 shadow-md font-bold text-sm">📊 Rekap Saya</button>
                                    <button id="logoutBtn" class="px-5 py-2.5 rounded-xl text-white bg-red-500 hover:bg-red-600 shadow-md font-bold text-sm">Keluar</button>
                                </div>
                            </div>
                        </div>
                        <div class="rounded-2xl shadow-lg mb-6 overflow-hidden sticky top-0 z-40 bg-white border">
                            <div class="flex overflow-x-auto no-scrollbar">
                                ${categories.map(cat => `<button class="tab-button flex-1 px-4 py-4 font-black whitespace-nowrap text-sm ${currentTab === cat ? 'active text-emerald-600 border-b-4 border-emerald-600 bg-emerald-50/50' : 'text-gray-500'}" data-tab="${cat}">${cat}</button>`).join('')}
                            </div>
                        </div>
                        <div class="rounded-3xl shadow-xl p-6 bg-white min-h-[500px]">
                            <h2 class="font-black text-xl mb-6 flex items-center gap-2 text-gray-800 border-b pb-4 uppercase tracking-tighter"><span>📝</span> ${currentTab}</h2>
                            <div id="contentArea"></div>
                        </div>
                    </div>
                </div>
            `;
            document.querySelectorAll('.tab-button').forEach(btn => btn.onclick = (e) => { currentTab = e.target.dataset.tab; showAmalanPage(); });
            document.getElementById('rekapBtn').onclick = showRekapPage;
            document.getElementById('logoutBtn').onclick = handleLogout;
            renderContentArea();
        }

        function renderContentArea() {
            const area = document.getElementById('contentArea');
            const days = Array.from({length: 30}, (_, i) => i + 1);
            
            if (currentTab === 'Shalat Fardu') {
                area.innerHTML = `<div class="space-y-8">${days.map(t => `
                    <div class="p-6 border rounded-[2rem] bg-white shadow-sm border-l-8 border-emerald-500">
                        <h3 class="font-black text-emerald-800 mb-6 flex justify-between text-lg">📅 Hari ke-${t} <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest mt-1">Wajib</span></h3>
                        <div class="space-y-6">
                            ${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(w => `
                                <div class="pb-6 border-b border-gray-100 last:border-0">
                                    <div class="font-black text-gray-500 text-xs uppercase mb-3 tracking-widest">⏰ Shalat ${w}</div>
                                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
                                        ${['berjamaah','munfarid','haid','tidak shalat'].map(s => `
                                            <button class="sh-btn px-3 py-3 text-[10px] rounded-xl border-2 transition-all font-bold ${shalatData[t]?.[w] === s ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-gray-50 text-gray-400 border-transparent hover:border-emerald-200'}" data-t="${t}" data-w="${w}" data-s="${s}">${s.toUpperCase()}</button>
                                        `).join('')}
                                    </div>
                                    <button class="sv-wkt-btn w-full py-3 text-xs rounded-xl bg-blue-600 text-white font-black shadow-lg hover:bg-blue-700 active:scale-95 transition-all" data-t="${t}" data-w="${w}">💾 SIMPAN ${w.toUpperCase()}</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>`).join('')}</div>`;
                area.querySelectorAll('.sh-btn').forEach(b => b.onclick = (e) => { const d = e.target.dataset; shalatData[d.t][d.w] = d.s; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.sv-wkt-btn').forEach(b => b.onclick = (e) => handleSimpanPerWaktu(e.target.dataset.t, e.target.dataset.w));
                
            } else if (currentTab === 'Tarawih') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-6 border rounded-[2rem] shadow-sm border-l-8 border-indigo-500"><h3 class="font-black text-indigo-900 mb-4">📅 Hari ke-${t}</h3><div class="mb-4"><p class="text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">STATUS</p><div class="grid grid-cols-2 md:grid-cols-5 gap-2">${['berjamaah','munfarid','tidak mengerjakan','sakit','haid'].map(s => `<button class="tr-s px-2 py-3 text-[9px] border-2 rounded-xl font-black ${tarawihData[t]?.status === s ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-gray-50 border-transparent text-gray-400'}" data-t="${t}" data-s="${s}">${s.toUpperCase()}</button>`).join('')}</div></div><div class="mb-6"><p class="text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">TEMPAT</p><div class="grid grid-cols-2 gap-2">${['mesjid','rumah'].map(tmp => `<button class="tr-t px-4 py-3 text-[10px] border-2 rounded-xl font-black ${tarawihData[t]?.tempat === tmp ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-gray-50 border-transparent text-gray-400'}" data-t="${t}" data-tmp="${tmp}">${tmp.toUpperCase()}</button>`).join('')}</div></div><button class="sv-harian w-full py-4 bg-indigo-600 text-white rounded-xl font-black shadow-lg uppercase text-xs tracking-widest" data-t="${t}">💾 SIMPAN TARAWIH</button></div>`).join('')}</div>`;
                area.querySelectorAll('.tr-s').forEach(b => b.onclick = (e) => { tarawihData[e.target.dataset.t].status = e.target.dataset.s; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.tr-t').forEach(b => b.onclick = (e) => { tarawihData[e.target.dataset.t].tempat = e.target.dataset.tmp; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.sv-harian').forEach(b => b.onclick = (e) => handleSimpanHarian(e.target.dataset.t));
            } else if (currentTab === 'Puasa') {
                area.innerHTML = `<div class="space-y-4">${days.map(t => `<div class="p-6 border rounded-[2rem] border-l-8 border-orange-500 shadow-sm"><h3 class="font-black text-orange-900 mb-4">📅 Hari ke-${t}</h3><div class="grid grid-cols-2 gap-2 mb-6">${['mengerjakan','tidak mengerjakan','sakit','haid'].map(s => `<button class="ps-s px-4 py-3 text-[10px] border-2 rounded-xl font-black ${puasaData[t] === s ? 'bg-orange-500 text-white border-orange-500' : 'bg-gray-50 border-transparent text-gray-400'}" data-t="${t}" data-s="${s}">${s.toUpperCase()}</button>`).join('')}</div><button class="sv-harian w-full py-4 bg-orange-500 text-white rounded-xl font-black shadow-lg uppercase text-xs tracking-widest" data-t="${t}">💾 SIMPAN PUASA</button></div>`).join('')}</div>`;
                area.querySelectorAll('.ps-s').forEach(b => b.onclick = (e) => { puasaData[e.target.dataset.t] = e.target.dataset.s; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.sv-harian').forEach(b => b.onclick = (e) => handleSimpanHarian(e.target.dataset.t));
            } else if (currentTab === 'Tadarus') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-6 border rounded-[2rem] border-l-8 border-blue-500 shadow-sm"><h3 class="font-black text-blue-900 mb-4">📅 Hari ke-${t}</h3><div class="grid grid-cols-2 gap-2 mb-4">${['sendiri','ustadz'].map(m => `<button class="td-m px-4 py-3 text-[10px] border-2 rounded-xl font-black ${tadarusData[t]?.pilihan === m ? 'bg-blue-600 text-white border-blue-600' : 'bg-gray-50 border-transparent text-gray-400'}" data-t="${t}" data-m="${m}">${m === 'sendiri' ? 'SENDIRI' : 'DENGAN USTADZ'}</button>`).join('')}</div><div class="grid grid-cols-2 gap-4 mb-6"><div><label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">NAMA SURAT</label><input type="text" class="td-s w-full p-4 bg-gray-50 rounded-xl text-sm font-bold outline-none border-2 border-transparent focus:border-blue-500" placeholder="Contoh: Al-Baqarah" data-t="${t}" value="${tadarusData[t]?.surat || ''}"></div><div><label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">AYAT</label><input type="text" class="td-a w-full p-4 bg-gray-50 rounded-xl text-sm font-bold outline-none border-2 border-transparent focus:border-blue-500" placeholder="1-20" data-t="${t}" value="${tadarusData[t]?.ayat || ''}"></div></div><button class="sv-harian w-full py-4 bg-blue-600 text-white rounded-xl font-black shadow-lg uppercase text-xs" data-t="${t}">💾 SIMPAN TADARUS</button></div>`).join('')}</div>`;
                area.querySelectorAll('.td-m').forEach(b => b.onclick = (e) => { tadarusData[e.target.dataset.t].pilihan = e.target.dataset.m; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.td-s').forEach(i => i.oninput = (e) => { tadarusData[e.target.dataset.t].surat = i.value; saveUserState(); });
                area.querySelectorAll('.td-a').forEach(i => i.oninput = (e) => { tadarusData[e.target.dataset.t].ayat = i.value; saveUserState(); });
                area.querySelectorAll('.sv-harian').forEach(b => b.onclick = (e) => handleSimpanHarian(e.target.dataset.t));
            } else if (currentTab === 'Ceramah') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-6 border rounded-[2rem] border-l-8 border-rose-500 shadow-sm"><h3 class="font-black text-rose-900 mb-4">📅 Hari ke-${t}</h3><div class="space-y-4"><input type="text" class="cr-p w-full p-4 bg-gray-50 rounded-xl text-sm font-bold outline-none border-2 border-transparent focus:border-rose-500" placeholder="Nama Penceramah" data-t="${t}" value="${ceramahData[t]?.penceramah || ''}"><input type="text" class="cr-t w-full p-4 bg-gray-50 rounded-xl text-sm font-bold outline-none border-2 border-transparent focus:border-rose-500" placeholder="Tempat / Media" data-t="${t}" value="${ceramahData[t]?.tempat || ''}"><textarea class="cr-r w-full p-4 bg-gray-50 rounded-xl text-sm font-bold outline-none border-2 border-transparent focus:border-rose-500" placeholder="Ringkasan isi ceramah..." data-t="${t}" rows="3">${ceramahData[t]?.ringkasan || ''}</textarea></div><button class="sv-harian w-full mt-6 py-4 bg-rose-600 text-white rounded-xl font-black shadow-lg uppercase text-xs" data-t="${t}">💾 SIMPAN CERAMAH</button></div>`).join('')}</div>`;
                area.querySelectorAll('.cr-p').forEach(i => i.oninput = (e) => { ceramahData[e.target.dataset.t].penceramah = i.value; saveUserState(); });
                area.querySelectorAll('.cr-t').forEach(i => i.oninput = (e) => { ceramahData[e.target.dataset.t].tempat = i.value; saveUserState(); });
                area.querySelectorAll('.cr-r').forEach(i => i.oninput = (e) => { ceramahData[e.target.dataset.t].ringkasan = i.value; saveUserState(); });
                area.querySelectorAll('.sv-harian').forEach(b => b.onclick = (e) => handleSimpanHarian(e.target.dataset.t));
            }
        }

        async function handleSimpanPerWaktu(tgl, wkt) {
            if (!SCHOOL_ID) return showToast("ID Sekolah hilang. Harap buka melalui link yang benar.", false);
            const status = shalatData[tgl]?.[wkt];
            if (!status) return showToast(`Pilih status shalat ${wkt}!`, false);
            const btn = document.querySelector(`.sv-wkt-btn[data-t="${tgl}"][data-w="${wkt}"]`);
            btn.disabled = true; btn.textContent = 'MENGIRIM...';
            
            const detailObj = shalatData[tgl];
            const record = { 
                ss_id: SCHOOL_ID, 
                nama: currentUser.nama, 
                kelas: currentUser.kelas, 
                kategori: 'Shalat Fardu', 
                tanggal: tgl, 
                hadir: JSON.stringify(detailObj),
                sheet: 'Shalat Fardu',
                shalat_detail: detailObj
            };

            // Update local allRecords
            allRecords = allRecords.filter(r => !(r.nama === record.nama && r.kategori === record.kategori && r.tanggal == record.tanggal));
            allRecords.push({ ...record, hadir: JSON.stringify(detailObj) });
            saveAllRecords();
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, { 
                    method: 'POST', 
                    mode: 'no-cors',
                    body: JSON.stringify(record) 
                });
                showToast(`${wkt} hari ke-${tgl} disimpan!`);
            } catch (e) { showToast("Gagal menyimpan ke awan.", false); }
            finally { btn.disabled = false; btn.textContent = `💾 SIMPAN ${wkt.toUpperCase()}`; }
        }

        async function handleSimpanHarian(tgl) {
            if (!SCHOOL_ID) return showToast("ID Sekolah hilang.", false);
            let detailObj = null;
            if (currentTab === 'Tarawih') detailObj = tarawihData[tgl];
            else if (currentTab === 'Puasa') detailObj = { status: puasaData[tgl] };
            else if (currentTab === 'Tadarus') detailObj = tadarusData[tgl];
            else if (currentTab === 'Ceramah') detailObj = ceramahData[tgl];

            const btn = document.querySelector(`.sv-harian[data-t="${tgl}"]`);
            btn.disabled = true; btn.textContent = 'SEDANG MENGIRIM...';

            const record = { 
                ss_id: SCHOOL_ID, 
                nama: currentUser.nama, 
                kelas: currentUser.kelas, 
                kategori: currentTab, 
                tanggal: tgl, 
                hadir: JSON.stringify(detailObj),
                sheet: currentTab,
                tarawih_detail: currentTab === 'Tarawih' ? detailObj : undefined,
                puasa_detail: currentTab === 'Puasa' ? detailObj : undefined,
                tadarus_detail: currentTab === 'Tadarus' ? detailObj : undefined,
                ceramah_detail: currentTab === 'Ceramah' ? detailObj : undefined
            };

            // Update local allRecords
            allRecords = allRecords.filter(r => !(r.nama === record.nama && r.kategori === record.kategori && r.tanggal == record.tanggal));
            allRecords.push({ ...record, hadir: JSON.stringify(detailObj) });
            saveAllRecords();

            try {
                await fetch(GOOGLE_SCRIPT_URL, { 
                    method: 'POST', 
                    mode: 'no-cors',
                    body: JSON.stringify(record) 
                });
                showToast(`Data hari ke-${tgl} berhasil disimpan!`);
            } catch (e) { showToast("Gagal terhubung ke Cloud.", false); }
            finally { btn.disabled = false; btn.textContent = `💾 SIMPAN ${currentTab.toUpperCase()}`; }
        }

        function getCategoryIcon(k) { switch(k) { case 'Shalat Fardu': return '🕌'; case 'Tarawih': return '🌙'; case 'Puasa': return '🍽️'; case 'Tadarus': return '📖'; case 'Ceramah': return '🎙️'; default: return '📝'; } }
        function parseRecordData(d) { try { return typeof d === 'string' ? JSON.parse(d) : d; } catch (e) { return d; } }
        
        function renderDetailData(k, d) {
            d = parseRecordData(d);
            if (!d) return '-'; 
            if (k === 'Shalat Fardu') {
                if (typeof d !== 'object') return d;
                const orderedKeys = ['Subuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya'];
                const entries = orderedKeys.filter(key => d[key]).map(key => `${key}: <span class="font-bold text-emerald-600">${d[key]}</span>`);
                return entries.length ? entries.join(' | ') : '-';
            } else if (k === 'Tarawih') return `Status: <b>${d.status || '-'}</b>, Lokasi: <b>${d.tempat || '-'}</b>`;
            else if (k === 'Puasa') return `Status: <b>${typeof d === 'string' ? d : (d.status || '-')}</b>`;
            else if (k === 'Tadarus') return `Metode: <b>${d.pilihan || '-'}</b>, Surat: <b>${d.surat || '-'}</b> (${d.ayat || '-'})`;
            else if (k === 'Ceramah') return `Penceramah: <b>${d.penceramah || '-'}</b>, Lokasi: <b>${d.tempat || '-'}</b><br><span class="text-xs text-slate-500 italic">"${d.ringkasan || '-'}"</span>`;
            return JSON.stringify(d);
        }

        function getMergedRecords(records) {
            const map = new Map();
            records.forEach(r => {
                const key = `${r.nama}-${r.kelas}-${r.kategori}-${r.tanggal}`;
                map.set(key, r);
            });
            return Array.from(map.values());
        }

        function showRekapPage() {
            const myRaw = allRecords.filter(r => r.nama === currentUser.nama && r.kelas === currentUser.kelas);
            const my = getMergedRecords(myRaw);

            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-gray-50 p-4 md:p-8">
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h1 class="font-black text-3xl text-emerald-800 tracking-tighter">📊 Rekap Amalan Saya</h1>
                                <p class="text-gray-400 font-bold">Ringkasan aktivitas yang berhasil tercatat.</p>
                            </div>
                            <button id="backBtn" class="px-8 py-4 bg-emerald-600 text-white font-black rounded-2xl shadow-lg active:scale-95 uppercase text-sm tracking-widest">← Kembali</button>
                        </div>
                        <div class="space-y-6">
                            ${categories.map(cat => {
                                const items = my.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
                                return `
                                    <div class="bg-white rounded-[2rem] shadow-md border overflow-hidden">
                                        <div class="p-5 bg-emerald-50 border-b flex justify-between items-center">
                                            <span class="font-black text-emerald-800 uppercase text-xs tracking-widest">${getCategoryIcon(cat)} ${cat}</span>
                                            <span class="bg-white px-3 py-1 rounded-full text-[10px] font-black text-emerald-600 border border-emerald-100">${items.length} HARI</span>
                                        </div>
                                        <div class="divide-y">
                                            ${items.length ? items.map(r => `
                                                <div class="p-5 flex gap-4 text-sm items-start">
                                                    <div class="flex flex-col items-center justify-center min-w-[50px] bg-slate-50 p-2 rounded-xl border border-slate-100">
                                                        <span class="text-[9px] font-bold text-slate-400 uppercase">Hari</span>
                                                        <span class="font-black text-emerald-700 text-lg">${r.tanggal}</span>
                                                    </div>
                                                    <div class="flex-1 text-slate-700 leading-relaxed pt-1">
                                                        ${renderDetailData(cat, r.hadir)}
                                                    </div>
                                                </div>
                                            `).join('') : '<p class="p-10 text-center text-gray-400 font-bold italic">Belum ada data untuk kategori ini.</p>'}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            document.getElementById('backBtn').onclick = showAmalanPage;
        }

        async function fetchAllDataForAdmin() {
            if (!SCHOOL_ID) return;
            const loadingToast = showToast("Sinkronisasi Database Guru...", true);
            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'readAll');
                url.searchParams.append('ss_id', SCHOOL_ID);
                
                const res = await fetch(url, { redirect: 'follow' });
                const result = await res.json();
                
                if (result.status === 'success') {
                    // Normalize data structure
                    allRecords = result.data.map(item => ({
                        nama: item.nama,
                        kelas: item.kelas,
                        kategori: item.kategori,
                        tanggal: item.tanggal,
                        hadir: item.detail || item.hadir
                    }));
                    saveAllRecords();
                    showLaporanPage();
                    showToast("Database Sinkron!");
                } else {
                    showToast("Gagal sinkronisasi data.", false);
                }
            } catch (e) { 
                showToast("Gagal memuat data guru. Periksa ID Sekolah.", false); 
            }
        }

        function showLaporanPage() {
            const allMerged = getMergedRecords(allRecords);
            const allS = [...new Set(allMerged.map(r => JSON.stringify({nama: r.nama, kelas: r.kelas})))].map(s => JSON.parse(s)).sort((a,b) => a.nama.localeCompare(b.nama));
            
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-slate-100 p-4 md:p-6">
                    <div class="max-w-6xl mx-auto">
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <h1 class="font-black text-2xl text-slate-800 tracking-tighter flex items-center gap-2">📋 PANEL GURU <span class="text-[10px] bg-slate-100 px-3 py-1 rounded-full text-slate-400 font-bold uppercase tracking-widest">${SCHOOL_ID.substring(0,6)}...</span></h1>
                            <div class="flex gap-2">
                                <button id="syncBtn" class="px-5 py-3 bg-blue-600 text-white rounded-xl font-black text-xs uppercase tracking-wider">🔄 Refresh</button>
                                <button id="logoutBtn" class="px-5 py-3 bg-slate-800 text-white rounded-xl font-black text-xs uppercase tracking-wider">Keluar</button>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm mb-6 border border-slate-200">
                             <p class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Total Siswa Terdaftar: ${allS.length}</p>
                             <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${allS.length ? allS.map(s => `
                                    <div class="bg-gray-50 p-6 rounded-[2rem] border-2 border-transparent hover:border-emerald-500 hover:bg-white transition-all cursor-pointer group student-card" data-n="${s.nama}" data-k="${s.kelas}">
                                        <h3 class="font-black text-slate-800 uppercase tracking-tighter text-lg group-hover:text-emerald-700">${s.nama}</h3>
                                        <p class="font-bold text-emerald-600 text-xs">KELAS ${s.kelas}</p>
                                        <div class="mt-4 flex items-center justify-between">
                                            <span class="text-[10px] text-gray-400 uppercase font-bold tracking-widest italic">Lihat Detail</span>
                                            <span class="text-emerald-500 font-black">→</span>
                                        </div>
                                    </div>
                                `).join('') : '<div class="col-span-full py-10 text-center text-slate-400 font-bold">Belum ada data siswa masuk.</div>'}
                             </div>
                        </div>
                    </div>
                </div>`;
            
            document.querySelectorAll('.student-card').forEach(c => c.onclick = (e) => {
                const d = e.currentTarget.dataset;
                showStudentDetail({ nama: d.n, kelas: d.k });
            });
            document.getElementById('syncBtn').onclick = fetchAllDataForAdmin;
            document.getElementById('logoutBtn').onclick = handleLogout;
        }

        function showStudentDetail(s) {
            const dataRaw = allRecords.filter(r => r.nama === s.nama && r.kelas === s.kelas);
            const data = getMergedRecords(dataRaw);

            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-slate-50 p-6">
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 border-l-[12px] border-emerald-500">
                            <div>
                                <h2 class="font-black text-3xl text-slate-800 tracking-tighter">${s.nama}</h2>
                                <p class="font-bold text-emerald-600 uppercase text-xs tracking-widest">Detail Amalan Ramadhan • Kelas ${s.kelas}</p>
                            </div>
                            <button id="backAdmin" class="px-6 py-3 bg-slate-800 text-white rounded-xl font-black text-xs uppercase shadow-md">← Kembali</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${categories.map(cat => {
                                const recs = data.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
                                return `
                                    <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
                                        <h3 class="font-black border-b pb-3 mb-4 text-slate-700 flex items-center gap-2 uppercase text-xs tracking-widest">${getCategoryIcon(cat)} ${cat}</h3>
                                        <div class="space-y-3">
                                            ${recs.length ? recs.map(r => `
                                                <div class="text-xs p-4 bg-slate-50 rounded-2xl border border-slate-100 leading-relaxed">
                                                    <div class="font-black text-emerald-700 mb-1">HARI KE-${r.tanggal}</div>
                                                    <div>${renderDetailData(cat, r.hadir)}</div>
                                                </div>
                                            `).join('') : '<p class="text-[10px] text-gray-400 font-bold italic py-4">Belum ada catatan.</p>'}
                                        </div>
                                    </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            document.getElementById('backAdmin').onclick = showLaporanPage;
        }

        /**
         * INITIALIZATION
         */
        async function init() { 
            loadAllRecords(); 
            const saved = safeGetStorage('ramadhanUser'); 
            
            if (!SCHOOL_ID) {
                renderRegistration();
            } else {
                if (saved) { 
                    try { 
                        currentUser = JSON.parse(saved); 
                        loadUserState(); 
                        showAmalanPage(); 
                        if (!isAdmin()) setTimeout(syncUserFromCloud, 500); 
                    } catch (e) { showLoginPage(); } 
                } else { showLoginPage(); }
            }
        }

        init();
    </script>
 </body>
</html>
