<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amalan Ramadhan Multi-School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Error Handler Global
    window.onerror = function(msg, url, line, col, error) {
        const app = document.getElementById('app');
        if (app) {
            app.innerHTML = `
                <div style="padding: 20px; color: red; font-family: sans-serif; text-align: center;">
                    <h3>Terjadi Kesalahan Aplikasi</h3>
                    <p>${msg}</p>
                    <button onclick="localStorage.clear(); location.reload();" style="margin-top:10px; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        Reset & Reload Aplikasi
                    </button>
                </div>
            `;
        }
        return false;
    };
  </script>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .tab-button.active { border-bottom: 3px solid; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        
        .pulse-blue { animation: pulseBlue 2s infinite; }
        .pulse-green { animation: pulseGreen 2s infinite; }
        @keyframes pulseBlue {
          0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
          70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
          100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        @keyframes pulseGreen {
          0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
          70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
          100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
 </head>
 <body class="h-full bg-gray-50">
  <div id="app" class="w-full h-full overflow-auto"></div>
  <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7IjJZdiHITMGhSMSWWneT1E9qIWUOBwkuJv4krc4_IPk-pQYA1hgFXyNfMu9oKjr6Bw/exec';
        const INFO_DRIVE_URL = 'https://drive.google.com/drive/folders/1p_MFakH19ATtDCS7zxaZ89zIAV_t6czu?usp=drive_link';
        
        function getSchoolId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            if (!id && window.location.href.includes('id=')) {
                id = window.location.href.split('id=')[1].split('&')[0];
            }
            if (!id) id = sessionStorage.getItem('current_school_id');
            return id;
        }

        let SCHOOL_ID = getSchoolId();
        const defaultConfig = {
            app_title: "Amalan Ramadhan Siswa",
            welcome_message: "Selamat datang di aplikasi Amalan Ramadhan",
            background_color: "#10b981"
        };

        let currentUser = null;
        let currentTab = 'Shalat Fardu';
        let allRecords = [];
        let hasInfoFiles = false; 
        const categories = ['Shalat Fardu', 'Tarawih', 'Puasa', 'Tadarus', 'Ceramah'];

        let shalatData = {};
        let tarawihData = {};
        let puasaData = {};
        let tadarusData = {};
        let ceramahData = {};

        function initDefaultData() {
            for (let i = 1; i <= 30; i++) {
                shalatData[i] = { 'Subuh': null, 'Dzuhur': null, 'Ashar': null, 'Maghrib': null, 'Isya': null };
                tarawihData[i] = { status: null, tempat: null };
                puasaData[i] = null;
                tadarusData[i] = { pilihan: null, surat: '', ayat: '' };
                ceramahData[i] = { penceramah: '', tempat: '', ringkasan: '' };
            }
        }
        initDefaultData();

        function safeGetStorage(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function safeSetStorage(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
        function safeRemoveStorage(key) { try { localStorage.removeItem(key); } catch (e) {} }

        function loadAllRecords() {
            const saved = safeGetStorage('ramadhanAllRecords');
            if (saved) { try { allRecords = JSON.parse(saved); } catch(e) {} }
        }
        function saveAllRecords() { safeSetStorage('ramadhanAllRecords', JSON.stringify(allRecords)); }

        function getUserStateKey() {
            if (!currentUser) return null;
            return `ramadhanState_${currentUser.nama.replace(/\s+/g, '_')}_${currentUser.kelas}`;
        }

        function loadUserState() {
            const key = getUserStateKey();
            if (!key) return;
            const savedState = safeGetStorage(key);
            if (savedState) {
                try {
                    const state = JSON.parse(savedState);
                    if (state.shalatData) shalatData = state.shalatData;
                    if (state.tarawihData) tarawihData = state.tarawihData;
                    if (state.puasaData) puasaData = state.puasaData;
                    if (state.tadarusData) tadarusData = state.tadarusData;
                    if (state.ceramahData) ceramahData = state.ceramahData;
                } catch (e) { initDefaultData(); }
            } else { initDefaultData(); }
        }

        function saveUserState() {
            const key = getUserStateKey();
            if (!key || isAdmin()) return;
            safeSetStorage(key, JSON.stringify({ shalatData, tarawihData, puasaData, tadarusData, ceramahData }));
        }

        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `toast fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white z-[100] ${isSuccess ? 'bg-green-600' : 'bg-red-600'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showConfirmDialog(message, onConfirm, isDanger = false) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black bg-opacity-50 z-[70] flex items-center justify-center p-4';
            overlay.innerHTML = `
                <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full">
                    <div class="text-center">
                        <h3 class="text-lg font-bold mb-2">Konfirmasi</h3>
                        <p class="text-sm text-gray-500 mb-6">${message}</p>
                        <div class="flex gap-3 justify-center">
                            <button onclick="this.closest('.fixed').remove()" class="flex-1 px-4 py-2 bg-gray-100 rounded-lg">Batal</button>
                            <button id="modalConfirm" class="flex-1 px-4 py-2 text-white rounded-lg ${isDanger ? 'bg-red-600' : 'bg-blue-600'}">Ya</button>
                        </div>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            document.getElementById('modalConfirm').onclick = () => { overlay.remove(); onConfirm(); };
        }

        function handleLogout() {
            showConfirmDialog("Apakah Anda yakin ingin keluar?", () => {
                safeRemoveStorage('ramadhanUser');
                currentUser = null;
                showLoginPage();
            });
        }

        function isAdmin() { return currentUser && currentUser.nama === '*'; }

        // --- REGISTRASI SEKOLAH ---
        function renderRegistration() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-6 bg-emerald-600">
                    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-black text-slate-800">Daftar Sekolah</h1>
                            <p class="text-slate-400 text-sm mt-2">Daftarkan email guru untuk mengelola database ramadhan sekolah.</p>
                        </div>
                        <form id="regForm" class="space-y-4">
                            <input type="email" id="regEmail" placeholder="Email Guru" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                            <input type="text" id="regSchool" placeholder="Nama Sekolah" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 transition-all" required>
                            <button type="submit" id="regBtn" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-black shadow-lg">BUAT DATABASE</button>
                        </form>
                        <div id="regResult" class="mt-8 hidden p-6 bg-slate-900 rounded-3xl text-white">
                            <p class="text-[10px] font-bold text-emerald-400 uppercase mb-2">Link Siswa Anda:</p>
                            <textarea id="shareLink" class="w-full p-3 text-[11px] font-mono border rounded-xl bg-slate-800 border-slate-700 h-24 mb-3" readonly></textarea>
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <button onclick="downloadLink()" class="py-3 bg-blue-600 text-white rounded-xl font-bold pulse-blue text-xs">Unduh Link</button>
                                <button onclick="copyLink()" class="py-3 bg-emerald-600 text-white rounded-xl font-bold pulse-green text-xs">Salin Link</button>
                            </div>
                            <button onclick="location.reload()" class="w-full py-3 bg-slate-700 text-white rounded-xl font-bold">SELESAI</button>
                        </div>
                    </div>
                </div>`;

            document.getElementById('regForm').onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('regBtn');
                btn.disabled = true; btn.textContent = "Memproses...";
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ 
                        action: 'registerTeacher', 
                        email: document.getElementById('regEmail').value,
                        nama_sekolah: document.getElementById('regSchool').value 
                    })});
                    const data = await res.json();
                    if (data.ss_id) {
                        document.getElementById('regResult').classList.remove('hidden');
                        sessionStorage.setItem('current_school_id', data.ss_id);
                        document.getElementById('shareLink').value = window.location.href.split('?')[0] + '?id=' + data.ss_id;
                        btn.textContent = "Berhasil!";
                    }
                } catch (err) { btn.disabled = false; btn.textContent = "Coba Lagi"; showToast("Error koneksi", false); }
            };
        }

        window.copyLink = () => {
            const text = document.getElementById('shareLink').value;
            navigator.clipboard.writeText(text).then(() => showToast("Link disalin!"));
        };

        window.downloadLink = () => {
            const link = document.getElementById('shareLink').value;
            const textContent = `INFO AKSES APLIKASI RAMADHAN\n\nLINK SISWA: ${link}\n\nPANEL GURU: Nama Lengkap (*) -> Klik Masuk`;
            const blob = new Blob([textContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'akses_ramadhan.txt'; a.click();
            showToast("Informasi diunduh!");
        };

        // --- SINKRONISASI DATA ---
        async function syncUserFromCloud() {
            if (!currentUser || isAdmin() || !SCHOOL_ID) return;
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=read&ss_id=${SCHOOL_ID}&nama=${encodeURIComponent(currentUser.nama)}&kelas=${encodeURIComponent(currentUser.kelas)}`);
                const result = await response.json();
                if (result.status === 'success' && Array.isArray(result.data)) {
                    result.data.forEach(item => {
                        const tgl = item.tanggal;
                        const cat = item.kategori;
                        let detail = item.detail || item.hadir;
                        if (typeof detail === 'string') { try { detail = JSON.parse(detail); } catch(e) {} }
                        
                        if (cat === 'Shalat Fardu') shalatData[tgl] = { ...shalatData[tgl], ...detail };
                        else if (cat === 'Tarawih') tarawihData[tgl] = { ...tarawihData[tgl], ...detail };
                        else if (cat === 'Puasa') puasaData[tgl] = detail.status || detail;
                        else if (cat === 'Tadarus') tadarusData[tgl] = { ...tadarusData[tgl], ...detail };
                        else if (cat === 'Ceramah') ceramahData[tgl] = { ...ceramahData[tgl], ...detail };
                    });
                    saveUserState();
                    if (document.getElementById('contentArea')) renderContentArea();
                }
            } catch (e) {}
        }

        async function fetchAllDataForAdmin() {
            if (!SCHOOL_ID) return showToast("ID Sekolah tidak ditemukan.", false);
            const loader = document.createElement('div');
            loader.className = 'fixed inset-0 bg-black/50 z-[100] flex items-center justify-center text-white font-bold';
            loader.innerHTML = '🔄 Menyinkronkan Database...';
            document.body.appendChild(loader);
            
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=readAll&ss_id=${SCHOOL_ID}`);
                const result = await response.json();
                if (result.status === 'success' && Array.isArray(result.data)) {
                    allRecords = result.data;
                    saveAllRecords();
                    if (isAdmin()) showLaporanPage();
                    showToast("Sinkronisasi Berhasil!");
                }
            } catch (e) { showToast("Gagal mengambil data.", false); }
            finally { loader.remove(); }
        }

        // --- UI LOGIN & SISWA ---
        function showLoginPage() {
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full flex items-center justify-center p-4" style="background: #10b981;">
                    <div class="w-full max-w-md rounded-2xl shadow-2xl p-8 bg-white">
                        <h1 class="text-center font-bold text-3xl mb-2 text-emerald-700">Amalan Ramadhan</h1>
                        <p class="text-center text-sm mb-8 text-gray-500">Silakan masuk untuk mengisi amalan harian.</p>
                        <form id="loginForm" class="space-y-4">
                            <div><label class="block mb-1 font-semibold">Nama Lengkap Siswa</label><input type="text" id="nama" class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500"></div>
                            <div><label class="block mb-1 font-semibold">Kelas</label><select id="kelas" class="w-full px-4 py-2 border rounded-xl bg-white"><option value="">Pilih Kelas</option>${['7A','7B','7C','8A','8B','8C','9A','9B','9C'].map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>
                            <button type="submit" class="w-full py-3 rounded-xl text-white font-bold bg-emerald-600 hover:bg-emerald-700 transition-all shadow-lg">Masuk Sekarang</button>
                        </form>
                    </div>
                </div>`;
            document.getElementById('loginForm').onsubmit = (e) => {
                e.preventDefault();
                const n = document.getElementById('nama').value.trim();
                const k = document.getElementById('kelas').value;
                if (!n) return showToast("Isi nama anda!", false);
                currentUser = { nama: n, kelas: n === '*' ? '*' : k };
                safeSetStorage('ramadhanUser', JSON.stringify(currentUser));
                loadUserState();
                if (!isAdmin()) syncUserFromCloud();
                showAmalanPage();
            };
        }

        function showAmalanPage() {
            if (!currentUser) return showLoginPage();
            if (isAdmin()) return (showLaporanPage(), fetchAllDataForAdmin());
            
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-emerald-600">
                    <div class="max-w-4xl mx-auto p-4 md:p-6 pb-24">
                        <div class="rounded-2xl shadow-xl p-6 mb-6 bg-white">
                            <h1 class="font-bold text-2xl mb-4 text-emerald-800">Buku Amalan Digital</h1>
                            <div class="mb-6 bg-emerald-50 p-4 rounded-xl text-sm">
                                <p><strong>👤 Siswa:</strong> ${currentUser.nama}</p>
                                <p><strong>🏫 Kelas:</strong> ${currentUser.kelas}</p>
                            </div>
                            <div class="flex gap-2">
                                <button id="rekapBtn" class="flex-1 py-2 rounded-xl text-white bg-emerald-600 font-bold">📊 Rekap Saya</button>
                                <button onclick="handleLogout()" class="px-4 py-2 rounded-xl text-white bg-red-500 font-bold">Keluar</button>
                            </div>
                        </div>
                        <div class="rounded-xl shadow-lg mb-6 sticky top-0 z-40 bg-white border flex overflow-x-auto">
                            ${categories.map(cat => `<button class="tab-button flex-1 px-4 py-4 font-bold whitespace-nowrap text-sm ${currentTab === cat ? 'active text-emerald-600 border-emerald-600 bg-emerald-50' : 'text-gray-500'}" data-tab="${cat}">${cat}</button>`).join('')}
                        </div>
                        <div id="contentArea" class="rounded-2xl shadow-xl p-6 bg-white min-h-[500px]"></div>
                    </div>
                </div>`;
            document.querySelectorAll('.tab-button').forEach(btn => btn.onclick = (e) => { currentTab = e.target.dataset.tab; showAmalanPage(); });
            document.getElementById('rekapBtn').onclick = showRekapPage;
            renderContentArea();
        }

        function renderContentArea() {
            const area = document.getElementById('contentArea');
            const days = Array.from({length: 30}, (_, i) => i + 1);
            let html = `<h2 class="font-bold text-xl mb-6 border-b pb-2">Isi Data: ${currentTab}</h2><div class="space-y-6">`;
            
            days.forEach(t => {
                html += `<div class="p-5 border rounded-2xl shadow-sm border-l-8 ${getCategoryColor(currentTab)}">
                    <h3 class="font-bold mb-4">📅 Hari ke-${t}</h3>`;
                
                if (currentTab === 'Shalat Fardu') {
                    html += `<div class="space-y-4">
                        ${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(w => `
                            <div class="flex flex-col gap-2 pb-2 border-b border-gray-50 last:border-0">
                                <span class="font-bold text-gray-600">${w}</span>
                                <div class="flex flex-wrap gap-2">
                                    ${['berjamaah','munfarid','haid','tidak shalat'].map(s => `
                                        <button class="sh-btn px-3 py-1.5 text-xs rounded-full border ${shalatData[t]?.[w] === s ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-gray-50 text-gray-500'}" data-t="${t}" data-w="${w}" data-s="${s}">${s}</button>
                                    `).join('')}
                                </div>
                            </div>`).join('')}
                    </div>`;
                } else if (currentTab === 'Puasa') {
                    html += `<div class="flex flex-wrap gap-2">${['mengerjakan','tidak mengerjakan','sakit','haid'].map(s => `<button class="ps-btn px-4 py-2 text-xs border rounded-xl font-bold ${puasaData[t] === s ? 'bg-orange-500 text-white' : 'bg-gray-50'}" data-t="${t}" data-s="${s}">${s}</button>`).join('')}</div>`;
                } else if (currentTab === 'Tadarus') {
                    html += `<div class="grid grid-cols-2 gap-4">
                        <input type="text" placeholder="Nama Surat" class="td-s w-full p-2 border rounded-lg text-sm" data-t="${t}" value="${tadarusData[t]?.surat || ''}">
                        <input type="text" placeholder="Ayat" class="td-a w-full p-2 border rounded-lg text-sm" data-t="${t}" value="${tadarusData[t]?.ayat || ''}">
                    </div>`;
                } else if (currentTab === 'Tarawih') {
                    html += `<div class="flex flex-wrap gap-2 mb-3">${['berjamaah','munfarid','tidak','sakit'].map(s => `<button class="tr-s px-3 py-1.5 text-xs border rounded-lg ${tarawihData[t]?.status === s ? 'bg-indigo-600 text-white' : 'bg-gray-50'}" data-t="${t}" data-s="${s}">${s}</button>`).join('')}</div>
                             <input type="text" placeholder="Tempat (Mesjid/Rumah)" class="tr-t w-full p-2 border rounded-lg text-sm" data-t="${t}" value="${tarawihData[t]?.tempat || ''}">`;
                } else if (currentTab === 'Ceramah') {
                    html += `<input type="text" placeholder="Penceramah" class="cr-p w-full p-2 border rounded-lg text-sm mb-2" data-t="${t}" value="${ceramahData[t]?.penceramah || ''}">
                             <textarea placeholder="Ringkasan..." class="cr-r w-full p-2 border rounded-lg text-sm" data-t="${t}">${ceramahData[t]?.ringkasan || ''}</textarea>`;
                }
                
                html += `<button class="sv-btn mt-4 w-full py-2 bg-slate-800 text-white rounded-xl text-sm font-bold" data-t="${t}">💾 SIMPAN HARI KE-${t}</button></div>`;
            });
            area.innerHTML = html + `</div>`;

            // Event Listeners
            area.querySelectorAll('.sh-btn').forEach(b => b.onclick = (e) => { const d = e.target.dataset; shalatData[d.t][d.w] = d.s; saveUserState(); renderContentArea(); });
            area.querySelectorAll('.ps-btn').forEach(b => b.onclick = (e) => { puasaData[e.target.dataset.t] = e.target.dataset.s; saveUserState(); renderContentArea(); });
            area.querySelectorAll('.td-s').forEach(i => i.oninput = (e) => { tadarusData[e.target.dataset.t].surat = e.target.value; saveUserState(); });
            area.querySelectorAll('.td-a').forEach(i => i.oninput = (e) => { tadarusData[e.target.dataset.t].ayat = e.target.value; saveUserState(); });
            area.querySelectorAll('.tr-s').forEach(b => b.onclick = (e) => { tarawihData[e.target.dataset.t].status = e.target.dataset.s; saveUserState(); renderContentArea(); });
            area.querySelectorAll('.tr-t').forEach(i => i.oninput = (e) => { tarawihData[e.target.dataset.t].tempat = e.target.value; saveUserState(); });
            area.querySelectorAll('.cr-p').forEach(i => i.oninput = (e) => { ceramahData[e.target.dataset.t].penceramah = e.target.value; saveUserState(); });
            area.querySelectorAll('.cr-r').forEach(i => i.oninput = (e) => { ceramahData[e.target.dataset.t].ringkasan = e.target.value; saveUserState(); });
            area.querySelectorAll('.sv-btn').forEach(b => b.onclick = (e) => handleSimpan(e.target.dataset.t));
        }

        async function handleSimpan(tgl) {
            const btn = document.querySelector(`.sv-btn[data-t="${tgl}"]`);
            btn.disabled = true; btn.textContent = "⏳ Mengirim...";
            
            let detail = "";
            if (currentTab === 'Shalat Fardu') detail = JSON.stringify(shalatData[tgl]);
            else if (currentTab === 'Tarawih') detail = JSON.stringify(tarawihData[tgl]);
            else if (currentTab === 'Puasa') detail = JSON.stringify(puasaData[tgl]);
            else if (currentTab === 'Tadarus') detail = JSON.stringify(tadarusData[tgl]);
            else if (currentTab === 'Ceramah') detail = JSON.stringify(ceramahData[tgl]);

            const payload = { ss_id: SCHOOL_ID, nama: currentUser.nama, kelas: currentUser.kelas, kategori: currentTab, tanggal: tgl, hadir: detail };
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                showToast("Berhasil disimpan ke cloud!");
            } catch (e) { showToast("Gagal kirim data.", false); }
            finally { btn.disabled = false; btn.textContent = `💾 SIMPAN HARI KE-${tgl}`; }
        }

        function getCategoryColor(c) {
            switch(c) {
                case 'Shalat Fardu': return 'border-emerald-500';
                case 'Tarawih': return 'border-indigo-500';
                case 'Puasa': return 'border-orange-500';
                case 'Tadarus': return 'border-blue-500';
                case 'Ceramah': return 'border-rose-500';
                default: return 'border-gray-500';
            }
        }

        // --- PANEL GURU (DIPERBAIKI) ---
        function showLaporanPage() {
            const students = [...new Set(allRecords.map(r => JSON.stringify({nama: r.nama, kelas: r.kelas})))].map(s => JSON.parse(s));
            const totalRecords = allRecords.length;
            const activeToday = allRecords.filter(r => r.tanggal == new Date().getDate()).length;

            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-slate-100 p-4 md:p-6">
                    <div class="max-w-6xl mx-auto">
                        <!-- Header & Stats -->
                        <div class="bg-white p-6 rounded-3xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h1 class="font-black text-3xl text-slate-800">📋 Panel Guru</h1>
                                <p class="text-slate-500">Manajemen & Rekapitulasi Amalan Ramadhan</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="fetchAllDataForAdmin()" class="px-4 py-2 bg-blue-600 text-white rounded-xl font-bold">🔄 Refresh Data</button>
                                <button onclick="handleLogout()" class="px-4 py-2 bg-slate-800 text-white rounded-xl font-bold">Logout</button>
                            </div>
                        </div>

                        <!-- Stats Dashboard -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div class="bg-emerald-600 p-6 rounded-3xl text-white shadow-lg">
                                <p class="text-emerald-100 text-sm font-bold uppercase tracking-wider">Total Siswa</p>
                                <p class="text-4xl font-black mt-2">${students.length}</p>
                            </div>
                            <div class="bg-indigo-600 p-6 rounded-3xl text-white shadow-lg">
                                <p class="text-indigo-100 text-sm font-bold uppercase tracking-wider">Total Catatan Amalan</p>
                                <p class="text-4xl font-black mt-2">${totalRecords}</p>
                            </div>
                            <div class="bg-amber-500 p-6 rounded-3xl text-white shadow-lg">
                                <p class="text-amber-100 text-sm font-bold uppercase tracking-wider">Input Hari Ini</p>
                                <p class="text-4xl font-black mt-2">${activeToday}</p>
                            </div>
                        </div>

                        <!-- Filter -->
                        <div class="bg-white p-6 rounded-3xl shadow-md mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input type="text" id="searchN" placeholder="Cari nama siswa..." class="p-3 border rounded-2xl bg-slate-50 outline-none focus:ring-2 focus:ring-emerald-500">
                            <select id="filterK" class="p-3 border rounded-2xl bg-slate-50 outline-none">
                                <option value="all">Semua Kelas</option>
                                ${['7A','7B','7C','8A','8B','8C','9A','9B','9C'].map(c => `<option value="${c}">${c}</option>`).join('')}
                            </select>
                            <button onclick="handleCetakGlobal('Semua', 'Semua')" class="bg-emerald-600 text-white font-bold rounded-2xl py-3 shadow-lg">🖨️ Cetak Rekapitulasi</button>
                        </div>

                        <!-- Student Grid -->
                        <div id="studentListGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    </div>
                </div>`;

            const renderStudents = () => {
                const search = document.getElementById('searchN').value.toLowerCase();
                const filter = document.getElementById('filterK').value;
                const filtered = students.filter(s => {
                    const matchN = s.nama.toLowerCase().includes(search);
                    const matchK = filter === 'all' || s.kelas === filter;
                    return matchN && matchK;
                });

                document.getElementById('studentListGrid').innerHTML = filtered.map(s => {
                    const count = allRecords.filter(r => r.nama === s.nama && r.kelas === s.kelas).length;
                    return `
                        <div onclick='showStudentDetail(${JSON.stringify(s)})' class="bg-white p-5 rounded-3xl border border-transparent hover:border-emerald-500 hover:shadow-xl cursor-pointer transition-all">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center font-black text-xl">${s.nama.charAt(0)}</div>
                                <div>
                                    <h3 class="font-bold text-slate-800">${s.nama}</h3>
                                    <p class="text-xs font-bold text-emerald-600 uppercase tracking-tighter">Kelas ${s.kelas}</p>
                                </div>
                            </div>
                            <div class="mt-4 pt-4 border-t border-slate-50 flex justify-between items-center">
                                <span class="text-xs text-slate-400 font-bold uppercase">Progres Data</span>
                                <span class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-[10px] font-black">${count} Input</span>
                            </div>
                        </div>`;
                }).join('');
            };

            document.getElementById('searchN').oninput = renderStudents;
            document.getElementById('filterK').onchange = renderStudents;
            renderStudents();
        }

        function showStudentDetail(s) {
            const myRecords = allRecords.filter(r => r.nama === s.nama && r.kelas === s.kelas);
            
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-slate-50 p-4 md:p-8">
                    <div class="max-w-5xl mx-auto">
                        <div class="bg-white p-8 rounded-3xl shadow-xl mb-6">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                <div>
                                    <h2 class="text-3xl font-black text-slate-800">${s.nama}</h2>
                                    <p class="text-emerald-600 font-bold tracking-widest uppercase text-sm">Rekap Amalan Lengkap - Kelas ${s.kelas}</p>
                                </div>
                                <div class="flex gap-2 w-full md:w-auto">
                                    <button onclick="handleCetakLaporanIndividual(${JSON.stringify(s)}, ${JSON.stringify(myRecords)})" class="flex-1 md:flex-none px-6 py-3 bg-emerald-600 text-white font-bold rounded-2xl shadow-lg">Cetak Laporan</button>
                                    <button onclick="showLaporanPage()" class="flex-1 md:flex-none px-6 py-3 bg-slate-800 text-white font-bold rounded-2xl">Kembali</button>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-12">
                            ${categories.map(cat => {
                                const items = myRecords.filter(r => r.kategori === cat).sort((a,b) => a.tanggal - b.tanggal);
                                return `
                                    <div class="bg-white rounded-3xl shadow-sm border overflow-hidden">
                                        <div class="bg-slate-800 p-4 text-white flex justify-between items-center">
                                            <h3 class="font-black uppercase tracking-widest text-sm">${getCategoryIcon(cat)} ${cat}</h3>
                                            <span class="text-xs bg-slate-700 px-3 py-1 rounded-full">${items.length} Hari Terisi</span>
                                        </div>
                                        <div class="overflow-x-auto">
                                            <table class="w-full text-left text-sm">
                                                <thead class="bg-slate-50 border-b text-slate-400 font-bold uppercase text-[10px]">
                                                    <tr>
                                                        <th class="p-4 w-20">Hari Ke</th>
                                                        <th class="p-4">Rincian Amalan</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-slate-50">
                                                    ${items.length ? items.map(r => `
                                                        <tr>
                                                            <td class="p-4 font-black text-slate-300">#${r.tanggal}</td>
                                                            <td class="p-4">${renderDetailData(cat, r.hadir)}</td>
                                                        </tr>
                                                    `).join('') : `<tr><td colspan="2" class="p-8 text-center text-slate-400 italic font-medium">Belum ada data untuk kategori ini</td></tr>`}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
        }

        // --- RENDER DETAIL DATA (UNTUK TABEL & CETAK) ---
        function renderDetailData(k, d) {
            try { d = typeof d === 'string' ? JSON.parse(d) : d; } catch(e) {}
            if (!d) return '-';
            
            if (k === 'Shalat Fardu') {
                const keys = ['Subuh','Dzuhur','Ashar','Maghrib','Isya'];
                return `<div class="flex flex-wrap gap-2">
                    ${keys.map(key => {
                        const val = d[key] || 'Belum';
                        const color = val === 'berjamaah' ? 'bg-emerald-100 text-emerald-700' : 
                                      val === 'tidak shalat' ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-500';
                        return `<span class="px-2 py-1 rounded-lg ${color} text-[10px] font-bold uppercase border border-black/5">${key}: ${val}</span>`;
                    }).join('')}
                </div>`;
            } else if (k === 'Puasa') {
                const color = d === 'mengerjakan' ? 'text-orange-600 font-black' : 'text-slate-400';
                return `<span class="${color} uppercase text-xs">Status: ${d}</span>`;
            } else if (k === 'Tadarus') {
                return `📖 Surat <b>${d.surat || '-'}</b> (Ayat: ${d.ayat || '-'})`;
            } else if (k === 'Tarawih') {
                return `🌙 Status: <b>${d.status || '-'}</b> @ ${d.tempat || '-'}`;
            } else if (k === 'Ceramah') {
                return `🎙️ <b>${d.penceramah || '-'}</b><br><p class="text-[11px] text-slate-500 italic mt-1 leading-relaxed">"${d.ringkasan || '-'}"</p>`;
            }
            return JSON.stringify(d);
        }

        function getCategoryIcon(k) { switch(k) { case 'Shalat Fardu': return '🕌'; case 'Tarawih': return '🌙'; case 'Puasa': return '🍽️'; case 'Tadarus': return '📖'; case 'Ceramah': return '🎙️'; default: return '📝'; } }

        function showRekapPage() { showAmalanPage(); showToast("Fitur rekap dialihkan ke profil utama.", true); }

        function handleCetakGlobal() { window.print(); }

        function handleCetakLaporanIndividual(s, data) { window.print(); }

        async function init() { 
            loadAllRecords(); 
            if (SCHOOL_ID) {
                if (safeGetStorage('ramadhanUser')) {
                    currentUser = JSON.parse(safeGetStorage('ramadhanUser'));
                    loadUserState();
                    showAmalanPage();
                } else {
                    showLoginPage();
                }
            } else {
                renderRegistration();
            }
        }

        init();
  </script>
 </body>
</html>
