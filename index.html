<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amalan Ramadhan Multi-School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.onerror = function(msg, url, line, col, error) {
        const app = document.getElementById('app');
        if (app) {
            app.innerHTML = `
                <div style="padding: 20px; color: red; font-family: sans-serif; text-align: center;">
                    <h3>Terjadi Kesalahan Aplikasi</h3>
                    <p>${msg}</p>
                    <button onclick="localStorage.clear(); location.reload();" style="margin-top:10px; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        Reset & Reload Aplikasi
                    </button>
                </div>
            `;
        }
        return false;
    };
  </script>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .tab-button.active { border-bottom: 3px solid; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes pulseBlue {
          0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
          70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
          100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        @keyframes pulseGreen {
          0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
          70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
          100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .pulse-blue { animation: pulseBlue 2s infinite; }
        .pulse-green { animation: pulseGreen 2s infinite; }
    </style>
 </head>
 <body class="h-full bg-gray-50">
  <div id="app" class="w-full h-full"></div>
  <script>
        /**
         * KONFIGURASI MULTI-SCHOOL
         */
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7IjJZdiHITMGhSMSWWneT1E9qIWUOBwkuJv4krc4_IPk-pQYA1hgFXyNfMu9oKjr6Bw/exec';
        
        function getSchoolId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            if (!id && window.location.href.includes('id=')) {
                id = window.location.href.split('id=')[1].split('&')[0];
            }
            return id || sessionStorage.getItem('current_school_id');
        }

        let SCHOOL_ID = getSchoolId();
        const defaultConfig = {
            app_title: "Amalan Ramadhan Siswa",
            welcome_message: "Selamat datang di aplikasi Amalan Ramadhan",
            background_color: "#10b981"
        };

        let currentUser = null;
        let currentTab = 'Shalat Fardu';
        let allRecords = [];
        const categories = ['Shalat Fardu', 'Tarawih', 'Puasa', 'Tadarus', 'Ceramah'];

        let shalatData = {};
        let tarawihData = {};
        let puasaData = {};
        let tadarusData = {};
        let ceramahData = {};

        function initDefaultData() {
            for (let i = 1; i <= 30; i++) {
                shalatData[i] = { 'Subuh': null, 'Dzuhur': null, 'Ashar': null, 'Maghrib': null, 'Isya': null };
                tarawihData[i] = { status: null, tempat: null };
                puasaData[i] = null;
                tadarusData[i] = { pilihan: null, surat: '', ayat: '' };
                ceramahData[i] = { penceramah: '', tempat: '', ringkasan: '' };
            }
        }
        initDefaultData();

        const safeGetStorage = (k) => localStorage.getItem(k);
        const safeSetStorage = (k, v) => localStorage.setItem(k, v);
        const safeRemoveStorage = (k) => localStorage.removeItem(k);

        function saveAllRecords() { safeSetStorage('ramadhanAllRecords', JSON.stringify(allRecords)); }
        function loadAllRecords() {
            const saved = safeGetStorage('ramadhanAllRecords');
            if (saved) { try { allRecords = JSON.parse(saved); } catch(e) { allRecords = []; } }
        }

        function getUserStateKey() {
            return currentUser ? `ramadhanState_${SCHOOL_ID}_${currentUser.nama.replace(/\s+/g, '_')}_${currentUser.kelas}` : null;
        }

        function loadUserState() {
            const key = getUserStateKey();
            if (!key) return;
            const saved = safeGetStorage(key);
            if (saved) {
                try {
                    const s = JSON.parse(saved);
                    if (s.shalatData) shalatData = s.shalatData;
                    if (s.tarawihData) tarawihData = s.tarawihData;
                    if (s.puasaData) puasaData = s.puasaData;
                    if (s.tadarusData) tadarusData = s.tadarusData;
                    if (s.ceramahData) ceramahData = s.ceramahData;
                } catch(e) { initDefaultData(); }
            } else { initDefaultData(); }
        }

        function saveUserState() {
            const key = getUserStateKey();
            if (key && !isAdmin()) {
                safeSetStorage(key, JSON.stringify({ shalatData, tarawihData, puasaData, tadarusData, ceramahData }));
            }
        }

        function showToast(msg, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `toast fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white z-[100] ${isSuccess ? 'bg-green-600' : 'bg-red-600'}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function isAdmin() { return currentUser && currentUser.nama === '*'; }

        function parseRecordData(d) {
            if (!d) return null;
            if (typeof d === 'object') return d;
            if (typeof d === 'string' && (d.startsWith('{') || d.startsWith('['))) {
                try { return JSON.parse(d); } catch(e) { return d; }
            }
            return d;
        }

        function getMergedRecords(records) {
            const map = new Map();
            records.forEach(r => {
                const key = `${r.nama}-${r.kelas}-${r.kategori}-${r.tanggal}`;
                const incomingData = parseRecordData(r.hadir);
                
                if (map.has(key)) {
                    let existing = map.get(key);
                    if (r.kategori === 'Shalat Fardu') {
                        let existingData = parseRecordData(existing.hadir) || {};
                        if (typeof existingData !== 'object' || existingData === null) existingData = { 'Status': existingData };
                        if (typeof incomingData === 'object' && incomingData !== null) {
                            Object.assign(existingData, incomingData);
                        } else {
                            existingData['Info'] = incomingData;
                        }
                        existing.hadir = JSON.stringify(existingData);
                    } else {
                        map.set(key, { ...r });
                    }
                } else {
                    const recordToSet = { ...r };
                    if (typeof incomingData === 'object' && incomingData !== null) {
                        recordToSet.hadir = JSON.stringify(incomingData);
                    }
                    map.set(key, recordToSet);
                }
            });
            return Array.from(map.values());
        }

        async function syncUserFromCloud() {
            if (!currentUser || isAdmin() || !SCHOOL_ID) return;
            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'read');
                url.searchParams.append('ss_id', SCHOOL_ID);
                url.searchParams.append('nama', currentUser.nama);
                url.searchParams.append('kelas', currentUser.kelas);
                
                const res = await fetch(url);
                const result = await res.json();
                
                if (result.status === 'success' && Array.isArray(result.data)) {
                    const serverRecords = result.data.map(item => ({
                        nama: currentUser.nama,
                        kelas: currentUser.kelas,
                        kategori: item.kategori,
                        tanggal: item.tanggal,
                        hadir: item.detail || item.hadir
                    }));

                    allRecords = getMergedRecords([...allRecords, ...serverRecords]);
                    
                    allRecords.forEach(r => {
                        if (r.nama === currentUser.nama) {
                            const tgl = r.tanggal;
                            const data = parseRecordData(r.hadir);
                            if (r.kategori === 'Shalat Fardu' && typeof data === 'object' && data !== null) {
                                shalatData[tgl] = { ...shalatData[tgl], ...data };
                            } else if (r.kategori === 'Tarawih') {
                                if (typeof data === 'object' && data !== null) tarawihData[tgl] = { ...tarawihData[tgl], ...data };
                            } else if (r.kategori === 'Puasa') {
                                puasaData[tgl] = (typeof data === 'object' && data !== null ? data.status : data);
                            }
                        }
                    });
                    
                    saveAllRecords();
                    saveUserState();
                    if (document.getElementById('contentArea')) renderContentArea();
                }
            } catch (e) { console.error("Sync Error:", e); }
        }

        function getCategoryIconEmoji(k) { switch(k) { case 'Shalat Fardu': return '🕌'; case 'Tarawih': return '🌙'; case 'Puasa': return '🍽️'; case 'Tadarus': return '📖'; case 'Ceramah': return '🎙️'; default: return '📝'; } }

        function renderDetailData(k, d) {
            d = parseRecordData(d);
            if (!d) return '-';
            if (k === 'Shalat Fardu') {
                if (typeof d !== 'object' || d === null) return `<b>${d}</b>`;
                const ordered = ['Subuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya'];
                const text = ordered
                    .filter(key => d[key])
                    .map(key => `<span class="mr-2"><b>${key}:</b> ${d[key]}</span>`)
                    .join(' ');
                return text || '-';
            }
            if (k === 'Tarawih') return d.status ? `<b>${d.status}</b> di ${d.tempat || '-'}` : '-';
            if (k === 'Puasa') return typeof d === 'string' ? `<b>${d}</b>` : `<b>${d.status || '-'}</b>`;
            if (k === 'Tadarus') return `Surat <b>${d.surat || '-'}</b> (${d.ayat || '-'})`;
            if (k === 'Ceramah') return `Penceramah: <b>${d.penceramah || '-'}</b> <br> <span class="text-xs italic">${d.ringkasan || '-'}</span>`;
            return typeof d === 'object' ? JSON.stringify(d) : d;
        }

        /**
         * SISTEM REGISTRASI SEKOLAH (THE MISSING FUNCTION)
         */
        function renderRegistration() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-6 bg-emerald-600">
                    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-black text-slate-800">Daftar Sekolah</h1>
                            <p class="text-slate-400 text-sm mt-2">Buat sistem amalan ramadhan khusus sekolah Anda.</p>
                        </div>
                        <form id="regForm" class="space-y-4">
                            <input type="email" id="regEmail" placeholder="Gmail Guru" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 font-bold transition-all" required>
                            <input type="text" id="regSchool" placeholder="Nama Sekolah" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 font-bold transition-all" required>
                            <button type="submit" id="regBtn" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-black shadow-lg">DAFTAR SEKARANG</button>
                        </form>
                        <div id="regResult" class="mt-8 hidden p-6 bg-slate-900 rounded-3xl text-white">
                            <p class="text-[10px] font-bold text-emerald-400 uppercase mb-2">Link Siswa Anda:</p>
                            <textarea id="shareLink" class="w-full p-3 text-[11px] font-mono border rounded-xl bg-slate-800 border-slate-700 h-24 mb-3" readonly></textarea>
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <button onclick="downloadLink()" class="py-3 bg-blue-600 text-white rounded-xl font-bold pulse-blue shadow-lg text-xs">Unduh Instruksi</button>
                                <button onclick="copyLink()" class="py-3 bg-emerald-600 text-white rounded-xl font-bold pulse-green shadow-lg text-xs">Salin Link</button>
                            </div>
                            <button onclick="location.reload()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold shadow-lg">MASUK APLIKASI</button>
                        </div>
                    </div>
                </div>`;

            document.getElementById('regForm').onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('regBtn');
                const email = document.getElementById('regEmail').value;
                const school = document.getElementById('regSchool').value;
                
                btn.disabled = true; btn.textContent = "Menyiapkan Spreadsheet...";
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, { 
                        method: 'POST', 
                        body: JSON.stringify({ action: 'registerTeacher', email, nama_sekolah: school })
                    });
                    const data = await res.json();
                    if (data.ss_id) {
                        document.getElementById('regResult').classList.remove('hidden');
                        sessionStorage.setItem('current_school_id', data.ss_id);
                        document.getElementById('shareLink').value = window.location.href.split('?')[0] + '?id=' + data.ss_id;
                        btn.textContent = "Berhasil!";
                        showToast("Sekolah Berhasil Didaftarkan!");
                    }
                } catch (err) { 
                    btn.disabled = false; btn.textContent = "Coba Lagi"; 
                    showToast("Gagal mendaftar. Hubungi Admin.", false);
                }
            };
        }

        window.copyLink = () => {
            const text = document.getElementById('shareLink').value;
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast("Link disalin!");
        };

        window.downloadLink = () => {
            const link = document.getElementById('shareLink').value;
            const textContent = `INFO AKSES APLIKASI AMALAN RAMADHAN\n-----------------------------------------\nLINK UNTUK SISWA :\n${link}\n\nCARA MASUK PANEL GURU :\n-----------------------------------------\n1. Buka link di atas.\n2. Nama Lengkap: * (tanda bintang)\n3. Pilih kelas apa saja.\n4. Klik Masuk.\n\nSelamat beribadah!`;
            const blob = new Blob([textContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'instruksi_guru_ramadhan.txt'; a.click();
            showToast("Instruksi diunduh!");
        };

        /**
         * LOGIN & AMALAN UI
         */
        function showLoginPage() {
            const config = defaultConfig;
            let classOptions = `<option value="">Pilih Kelas</option>`;
            ['7','8','9'].forEach(g => {
                classOptions += `<optgroup label="Kelas ${g}">`;
                ['A','B','C','D','E','F','G','H','I','J'].forEach(s => {
                    classOptions += `<option value="${g}${s}">${g}${s}</option>`;
                });
                classOptions += `</optgroup>`;
            });

            document.getElementById('app').innerHTML = `
                <div class="w-full h-full flex items-center justify-center p-4" style="background: ${config.background_color};">
                    <div class="w-full max-w-md rounded-[2.5rem] shadow-2xl p-10 bg-white">
                        <h1 class="text-center font-black text-3xl mb-2 text-emerald-700 leading-tight">Amalan<br>Ramadhan</h1>
                        <p class="text-center text-sm mb-8 text-gray-400 font-bold uppercase tracking-widest">${config.welcome_message}</p>
                        <form id="loginForm" class="space-y-4">
                            <input type="text" id="nama" placeholder="Nama Lengkap Siswa" class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 font-bold transition-all">
                            <select id="kelas" class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-2xl outline-none focus:border-emerald-500 font-bold transition-all">${classOptions}</select>
                            <button type="submit" class="w-full py-5 rounded-2xl text-white font-black bg-emerald-600 hover:bg-emerald-700 shadow-lg active:scale-95 transition-all uppercase tracking-widest">Masuk</button>
                        </form>
                    </div>
                </div>`;

            document.getElementById('loginForm').onsubmit = (e) => {
                e.preventDefault();
                const nama = document.getElementById('nama').value.trim();
                const kelas = document.getElementById('kelas').value;
                if (nama === '*') {
                    currentUser = { nama: '*', kelas: '*', password: '*' };
                } else if (!nama || !kelas) {
                    return showToast("Lengkapi Nama dan Kelas!", false);
                } else {
                    currentUser = { nama, kelas };
                }
                safeSetStorage('ramadhanUser', JSON.stringify(currentUser));
                loadUserState();
                syncUserFromCloud();
                showAmalanPage();
            };
        }

        function showAmalanPage() {
            if (!currentUser) return showLoginPage();
            if (isAdmin()) return (showLaporanPage(), fetchAllDataForAdmin());

            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-gray-50">
                    <div class="max-w-4xl mx-auto p-4 md:p-8 pb-24">
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl mb-6 border-b-8 border-emerald-500">
                            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                                <div class="text-center md:text-left">
                                    <p class="text-[10px] font-black text-emerald-400 uppercase tracking-[0.3em] mb-1">PESERTA AKTIF</p>
                                    <h1 class="font-black text-3xl text-gray-800 leading-none">${currentUser.nama.toUpperCase()}</h1>
                                    <p class="font-bold text-emerald-600 mt-2">KELAS ${currentUser.kelas}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button id="rekapBtn" class="px-6 py-3 bg-emerald-100 text-emerald-700 rounded-xl font-black text-xs uppercase tracking-widest">📊 Rekap</button>
                                    <button id="logoutBtn" class="px-6 py-3 bg-gray-100 text-gray-500 rounded-xl font-black text-xs uppercase tracking-widest">Keluar</button>
                                </div>
                            </div>
                        </div>

                        <div class="rounded-2xl shadow-lg mb-8 sticky top-4 z-40 bg-white border border-gray-100 overflow-hidden">
                            <div class="flex overflow-x-auto no-scrollbar">
                                ${categories.map(cat => `<button class="tab-button flex-1 px-5 py-5 font-black whitespace-nowrap text-xs uppercase tracking-widest ${currentTab === cat ? 'active text-emerald-600 border-b-4 border-emerald-600 bg-emerald-50/50' : 'text-gray-400'}" data-tab="${cat}">${cat}</button>`).join('')}
                            </div>
                        </div>

                        <div id="contentArea" class="min-h-[500px]"></div>
                    </div>
                </div>`;

            document.querySelectorAll('.tab-button').forEach(btn => btn.onclick = (e) => { 
                currentTab = e.target.dataset.tab; 
                showAmalanPage(); 
            });
            document.getElementById('rekapBtn').onclick = showRekapPage;
            document.getElementById('logoutBtn').onclick = handleLogout;
            renderContentArea();
        }

        function renderContentArea() {
            const area = document.getElementById('contentArea');
            const days = Array.from({length: 30}, (_, i) => i + 1);
            
            if (currentTab === 'Shalat Fardu') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `
                    <div class="p-8 border-2 border-white rounded-[2.5rem] bg-white shadow-xl">
                        <h3 class="font-black text-gray-800 mb-6 flex justify-between items-center text-xl">📅 HARI KE-${t}</h3>
                        <div class="space-y-8">
                            ${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(w => `
                                <div class="pb-6 border-b border-gray-50 last:border-0">
                                    <p class="font-black text-gray-400 text-[11px] uppercase tracking-widest mb-4 flex items-center gap-2">SHALAT ${w}</p>
                                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
                                        ${['berjamaah','munfarid','haid','tidak shalat'].map(s => `
                                            <button class="sh-btn px-2 py-4 text-[10px] rounded-2xl border-2 font-black transition-all ${shalatData[t]?.[w] === s ? 'bg-emerald-600 text-white border-emerald-600 shadow-md scale-[1.02]' : 'bg-gray-50 text-gray-400 border-transparent hover:border-emerald-200'}" data-t="${t}" data-w="${w}" data-s="${s}">${s.toUpperCase()}</button>
                                        `).join('')}
                                    </div>
                                    <button class="sv-wkt-btn w-full py-4 text-xs rounded-2xl bg-blue-600 text-white font-black shadow-lg hover:bg-blue-700 active:scale-95 transition-all" data-t="${t}" data-w="${w}">💾 SIMPAN ${w.toUpperCase()}</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>`).join('')}</div>`;
                area.querySelectorAll('.sh-btn').forEach(b => b.onclick = (e) => { 
                    const d = e.target.dataset; 
                    shalatData[d.t][d.w] = d.s; 
                    saveUserState(); 
                    renderContentArea(); 
                });
                area.querySelectorAll('.sv-wkt-btn').forEach(b => b.onclick = (e) => handleSimpanPerWaktu(e.target.dataset.t, e.target.dataset.w));
                
            } else if (currentTab === 'Tarawih') {
                area.innerHTML = `<div class="space-y-6">${days.map(t => `<div class="p-8 border-2 border-white rounded-[2.5rem] bg-white shadow-xl"><h3 class="font-black text-indigo-900 mb-6 text-xl">📅 HARI KE-${t}</h3><div class="mb-6"><p class="text-[10px] font-black text-gray-400 mb-3 uppercase tracking-widest">STATUS</p><div class="grid grid-cols-2 md:grid-cols-5 gap-2">${['berjamaah','munfarid','tidak mengerjakan','sakit','haid'].map(s => `<button class="tr-s px-1 py-4 text-[9px] border-2 rounded-2xl font-black ${tarawihData[t]?.status === s ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-gray-50 border-transparent text-gray-400'}" data-t="${t}" data-s="${s}">${s.toUpperCase()}</button>`).join('')}</div></div><div class="mb-8"><p class="text-[10px] font-black text-gray-400 mb-3 uppercase tracking-widest">LOKASI</p><div class="grid grid-cols-2 gap-2">${['mesjid','rumah'].map(tmp => `<button class="tr-t px-4 py-4 text-[10px] border-2 rounded-2xl font-black ${tarawihData[t]?.tempat === tmp ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-gray-50 border-transparent text-gray-400'}" data-t="${t}" data-tmp="${tmp}">${tmp.toUpperCase()}</button>`).join('')}</div></div><button class="sv-harian w-full py-5 bg-indigo-600 text-white rounded-2xl font-black shadow-lg uppercase text-xs tracking-widest" data-t="${t}">💾 SIMPAN TARAWIH</button></div>`).join('')}</div>`;
                area.querySelectorAll('.tr-s').forEach(b => b.onclick = (e) => { tarawihData[e.target.dataset.t].status = e.target.dataset.s; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.tr-t').forEach(b => b.onclick = (e) => { tarawihData[e.target.dataset.t].tempat = e.target.dataset.tmp; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.sv-harian').forEach(b => b.onclick = (e) => handleSimpanHarian(e.target.dataset.t));
            } else if (currentTab === 'Puasa') {
                area.innerHTML = `<div class="space-y-4">${days.map(t => `<div class="p-8 border-2 border-white rounded-[2.5rem] bg-white shadow-xl"><h3 class="font-black text-orange-900 mb-6 text-xl">📅 HARI KE-${t}</h3><div class="grid grid-cols-2 gap-2 mb-8">${['mengerjakan','tidak mengerjakan','sakit','haid'].map(s => `<button class="ps-s px-4 py-4 text-[10px] border-2 rounded-2xl font-black ${puasaData[t] === s ? 'bg-orange-500 text-white border-orange-500' : 'bg-gray-50 border-transparent text-gray-400'}" data-t="${t}" data-s="${s}">${s.toUpperCase()}</button>`).join('')}</div><button class="sv-harian w-full py-5 bg-orange-500 text-white rounded-2xl font-black shadow-lg uppercase text-xs tracking-widest" data-t="${t}">💾 SIMPAN PUASA</button></div>`).join('')}</div>`;
                area.querySelectorAll('.ps-s').forEach(b => b.onclick = (e) => { puasaData[e.target.dataset.t] = e.target.dataset.s; saveUserState(); renderContentArea(); });
                area.querySelectorAll('.sv-harian').forEach(b => b.onclick = (e) => handleSimpanHarian(e.target.dataset.t));
            } else {
                area.innerHTML = `<div class="p-10 text-center bg-white rounded-[2.5rem] shadow-xl"><p class="text-gray-400 font-bold uppercase tracking-widest text-sm italic">Fitur ${currentTab} segera hadir...</p></div>`;
            }
        }

        async function handleSimpanPerWaktu(tgl, wkt) {
            if (!SCHOOL_ID) return showToast("Gunakan Link dari Guru!", false);
            const status = shalatData[tgl]?.[wkt];
            if (!status) return showToast(`Pilih status shalat ${wkt}!`, false);
            const btn = document.querySelector(`.sv-wkt-btn[data-t="${tgl}"][data-w="${wkt}"]`);
            btn.disabled = true; btn.textContent = 'MENGIRIM...';
            
            const singlePrayerData = {};
            singlePrayerData[wkt] = status;

            const record = { 
                ss_id: SCHOOL_ID, 
                nama: currentUser.nama, 
                kelas: currentUser.kelas, 
                kategori: 'Shalat Fardu', 
                tanggal: tgl, 
                hadir: JSON.stringify(singlePrayerData),
                sheet: 'Shalat Fardu'
            };

            processLocalRecord(record);
            saveAllRecords();
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(record) });
                showToast(`${wkt} Berhasil Disimpan!`);
            } catch (e) { showToast("Error Cloud. Coba lagi.", false); }
            finally { btn.disabled = false; btn.textContent = `💾 SIMPAN ${wkt.toUpperCase()}`; }
        }

        async function handleSimpanHarian(tgl) {
            let detailObj = (currentTab === 'Tarawih') ? tarawihData[tgl] : { status: puasaData[tgl] };
            if (!detailObj || (currentTab === 'Tarawih' && !detailObj.status) || (currentTab === 'Puasa' && !puasaData[tgl])) return showToast("Data belum lengkap!", false);
            
            const btn = document.querySelector(`.sv-harian[data-t="${tgl}"]`);
            btn.disabled = true; btn.textContent = 'SEDANG MENGIRIM...';

            const record = { 
                ss_id: SCHOOL_ID, 
                nama: currentUser.nama, 
                kelas: currentUser.kelas, 
                kategori: currentTab, 
                tanggal: tgl, 
                hadir: JSON.stringify(detailObj),
                sheet: currentTab
            };

            processLocalRecord(record);
            saveAllRecords();

            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(record) });
                showToast(`Data Berhasil Disimpan!`);
            } catch (e) { showToast("Gagal terhubung.", false); }
            finally { btn.disabled = false; btn.textContent = `💾 SIMPAN ${currentTab.toUpperCase()}`; }
        }

        function showRekapPage() {
            const myRaw = allRecords.filter(r => r.nama === currentUser.nama && r.kelas === currentUser.kelas);
            const my = getMergedRecords(myRaw);

            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-gray-50 p-4 md:p-8">
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-white p-10 rounded-[3rem] shadow-2xl mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
                            <div>
                                <h1 class="font-black text-4xl text-emerald-800 tracking-tighter">📊 Rekap Saya</h1>
                                <p class="text-gray-400 font-bold uppercase text-[10px] tracking-widest mt-2">Aktivitas tercatat hari ini</p>
                            </div>
                            <button id="backBtn" class="px-10 py-5 bg-emerald-600 text-white font-black rounded-2xl shadow-xl active:scale-95 uppercase text-xs tracking-widest transition-all">← Kembali</button>
                        </div>
                        <div class="space-y-6">
                            ${categories.map(cat => {
                                const items = my.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
                                return `
                                    <div class="bg-white rounded-[2.5rem] shadow-xl border-t-8 border-emerald-500 overflow-hidden">
                                        <div class="p-6 bg-emerald-50/50 flex justify-between items-center border-b">
                                            <span class="font-black text-emerald-800 uppercase text-xs tracking-[0.2em]">${cat}</span>
                                            <span class="bg-white px-4 py-1 rounded-full text-[10px] font-black text-emerald-600 shadow-sm">${items.length} HARI</span>
                                        </div>
                                        <div class="divide-y divide-gray-50">
                                            ${items.length ? items.map(r => `
                                                <div class="p-6 flex gap-6 items-start hover:bg-emerald-50/20 transition-colors">
                                                    <div class="flex flex-col items-center justify-center min-w-[60px] bg-white p-3 rounded-2xl border-2 border-emerald-100 shadow-sm">
                                                        <span class="text-[8px] font-black text-emerald-300 uppercase leading-none">HARI</span>
                                                        <span class="font-black text-emerald-700 text-2xl leading-none mt-1">${r.tanggal}</span>
                                                    </div>
                                                    <div class="flex-1 text-gray-700 leading-relaxed text-sm pt-1">
                                                        ${renderDetailData(cat, r.hadir)}
                                                    </div>
                                                </div>
                                            `).join('') : '<p class="p-16 text-center text-gray-400 font-bold italic uppercase text-xs tracking-widest">Belum ada data</p>'}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            document.getElementById('backBtn').onclick = showAmalanPage;
        }

        async function fetchAllDataForAdmin() {
            if (!SCHOOL_ID) return;
            showToast("Sinkronisasi Database...", true);
            try {
                const url = new URL(GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', 'readAll');
                url.searchParams.append('ss_id', SCHOOL_ID);
                const res = await fetch(url);
                const result = await res.json();
                if (result.status === 'success') {
                    const prepared = (result.data || []).map(item => ({
                        nama: item.nama,
                        kelas: item.kelas,
                        kategori: item.kategori,
                        tanggal: item.tanggal,
                        hadir: item.detail || item.hadir
                    }));
                    allRecords = getMergedRecords(prepared);
                    saveAllRecords();
                    showLaporanPage();
                }
            } catch (e) { showToast("Gagal Sinkron.", false); }
        }

        function showLaporanPage() {
            const allS = [...new Set(allRecords.map(r => JSON.stringify({nama: r.nama, kelas: r.kelas})))].map(s => JSON.parse(s)).sort((a,b) => a.nama.localeCompare(b.nama));
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-slate-100 p-6">
                    <div class="max-w-6xl mx-auto">
                        <div class="bg-white p-10 rounded-[3rem] shadow-2xl mb-8 flex flex-col md:flex-row justify-between items-center gap-6 border-b-8 border-blue-600">
                            <h1 class="font-black text-3xl text-slate-800 tracking-tighter">📋 PANEL GURU</h1>
                            <div class="flex gap-2">
                                <button id="syncBtn" class="px-8 py-4 bg-blue-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg">🔄 Sinkron</button>
                                <button id="logoutBtn" class="px-8 py-4 bg-slate-800 text-white rounded-2xl font-black text-xs uppercase tracking-widest">Keluar</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${allS.map(s => {
                                const sRecs = allRecords.filter(r => r.nama === s.nama);
                                const uniqueDays = [...new Set(sRecs.map(r => r.tanggal))].length;
                                return `
                                    <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border-2 border-transparent hover:border-blue-500 transition-all cursor-pointer student-card" data-n="${s.nama}" data-k="${s.kelas}">
                                        <div class="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 class="font-black text-slate-800 text-xl leading-tight uppercase">${s.nama}</h3>
                                                <p class="font-bold text-blue-600 text-[10px] mt-1 tracking-widest">KELAS ${s.kelas}</p>
                                            </div>
                                            <span class="bg-blue-50 text-blue-600 text-[9px] font-black px-3 py-1 rounded-full border border-blue-100">${uniqueDays} HARI AKTIF</span>
                                        </div>
                                        <div class="mt-4 pt-4 border-t border-slate-50 flex items-center justify-between text-slate-400">
                                            <span class="text-[10px] font-bold uppercase italic">Lihat Rincian</span>
                                            <span class="text-blue-500 font-black">→</span>
                                        </div>
                                    </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            document.querySelectorAll('.student-card').forEach(c => c.onclick = (e) => {
                const d = e.currentTarget.dataset;
                showStudentDetail({ nama: d.n, kelas: d.k });
            });
            document.getElementById('syncBtn').onclick = fetchAllDataForAdmin;
            document.getElementById('logoutBtn').onclick = handleLogout;
        }

        function showStudentDetail(s) {
            const my = getMergedRecords(allRecords.filter(r => r.nama === s.nama));
            document.getElementById('app').innerHTML = `
                <div class="w-full h-full overflow-auto bg-gray-50 p-6">
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-white p-10 rounded-[3rem] shadow-2xl mb-8 flex flex-col md:flex-row justify-between items-center gap-6 border-l-[15px] border-emerald-500">
                            <div>
                                <h2 class="font-black text-4xl text-slate-800 tracking-tighter leading-none">${s.nama.toUpperCase()}</h2>
                                <p class="font-bold text-emerald-600 uppercase text-[10px] tracking-widest mt-4">AMALAN RAMADHAN • KELAS ${s.kelas}</p>
                            </div>
                            <button id="backAdmin" class="px-8 py-4 bg-slate-800 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl">← KEMBALI</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${categories.map(cat => {
                                const recs = my.filter(r => r.kategori === cat).sort((a,b) => parseInt(a.tanggal) - parseInt(b.tanggal));
                                return `
                                    <div class="bg-white p-8 rounded-[2.5rem] shadow-lg border border-slate-100">
                                        <h3 class="font-black border-b pb-4 mb-6 text-slate-700 flex items-center gap-2 uppercase text-[11px] tracking-[0.2em]">
                                            ${getCategoryIconEmoji(cat)} ${cat}
                                        </h3>
                                        <div class="space-y-4 max-h-[500px] overflow-auto no-scrollbar">
                                            ${recs.map(r => `
                                                <div class="p-5 bg-slate-50 rounded-2xl border border-slate-100 leading-relaxed hover:bg-emerald-50 transition-all">
                                                    <div class="font-black text-emerald-700 mb-2 text-[10px] uppercase tracking-widest">HARI KE-${r.tanggal}</div>
                                                    <div class="text-slate-600 text-sm">${renderDetailData(cat, r.hadir)}</div>
                                                </div>
                                            `).join('') || '<p class="text-[10px] text-gray-400 font-bold italic py-4">BELUM ADA DATA</p>'}
                                        </div>
                                    </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            document.getElementById('backAdmin').onclick = showLaporanPage;
        }

        function handleLogout() {
            safeRemoveStorage('ramadhanUser');
            location.reload();
        }

        function init() { 
            loadAllRecords(); 
            const saved = safeGetStorage('ramadhanUser'); 
            if (!SCHOOL_ID) {
                renderRegistration();
            } else {
                if (saved) { 
                    try { 
                        currentUser = JSON.parse(saved); 
                        loadUserState(); 
                        showAmalanPage(); 
                        syncUserFromCloud(); 
                    } catch(e) { showLoginPage(); } 
                } else showLoginPage();
            }
        }
        init();
    </script>
 </body>
</html>
